<!--
  arena-palette v2.0 (in progress)
  ──────────────────────────────────────────────────────────────────
  Changelog:

    v2.0 (in progress) — Rebuilt as a six-step wizard (Source, Pick image, Base palette,
                         Edit, Ramps, Export) on the toolkit design system. Plan:
                         _notes/arena-palette-notes/arena-palette-v2-build-plan.md

    v1.31 (2026-05-27) — Fix colour name lookup in all export functions (#-prefix
                         mismatch). Move theme toggle to fixed top-right corner.
                         Default colour count changed to 6.
    v1.30 (2026-05-27) — Fix colour name lookup key (#-prefix mismatch). Remove
                         Google Fonts, use Arial stack. Default channel added.
                         Sidebar tagline. Dark/midtone/light theme toggle.
    v1.29 (2026-05-25) — Remove duplicate proportion bar (keep "extracted colours"
                         only). Fix colour name lookup key (slice # prefix).
                         Extend patchColorLabels to update palette legend.
                         Remove channel slug overlays from thumbnail grid.
                         URL auto-parsing for channel inputs (paste or blur).
    v1.28 (2026-05-25) — Split export rgb + hsl into two separate files
                         (export rgb → -rgb.txt, export hsl → -hsl.txt).
    v1.27 (2026-05-25) — Add extracted palette section (bar + legend)
                         between proportion bar and semantic bar.
    v1.26 (2026-05-25) — Unified swatchLabel across all exports: #hex Name
                         (xx%) tint/shade N. New order: palette, semantic,
                         tints/shades in all text exports. CSS vars now
                         name-slugged (--cinnabar-base etc). SCP JSON
                         restructured to palette/semantic/tintsShades.
                         Credit block: title → desc → source → via →
                         view on are.na.
    v1.25 (2026-05-25) — Credit block: "via" moved below description.
                         Palette column reordered: proportion bar,
                         semantic bar, exports, then tints/shades.
                         Export order (ASE/GPL/Procreate): base
                         colours, semantic palette, tints/shades.
                         tokenHint link colour fixed.
    v1.24 (2026-05-25) — Add ase, gpl and procreate exporters
    v1.23 (2026-04-14) — Three-column layout. No top header bar. h1 branding
                         moves to sidebar top on dark bg. Channels section
                         collapsible (open by default, auto-closes when images
                         load). Image column: h2 "Select an image" transitions
                         to block title on selection. Metadata below image:
                         title, are.na link, via user, source+date, description
                         with show more toggle. Block data extended to include
                         description, source, user, created_at.
                         Responsive: ≤1100px sidebar + stacked cols; ≤600px
                         full stack.
    v1.22 (2026-04-14) — Remove all inline styles and spacer divs.
    v1.21a (2026-04-13) — Colour token correction.
    v1.21 (2026-04-13) — Accessibility and contrast pass.
    v1.20 (2026-04-13) — Colour naming via api.color.pizza.
    v1.19 (2026-04-13) — Clean layout rewrite.

  API: Are.na REST API v3 — https://www.are.na/developers/explore
  Colour naming: api.color.pizza v1 — https://github.com/meodai/color-name-api
  Dependencies: Color Thief 3.5.0 (inlined from src/third_party/), Karla + Courier Prime
  ──────────────────────────────────────────────────────────────────
-->

    </div>
  </main>
