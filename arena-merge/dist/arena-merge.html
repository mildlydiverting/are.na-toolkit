  // 'system' (or anything unknown) falls through to the system light/dark setting.
  function resolveTheme(opts) {
    opts = opts || {};
    var ids = themeIds(opts.themes);
    if (ids.indexOf(opts.asked) !== -1) return opts.asked;
    if (ids.indexOf(opts.saved) !== -1) return opts.saved;
    var wanted = opts.prefersDark ? 'dark' : 'light';
    return ids.indexOf(wanted) !== -1 ? wanted : ids[0];
  }

  // Pure: which menu entry is selected: ?theme=, else the saved theme, else 'system'.
  function themeChoice(opts) {
    opts = opts || {};
    var ids = themeIds(opts.themes);
    if (ids.indexOf(opts.asked) !== -1) return opts.asked;
    if (ids.indexOf(opts.saved) !== -1) return opts.saved;
    return 'system';
  }

  function ThemeChooser(opts) {
    opts = opts || {};
    var themes = opts.themes || THEME_OPTIONS;
    var entries = opts.system === false ? themes : themes.concat([SYSTEM_OPTION]);
    var key = opts.storageKey || THEME_KEY;
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    function read() { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function write(value) { try { localStorage.setItem(key, value); } catch (e) { /* private mode */ } }

    var choice = themeChoice({
      themes: themes,
      asked: new URLSearchParams(location.search).get('theme'),
      saved: read()
    });
    function apply() {
      document.documentElement.setAttribute('data-theme', resolveTheme({
        themes: themes,
        asked: choice === 'system' ? null : choice,
        prefersDark: !!(mq && mq.matches)
      }));
    }
    apply();
    // While on System, follow the operating system as it changes.
    if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (choice === 'system') apply(); });

    var root = el('div', { className: 'atk-theme-chooser' });
    var button = el('button', {
      className: 'atk-theme-chooser__button',
      type: 'button',
      title: 'Theme',
      'aria-label': 'Choose theme',
      'aria-haspopup': 'menu',
      'aria-expanded': 'false'
    }, svgSpan(PALETTE_SVG));
    var popover = null;

    function close(returnFocus) {
      if (!popover) return;
      popover.remove();
      popover = null;
      button.setAttribute('aria-expanded', 'false');
      if (returnFocus) button.focus();
    }

    function choose(id) {
      choice = id;
      apply();
      write(id);
      close(true);
      if (typeof opts.onChange === 'function') opts.onChange(id);
    }

    function open() {
      var menuItems = [];
      entries.forEach(function (t) {
        // System sits apart from the named themes.
        if (t === SYSTEM_OPTION && themes.length) menuItems.push({ separator: true });
        menuItems.push({
          label: t.label,
          icon: t.id === choice ? svgSpan(CHECK_SVG) : el('span'),
          onClick: function () { choose(t.id); }
        });
      });
      var menu = Menu({ items: menuItems });
      var items = Array.prototype.slice.call(menu.querySelectorAll('.atk-menu__item'));
      items.forEach(function (item, i) {
        item.setAttribute('role', 'menuitemradio');
        item.setAttribute('aria-checked', String(entries[i].id === choice));
      });
      menu.addEventListener('keydown', function (e) {
        var i = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      });
      popover = el('div', { className: 'atk-theme-chooser__popover' }, menu);
      root.appendChild(popover);
      button.setAttribute('aria-expanded', 'true');
      var selected = items[entries.map(function (t) { return t.id; }).indexOf(choice)];
      (selected || items[0]).focus();
    }

    button.addEventListener('click', function () { if (popover) close(); else open(); });
    document.addEventListener('click', function (e) { if (popover && !root.contains(e.target)) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && popover) close(true); });

    root.appendChild(button);
    return root;
  }
  ThemeChooser.resolve = resolveTheme;
  ThemeChooser.choice = themeChoice;

  /* ── ChannelRow / ChannelList ──────────────────────────────────
     A channel as a coloured bar: badge, name, block count, metadata count,
     owner, caret. Opens (a <details>) to show whatever you pass as children.
     ChannelList stacks rows and adds an optional sort menu; sorting itself
     is yours: re-order with list.setRows(). */

  var CHEVRON_SVG =
    '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>';

  function ChannelRow(opts) {
    opts = opts || {};
    var visibility = opts.visibility || 'closed';
    var badgeVariant = { public: 'success', private: 'private' }[visibility] || 'default';
    var caret = svgSpan(CHEVRON_SVG);
    caret.className = 'atk-channel-row__caret';
    var summary = el('summary', null, [
      Badge({ variant: badgeVariant, children: visibility }),
      el('span', { className: 'atk-channel-row__title' }, opts.title),
      opts.count != null
        ? el('span', { className: 'atk-channel-row__count', title: 'Blocks in this channel' }, String(opts.count))
        : null,
      opts.metadataCount != null
        ? el('span', { title: 'Metadata entries' }, Badge({ children: String(opts.metadataCount) }))
        : null,
      opts.owner ? el('span', { className: 'atk-channel-row__owner' }, opts.owner) : null,
      caret
    ]);
    return el('details', {
      className: 'atk-channel-row',
      'data-visibility': visibility,
      open: opts.open ? true : null
    }, [summary, el('div', { className: 'atk-channel-row__body' }, opts.children)]);
  }

  var channelListCount = 0;

  function ChannelList(opts) {
    opts = opts || {};
    var root = el('div', { className: 'atk-channel-list' });
    var rowsEl = el('div', { className: 'atk-channel-list__rows' });
    var toolbar = null;
    if (opts.sorts && opts.sorts.length) {
      var select = Select({
        options: opts.sorts,
        value: opts.sortValue || opts.sorts[0].value,
        onChange: function (e) { if (opts.onSort) opts.onSort(e.target.value); }
      });
      select.id = 'atk-channel-sort-' + (++channelListCount);
      toolbar = el('div', { className: 'atk-channel-list__toolbar', hidden: true }, [
        el('label', { for: select.id }, opts.sortLabel || 'Sort'),
        select
      ]);
      root.appendChild(toolbar);
    }
    root.appendChild(rowsEl);

    // Replace the list's contents. Rows you pass again are moved, not rebuilt, so open rows stay open.
    // The sort menu shows once there are two or more. A single node (a message) works too.
    root.setRows = function (nodes) {
      rowsEl.replaceChildren.apply(rowsEl, nodes);
      if (toolbar) toolbar.hidden = nodes.length < 2;
    };
    root.setRows(opts.rows || []);
    return root;
  }

  /* ── StatusMessage: one inline line for progress, success and errors ── */
  function StatusMessage(opts) {
    opts = opts || {};
    var tone = opts.tone || 'info';
    var kids = [];
    if (tone === 'error' || tone === 'success') {
      kids.push(el('span', { className: 'atk-status__icon', 'aria-hidden': 'true' }, tone === 'error' ? '\u26A0' : '\u2713'));
    }
    if (opts.label) kids.push(el('strong', null, opts.label + '.'));
    kids = kids.concat(opts.children == null ? [] : opts.children);
    return el('p', {
      className: 'atk-status atk-status--' + tone,
      role: tone === 'error' ? 'alert' : 'status'
    }, kids);
  }

  /* ── Accounts: names and initials come from are.na's user object ── */
  function accountName(user) {
    return (user && (user.name || user.full_name || user.slug)) || '';
  }

  // The API's own `initials` when present, else the first letters of the name ("Kim Plowright" -> "KP").
  function accountInitials(user) {
    if (user && user.initials) return String(user.initials).slice(0, 2).toUpperCase();
    var name = (accountName(user) || '?').trim();
    return name.split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase() || '?';
  }

  function Avatar(user) {
    return el('span', { className: 'atk-avatar', 'aria-hidden': 'true' }, accountInitials(user));
  }

  /* ── AccountMenu: the header block. [Connect →] or [avatar] name [Disconnect] ── */
  function AccountMenu(opts) {
    opts = opts || {};
    var root = el('div', { className: 'atk-account' });
    root.setUser = function (user) {
      if (!user) {
        root.replaceChildren(Button({
          variant: 'ghost', size: 'sm',
          children: opts.connectLabel || 'Connect \u2192',
          onClick: opts.onConnect
        }));
        return;
      }
      root.replaceChildren(
        Avatar(user),
        el('span', { className: 'atk-account__name' }, accountName(user)),
        Button({ variant: 'ghost', size: 'sm', children: opts.disconnectLabel || 'Disconnect', onClick: opts.onDisconnect })
      );
    };
    root.setUser(opts.user || null);
    return root;
  }
  AccountMenu.displayName = accountName;
  AccountMenu.initials = accountInitials;

  /* ── AuthPanel: the token form and the signed-in chip. No requests, no storage:
        the caller (shared/widgets/auth-step.js) owns those and calls update(). ── */
  function AuthPanel(opts) {
    opts = opts || {};
    var state = {
      user: null, detail: null, status: null,
      requireWrite: !!opts.requireWrite, writeMessage: opts.writeMessage || null,
      remember: opts.remember !== false
    };
    var panel = !!opts.panel;
    var root = el('div', { className: 'atk-auth' });

    function status(s) {
      return s ? StatusMessage({ tone: s.tone, label: s.label, children: s.message }) : null;
    }

    function rememberCheck() {
      var box = el('input', { type: 'checkbox' });
      box.checked = state.remember;
      box.addEventListener('change', function () {
        state.remember = box.checked;
        if (opts.onRememberChange) opts.onRememberChange(box.checked);
      });
      return el('label', { className: 'atk-auth__remember' }, [
        box,
        el('span', null, [
          'Remember on this computer',
          el('br'),
          el('span', { className: 'atk-auth__hint' }, 'Unticked, it is forgotten when you close the tab.')
        ])
      ]);
    }

    function chip() {
      var u = state.user;
      var who = el('div', { className: 'atk-auth__who' }, ['Signed in as ', el('strong', null, accountName(u))]);
      if (state.detail) {
        who.appendChild(el('br'));
        who.appendChild(el('span', { className: 'atk-auth__hint' }, state.detail));
      }
      return el('div', { className: 'atk-auth__chip' }, [
        Avatar(u), who,
        Button({ variant: 'ghost', size: 'sm', children: 'Disconnect', onClick: opts.onDisconnect })
      ]);
    }

    function form() {
      var link = Link({ href: opts.tokenUrl, children: 'personal access token' });
      link.target = '_blank';
      link.rel = 'noopener';
      var intro = el('p', { className: 'atk-auth__intro' }, [panel ? 'Create a ' : 'Paste a ', link]);
      if (state.requireWrite) {
        intro.appendChild(document.createTextNode(panel
          ? ' with read and write ticked, then paste it below. The token stays in your browser only.'
          : ' with the write scope ticked. This tool changes your account: it adds and removes connections and edits blocks, so a read-only token will not work.'));
      } else {
        intro.appendChild(document.createTextNode(' with read access. That is all this tool needs. Some content, including private channels, only shows up once you are connected.'));
      }

      var input = Input({ type: 'password', placeholder: panel ? 'paste it here' : 'Paste your token here' });
      input.id = 'arena-token';
      input.autocomplete = 'off';
      input.spellcheck = false;
      var submit = function () { if (opts.onConnect) opts.onConnect(input.value); };
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
      var row = el('div', { className: 'atk-auth__row' }, [
        input,
        Button({ variant: panel ? 'secondary' : 'primary', children: 'Connect', onClick: submit })
      ]);

      var kids = [];
      if (state.writeMessage) kids.push(el('p', { className: 'atk-auth__message' }, state.writeMessage));
      kids.push(intro);
      if (panel) {
        var label = el('label', { className: 'atk-auth__label', 'for': 'arena-token' }, 'Personal access token');
        kids.push(label, row, rememberCheck());
      } else {
        kids.push(row, el('p', { className: 'atk-auth__note' }, 'Your token stays in this browser and is only ever sent to are.na.'));
      }
      kids.push(status(state.status));
      return kids;
    }

    function render() {
      var kids;
      if (state.user && panel) {
        kids = [status(state.status), chip()];
      } else if (state.user) {
        kids = [el('div', { className: 'atk-auth__row atk-auth__row--center' }, [
          Badge({ variant: 'success', children: 'Connected as @' + state.user.slug }),
          Button({ variant: 'ghost', size: 'sm', children: 'Disconnect', onClick: opts.onDisconnect })
        ])];
      } else {
        kids = form();
      }
      root.replaceChildren.apply(root, kids.filter(Boolean));
    }

    // Merges these keys into the state and redraws: user, detail, status {tone,label,message}, requireWrite, writeMessage, remember.
    root.update = function (next) {
      for (var k in next) { if (Object.prototype.hasOwnProperty.call(next, k)) state[k] = next[k]; }
      render();
    };
    render();
    return root;
  }

  /* ── Checkbox, Radio, Progress, StatGrid, StatusLog, Footer ── */

  // (which means publishing it to the design-system artifact, so it needs Kim's go-ahead).
  // A native input sits inside the label, so keyboard, focus and screen readers behave as usual.
  function Checkbox({ label, description, checked = false, disabled = false, indeterminate = false, name, id, onChange } = {}) {
    const h = el;
    const input = h('input', { type: 'checkbox', className: 'atk-checkbox-input', checked, disabled });
    if (name) input.name = name;
    if (id) input.id = id;
    input.indeterminate = indeterminate;
    if (onChange) input.addEventListener('change', () => onChange(input.checked));

    const box = h('span', { className: 'atk-checkbox-box', 'aria-hidden': 'true' });
    box.innerHTML = '<svg class="atk-checkbox-tick" viewBox="0 0 12 12" width="12" height="12"><path d="M2.5 6.5l2.5 2.5 4.5-5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="atk-checkbox-bar"></span>';

    const text = h('span', { className: 'atk-checkbox-text' }, [
      h('span', { className: 'atk-checkbox-label' }, label),
      description ? h('span', { className: 'atk-checkbox-desc' }, description) : null,
    ].filter(Boolean));

    return h('label', { className: 'atk-checkbox' }, [input, box, text]);
  }

  // A native radio input sits inside the label, so arrow keys, focus and screen readers behave as usual.
  function Radio({ label, description, value, name, checked = false, disabled = false, onChange } = {}) {
    const h = el;
    const input = h('input', { type: 'radio', className: 'atk-radio-input', checked, disabled, name, value });
    if (onChange) input.addEventListener('change', () => { if (input.checked) onChange(value); });

    const ring = h('span', { className: 'atk-radio-ring', 'aria-hidden': 'true' }, h('span', { className: 'atk-radio-dot' }));
    const text = h('span', { className: 'atk-radio-text' }, [
      h('span', { className: 'atk-radio-label' }, label),
      description ? h('span', { className: 'atk-radio-desc' }, description) : null,
    ].filter(Boolean));
    return h('label', { className: 'atk-radio' }, [input, ring, text]);
  }

  //   StatGrid({ items: [{ key, label, value = 0 }] })
  //   grid.update({ added: 3, failed: 0 })   changes the named counts in place
  function StatGrid({ items = [] } = {}) {
    const h = el;
    const values = {};
    const root = h('div', { className: 'atk-stats' });
    items.forEach(({ key, label, value = 0 }) => {
      values[key] = h('span', { className: 'atk-stat__value' }, String(value));
      root.appendChild(h('div', { className: 'atk-stat' }, [values[key], h('span', { className: 'atk-stat__label' }, label)]));
    });
    root.update = (next = {}) => {
      Object.keys(next).forEach(k => { if (values[k]) values[k].textContent = String(next[k]); });
    };
    return root;
  }

  //   StatusLog({ label = 'Details', open = false })
  //   log.add('success' | 'message' | 'warning' | 'error', text)     log.clear()
  // Colour is never the only signal: success, warning and error lines carry a spoken prefix for screen readers.
  function StatusLog({ label = 'Details', open = false } = {}) {
    const h = el;
    const SPOKEN = { success: 'Success: ', warning: 'Warning: ', error: 'Error: ' };   // 'message' has none
    const body = h('div', { className: 'atk-log__body', role: 'log' });
    const root = h('details', { className: 'atk-log', open }, [h('summary', { className: 'atk-log__summary' }, label), body]);
    root.add = (tone, text) => {
      const line = h('div', { className: 'atk-log__line is-' + tone });
      if (SPOKEN[tone]) line.appendChild(h('span', { className: 'atk-sr' }, SPOKEN[tone]));
      line.appendChild(document.createTextNode(text));
      body.appendChild(line);
      body.scrollTop = body.scrollHeight;
    };
    root.clear = () => body.replaceChildren();
    return root;
  }

  //   Footer({ toolNote, homeHref })   toolNote: optional string or node, shown first under the heading. homeHref: the collection's index page.
  // Put <footer id="footer"></footer> in the page and call document.getElementById('footer').replaceWith(ArenaToolkit.Footer({...})).
  function Footer({ toolNote = null, homeHref = '../index.html' } = {}) {
    const h = el;
    const a = (href, text) => h('a', { href, target: '_blank', rel: 'noopener' }, text);
    const REPO = 'https://github.com/mildlydiverting/are.na-toolkit';
    return h('footer', { className: 'atk-footer' }, [
      h('h2', { className: 'atk-footer__title' }, 'About'),
      toolNote ? h('p', null, toolNote) : null,
      h('p', null, ['Runs locally in your browser. Your data is only sent to ', a('https://www.are.na/developers', h('code', null, 'api.are.na')), '.']),
      h('p', null, [
        'Part of a collection of ', h('a', { href: homeHref }, 'Are.na Tools and Toys'),
        ' built on the ', a('https://www.are.na/developers', 'are.na API'), ' by ', a('https://www.mildlydiverting.com', 'Kim Plowright'),
        '. Not affiliated with or endorsed by ', a('https://www.are.na', 'are.na'), '.',
      ]),
      h('p', null, [
        h('em', null, 'Vibe-coded.'),
        " This tool was built with an AI assistant (and a slight sheepish sense of guilt). It works for me and is tested, but no guarantees the robot and I haven't fucked it up somehow: try it on something unimportant first, and use the dry run options to check it does what you expect. Source on ",
        a(REPO, 'GitHub'), ' under the ', a(`${REPO}/blob/main/LICENSE`, 'MIT license'), '. Found a bug? Let me know in ',
        a(`${REPO}/issues`, 'GitHub issues'), '. Be kind, I am a gentle soul.',
      ]),
      h('p', null, [
        'Want to know more? Find me on ', a('https://www.are.na/kim-plowright', 'Are.na'), ', ',
        a('https://www.instagram.com/mildlydiverting/', 'Instagram'), ', ',
        a('https://bsky.app/profile/mildlydiverting.bsky.social', 'Bluesky'), ', get my ',
        a('https://www.mildlydiverting.com/newsletter', 'newsletter'), ' or ',
        a('https://www.mildlydiverting.com/classes-workshops-teaching', 'come to my drawing classes in Canterbury or Ramsgate, UK'), '.',
      ]),
    ].filter(Boolean));
  }

  // Progress: a thin bar with a label row.
  // Finite (value and max > 0) or indeterminate (no value, or no usable max): update() can switch between them at any time.
  //   Progress({ value, max, label, detail, variant })   variant: 'default' | 'success' | 'alert'
  //   bar.update({ value, max, label, detail, variant })  changes only the keys you pass
  // detail is text or a node. aria-valuetext is built from label + detail, so a screen reader says
  // "Dry run: merging, 16 of 20" rather than just "80%".

  // Pure: what the bar should show for a value and a max.
  function progressModel({ value = null, max = 100 } = {}) {
    const finite = value != null && Number.isFinite(value) && Number.isFinite(max) && max > 0;
    if (!finite) return { indeterminate: true, pct: null, now: null, max: null };
    const now = Math.min(max, Math.max(0, value));
    return { indeterminate: false, pct: (now / max) * 100, now, max };
  }

  // Pure: the text a node or string contributes to a spoken description.
  function plainText(x) {
    if (x == null) return '';
    return typeof x === 'string' ? x : String(x.textContent ?? '');
  }

  // Pure: "label, detail" for aria-valuetext.
  function spokenProgress({ label = '', detail = '' } = {}) {
    return [plainText(label), plainText(detail)].filter(Boolean).join(', ');
  }

  function Progress(initial = {}) {
    const h = el;
    const state = { value: null, max: 100, label: '', detail: '', variant: 'default', ...initial };
    const labelEl = h('span', { className: 'atk-progress-label' });
    const detailEl = h('span', { className: 'atk-progress-detail' });
    const fill = h('div', { className: 'atk-progress-fill' });
    const track = h('div', { className: 'atk-progress-track', role: 'progressbar', 'aria-valuemin': '0' }, fill);
    const root = h('div', { className: 'atk-progress' }, [
      h('div', { className: 'atk-progress-row' }, [labelEl, detailEl]),
      track,
    ]);

    function render() {
      const m = progressModel(state);
      root.className = `atk-progress atk-progress--${state.variant}${m.indeterminate ? ' is-indeterminate' : ''}`;
      labelEl.textContent = state.label;
      if (typeof state.detail === 'string' || state.detail == null) detailEl.textContent = state.detail ?? '';
      else detailEl.replaceChildren(state.detail);
      if (m.indeterminate) {
        track.removeAttribute('aria-valuenow');
        track.removeAttribute('aria-valuemax');
        fill.style.width = '';
      } else {
        track.setAttribute('aria-valuemax', String(m.max));
        track.setAttribute('aria-valuenow', String(m.now));
        fill.style.width = `${m.pct}%`;
      }
      track.setAttribute('aria-label', plainText(state.label) || 'Progress');
      const spoken = spokenProgress(state);
      if (spoken) track.setAttribute('aria-valuetext', spoken); else track.removeAttribute('aria-valuetext');
    }

    root.update = function update(next = {}) {
      for (const k of ['value', 'max', 'label', 'detail', 'variant']) if (k in next) state[k] = next[k];
      render();
    };
    render();
    return root;
  }
  Progress.model = progressModel;
  Progress.spoken = spokenProgress;

  window.ArenaToolkit = {
    Checkbox: Checkbox,
    Radio: Radio,
    Progress: Progress,
    StatGrid: StatGrid,
    StatusLog: StatusLog,
    Footer: Footer,
    ChannelRow: ChannelRow,
    ChannelList: ChannelList,
    ThemeChooser: ThemeChooser,
    StatusMessage: StatusMessage,
    AccountMenu: AccountMenu,
    AuthPanel: AuthPanel,
    Button: Button,
    Input: Input,
    Link: Link,
    Card: Card,
    Badge: Badge,
    Block: Block,
    Modal: Modal,
    Menu: Menu,
    KeyChip: KeyChip,
    Select: Select,
    Textarea: Textarea,
    Tabs: Tabs,
    Stepper: Stepper,
    _el: el
  };
}());

</script>
<script>
// are.na v3 client. Endpoints checked against https://api.are.na/v3/openapi.json.
// Writes (updateBlock, createConnection, deleteConnection) need a token with write scope.
const ARENA_API_BASE = 'https://api.are.na/v3';

class ArenaError extends Error {
  constructor(status, message, body) {
    super(message);
    this.name = 'ArenaError';
    this.status = status;
    this.body = body;
  }
}

// throttle: the function from createThrottle(); omit in tests to call fetch directly.
function createArenaClient({ token = null, fetchImpl = (...a) => globalThis.fetch(...a), throttle = null, base = ARENA_API_BASE } = {}) {
  let currentToken = token;

  // params go in the query string; opts.body (if any) is sent as JSON.
  async function request(path, params = {}, { method = 'GET', body = null } = {}) {
    const url = new URL(base + path);
    for (const [k, v] of Object.entries(params)) {
      if (v != null) url.searchParams.set(k, String(v));
    }
    const doFetch = () => fetchImpl(url.toString(), {
      method,
      headers: {
        Accept: 'application/json',
        ...(body ? { 'Content-Type': 'application/json' } : {}),
        ...(currentToken ? { Authorization: `Bearer ${currentToken}` } : {}),
      },
      ...(body ? { body: JSON.stringify(body) } : {}),
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
    });
    const res = throttle ? await throttle(doFetch, { write: method !== 'GET' }) : await doFetch();

    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = null; }

    if (!res.ok) {
      const msg = data?.details?.message || data?.error || `are.na error ${res.status}`;
      throw new ArenaError(res.status, msg, data);
    }
    return data;
  }

  // Follows meta.has_more_pages and returns every item in `data`. onPage(items, meta) fires per page.
  async function paginate(path, params = {}, { per = 100, onPage = null } = {}) {
    const all = [];
    for (let page = 1; ; page++) {
      const body = await request(path, { ...params, page, per });
      const items = body?.data || [];
      all.push(...items);
      if (onPage) onPage(items, body?.meta);
      if (!body?.meta?.has_more_pages) return all;
    }
  }

  return {
    setToken(t) { currentToken = t || null; },
    request,
    paginate,
    getCurrentUser: () => request('/me'),
    getBlock: id => request(`/blocks/${encodeURIComponent(id)}`),
    getBlockConnections: (id, opts = {}) => paginate(`/blocks/${encodeURIComponent(id)}/connections`, {}, opts),
    getChannel: idOrSlug => request(`/channels/${encodeURIComponent(idOrSlug)}`),
    // Every block/channel in a channel. Each item carries `connection.id`, which deleteConnection needs.
    // params: { type } filters to Text, Image, Link, Attachment, Embed, Channel or Block.
    getChannelContents: (idOrSlug, params = {}, opts = {}) => paginate(`/channels/${encodeURIComponent(idOrSlug)}/contents`, params, opts),

    // A user's own contents (as arena-merge does it). params: { type: 'Channel' } for just their channels.
    getUserContents: (userId, params = {}, opts = {}) => paginate(`/users/${encodeURIComponent(userId)}/contents`, params, opts),

    // fields: any of title, description, alt_text (Image blocks), metadata (merged; null deletes a key).
    // Owner only.
    updateBlock: (id, fields) => request(`/blocks/${encodeURIComponent(id)}`, {}, { method: 'PUT', body: fields }),
    // Connects a block (or channel) into one or more channels. Resolves to the created Connection[].
    // channels: ids or slugs, or { id, position?, metadata? } objects.
    createConnection: async ({ id, type = 'Block', channels }) => {
      const res = await request('/connections', {}, {
        method: 'POST',
        body: {
          connectable_id: id,
          connectable_type: type,
          channels: channels.map(c => (typeof c === 'object' ? c : { id: c })),
        },
      });
      return res?.data || [];
    },
    // fields: any of title, description, status ('public' | 'closed' | 'private'). Owner or collaborator.
    updateChannel: (idOrSlug, fields) => request(`/channels/${encodeURIComponent(idOrSlug)}`, {}, { method: 'PUT', body: fields }),
    // Takes the *connection* id (from a channel's contents, or createConnection), not a block id.
    // Removes the block from that channel only; the block itself stays. Resolves to null (204).
    deleteConnection: connectionId => request(`/connections/${encodeURIComponent(connectionId)}`, {}, { method: 'DELETE' }),
  };
}

</script>
<script>
// Polite pacing for are.na: 150 ms between requests, and on 429 back off [2, 4, 8] s,
// honouring Retry-After. Wraps a function that returns a fetch Response.
const THROTTLE_GAP_MS = 150;
const THROTTLE_BACKOFF_S = [2, 4, 8];

// onWait(seconds, attempt) is called before each backoff sleep, so the UI can say so.
// writeGap (default: same as gap) is the pause after a write, for tools that want to be gentler when
// changing an account. Call throttled(doFetch, { write: true }) for writes; everything else is a read.
function createThrottle({
  gap = THROTTLE_GAP_MS,
  writeGap = gap,
  backoff = THROTTLE_BACKOFF_S,
  sleep = ms => new Promise(r => setTimeout(r, ms)),
  now = () => Date.now(),
  onWait = null,
} = {}) {
  let nextSlot = 0;

  // Reserve the next start time synchronously, so concurrent callers queue up in order.
  async function takeSlot(spacing) {
    const start = Math.max(now(), nextSlot);
    nextSlot = start + spacing;
    const wait = start - now();
    if (wait > 0) await sleep(wait);
  }

  return async function throttled(doFetch, { write = false } = {}) {
    for (let attempt = 0; ; attempt++) {
      await takeSlot(write ? writeGap : gap);
      const res = await doFetch();
      if (res.status !== 429 || attempt >= backoff.length) return res;
      const retryAfter = Number(res.headers?.get?.('retry-after'));
      const seconds = retryAfter > 0 ? retryAfter : backoff[attempt];
      if (onWait) onWait(seconds, attempt + 1);
      await sleep(seconds * 1000);
    }
  };
}

</script>
<script>
// PAT connect widget: paste a token, test it against /me, remember it in localStorage.
// The look is ArenaToolkit.AuthPanel (docs in shared/ui/AuthPanel/). Options for tools that change things:
//  - requireWrite: the token is checked for write scope before it is accepted or saved.
//  - writeMessage: a line shown above the form, e.g. "Editing needs a token with write access."
//  - For a page that is read-only until asked: leave requireWrite off, call ensureWrite() (true / false /
//    null for not connected), and if it is not true call setRequireWrite(true, message) and open the form.
//  - panel: arena-merge's Connect layout: a labelled field, a "Remember on this computer"
//    checkbox (unticked, the token lives in sessionStorage and goes with the tab), and an
//    account chip once connected. loadDetail(user) can fetch the chip's second line.
const AUTH_STORAGE_KEY = 'arena_toolkit_pat';
const AUTH_TOKEN_URL = 'https://www.are.na/settings/personal-access-tokens';

function readSavedToken(storage, key = AUTH_STORAGE_KEY) {
  try { return storage.getItem(key) || null; } catch { return null; }
}

function saveToken(storage, token, key = AUTH_STORAGE_KEY) {
  try { storage.setItem(key, token); } catch { /* private window or blocked storage: carry on unsaved */ }
}

function clearToken(storage, key = AUTH_STORAGE_KEY) {
  try { storage.removeItem(key); } catch { /* nothing to clear */ }
}

function describeConnectError(err) {
  if (err?.status === 401) return "are.na didn't recognise that token. Check it was copied whole.";
  if (err?.status === 429) return 'are.na is asking us to slow down. Try again in a minute.';
  if (err?.status) return `are.na said: ${err.message}`;
  return "Couldn't reach are.na. Check your connection and try again.";
}

// DELETE /connections/0 never matches anything: 403 means a read-only token, 404 means write is allowed.
// (The trick arena-merge and to-arena use; nothing is changed either way.)
async function checkWriteAccess(client) {
  try {
    await client.deleteConnection(0);
    return true;
  } catch (err) {
    if (err?.status === 403) return false;
    if (err?.status === 404) return true;
    throw err;
  }
}

// Remembers whether the connected token can write, so a page can ask "can I edit?" without a request each time.
// Call reset() when the token changes; mark(true) when a connect has already proved write access.
function createWriteGate(client) {
  let answer = null;
  return {
    mark(value) { answer = value; },
    reset() { answer = null; },
    // true / false from the cache or one probe. A failed probe (401, offline) throws and caches nothing.
    async check() {
      if (answer === null) answer = await checkWriteAccess(client);
      return answer;
    },
  };
}

// client: from createArenaClient(). onChange(user | null) fires on connect and disconnect.
// The look is ArenaToolkit.AuthPanel; this keeps the token, the checks and the storage.
function createAuthStep({
  client,
  storage = globalThis.localStorage,
  session = globalThis.sessionStorage,
  storageKey = AUTH_STORAGE_KEY,
  onChange = null,
  requireWrite: initialRequireWrite = false,
  writeMessage: initialWriteMessage = null,
  panel = false,
  loadDetail = null,
} = {}) {
  let requireWrite = initialRequireWrite;
  let writeMessage = initialWriteMessage;
  const writeGate = createWriteGate(client);
  let user = null;
  let detail = null;
  let remember = true;

  const element = window.ArenaToolkit.AuthPanel({
    panel,
    tokenUrl: AUTH_TOKEN_URL,
    onConnect: (token) => connect(token),
    onDisconnect: () => disconnect(),
    onRememberChange: (value) => { remember = value; },
  });

  // status: null, or { tone: 'error' | 'info', label?, message }
  function render(status = null) {
    element.update({ user, detail, status, requireWrite, writeMessage, remember });
  }

  const failure = (label, message) => ({ tone: 'error', label, message });
  const progress = (message) => ({ tone: 'info', message });

  async function connect(rawToken) {
    const token = String(rawToken || '').trim();
    if (!token) {
      render(failure('No token', 'Paste a token first.'));
      return null;
    }
    render(progress('Checking token…'));
    client.setToken(token);
    writeGate.reset();
    try {
      user = await client.getCurrentUser();
    } catch (err) {
      client.setToken(null);
      render(failure("Couldn't connect", describeConnectError(err)));
      return null;
    }
    if (requireWrite) {
      let writable = false;
      try {
        writable = await checkWriteAccess(client);
      } catch (err) {
        client.setToken(null);
        user = null;
        render(failure("Couldn't connect", describeConnectError(err)));
        return null;
      }
      if (!writable) {
        client.setToken(null);
        user = null;
        render(failure('Read-only token', "This token can't write. Create a new one with the write scope ticked."));
        return null;
      }
      writeGate.mark(true);
    }
    // Remembered tokens go to localStorage; otherwise sessionStorage, which goes with the tab.
    clearToken(storage, storageKey);
    clearToken(session, storageKey);
    saveToken(remember ? storage : session, token, storageKey);
    detail = null;
    if (loadDetail) {
      render(progress('Loading your channels…'));
      try { detail = await loadDetail(user); } catch { detail = null; }
    }
    render();
    if (onChange) onChange(user);
    return user;
  }

  // Re-connect with a saved token, if there is one. Returns the user or null.
  async function restore() {
    const inLocal = readSavedToken(storage, storageKey);
    const saved = inLocal || readSavedToken(session, storageKey);
    if (!saved) { render(); return null; }
    remember = !!inLocal;
    const result = await connect(saved);
    if (!result) { clearToken(storage, storageKey); clearToken(session, storageKey); }
    return result;
  }

  // Can the connected token write? true / false, or null when nobody is connected.
  // Checked once per token (the DELETE /connections/0 probe); throws on 401 or a network error.
  async function ensureWrite() {
    if (!user) return null;
    return writeGate.check();
  }

  // Switch to write mode, for a page that is read-only until the person asks to edit.
  // message appears above the form. A connected token is dropped so the form can take a write token.
  // setRequireWrite(false) puts the widget back to its read-only wording.
  function setRequireWrite(enabled = true, message = null) {
    requireWrite = !!enabled;
    writeMessage = enabled ? message : null;
    if (enabled && user) disconnect();
    else render();
  }

  function disconnect() {
    user = null;
    detail = null;
    writeGate.reset();
    client.setToken(null);
    clearToken(storage, storageKey);
    clearToken(session, storageKey);
    render();
    if (onChange) onChange(null);
  }

  render();
  return { element, connect, restore, disconnect, ensureWrite, setRequireWrite, getUser: () => user };
}

</script>
<script>
// Multi-select channel picker, lifted from arena-merge's single-select dialog.
// Knows nothing about what the channels are for: give it channels and the ids already
// chosen, get the new ids back through onConfirm. Built from ArenaToolkit components.

// Case-insensitive match on title or slug. An empty query matches everything.
function filterChannels(channels, query) {
  const q = String(query || '').toLowerCase().trim();
  if (!q) return channels;
  return channels.filter(c => (c.title || '').toLowerCase().includes(q) || (c.slug || '').toLowerCase().includes(q));
}

// Returns a new array with id added or removed, keeping the order picked.
function toggleId(ids, id) {
  return ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id];
}

// What a click on a row does: in multiple mode it toggles; in single mode it chooses just that one.
function selectId(ids, id, multiple = true) {
  return multiple ? toggleId(ids, id) : [id];
}

function blockCount(c) {
  return c.counts?.contents ?? c.counts?.blocks ?? c.length ?? null;
}

// channels: [{ id, slug, title, visibility, counts }]; selected: [id]
// onRefresh (optional): async () => fresh channels array. Adds a Refresh button that reloads the list and keeps the ticks.
// disabledIds (optional): ids shown greyed out and unselectable.
// multiple (default true): false makes it a pick-one list (radio buttons, no Clear); onConfirm still gets an array, of one id.
// Returns { element, open(), close() }; the element is a Modal you append to document.body.
function openChannelPicker({ channels, selected = [], title = 'Pick channels', confirmLabel = 'Use', multiple = true, disabledIds = [], onConfirm, onCancel = null, onRefresh = null }) {
  const ATK = window.ArenaToolkit;
  const disabledSet = new Set(disabledIds);
  let chosen = multiple ? [...selected] : selected.slice(0, 1);
  let query = '';

  const filter = ATK.Input({ type: 'search', placeholder: 'Filter by name or slug' });
  filter.setAttribute('aria-label', 'Filter channels');
  filter.addEventListener('input', () => { query = filter.value; renderList(); });

  const list = document.createElement('div');
  Object.assign(list.style, { display: 'flex', flexDirection: 'column', maxHeight: '50vh', overflowY: 'auto' });

  const confirm = ATK.Button({ variant: 'primary', children: confirmLabel, onClick: () => { done(); onConfirm(chosen); } });

  function updateConfirm() {
    confirm.textContent = multiple ? `${confirmLabel} ${chosen.length} channel${chosen.length === 1 ? '' : 's'}` : confirmLabel;
    confirm.disabled = chosen.length === 0;
  }

  function renderList() {
    const matches = filterChannels(channels, query);
    if (!matches.length) {
      const empty = document.createElement('p');
      empty.className = 'muted';
      empty.textContent = query ? `No channels match "${query}".` : 'No channels to show.';
      list.replaceChildren(empty);
    } else {
      list.replaceChildren(...matches.map(row));
    }
    updateConfirm();
  }

  // Uses ArenaToolkit.Checkbox / Radio (shared/ui bundle), so the ticks match the rest of the toolkit.
  function row(c) {
    const n = blockCount(c);
    const common = {
      label: c.title || c.slug,
      description: `${n ?? '?'} block${n === 1 ? '' : 's'} · ${c.slug}`,
      checked: chosen.includes(c.id),
      disabled: disabledSet.has(c.id),
    };
    const control = multiple
      ? ATK.Checkbox({ ...common, onChange: () => { chosen = selectId(chosen, c.id, multiple); updateConfirm(); } })
      : ATK.Radio({ ...common, name: 'atk-channel-pick', value: c.id, onChange: () => { chosen = selectId(chosen, c.id, multiple); updateConfirm(); } });
    control.style.flex = '1';
    control.style.minWidth = '0';

    const line = document.createElement('div');
    Object.assign(line.style, {
      display: 'flex', alignItems: 'center', gap: 'var(--space-2)',
      padding: 'var(--space-2) var(--space-1)', borderBottom: '1px solid var(--border-card)',
    });
    line.append(control);
    if (c.visibility && c.visibility !== 'public') {
      line.append(ATK.Badge({ variant: c.visibility === 'private' ? 'private' : 'default', children: c.visibility }));
    }
    return line;
  }

  const clear = ATK.Button({ variant: 'ghost', children: 'Clear', onClick: () => { chosen = []; renderList(); } });
  const cancel = ATK.Button({ variant: 'secondary', children: 'Cancel', onClick: () => { done(); if (onCancel) onCancel(); } });

  const status = document.createElement('p');
  status.className = 'muted';
  status.setAttribute('role', 'status');
  status.hidden = true;

  const refresh = onRefresh && ATK.Button({
    variant: 'secondary', children: 'Refresh list',
    onClick: async () => {
      refresh.disabled = true;
      refresh.textContent = 'Refreshing…';
      status.hidden = true;
      try {
        channels = await onRefresh();
        status.textContent = `${channels.length} channel${channels.length === 1 ? '' : 's'} loaded.`;
        renderList();
      } catch (err) {
        status.textContent = `Couldn't refresh the list: ${err?.message || err}`;
      }
      status.hidden = false;
      refresh.disabled = false;
      refresh.textContent = 'Refresh list';
    },
  });

  const top = document.createElement('div');
  Object.assign(top.style, { display: 'flex', gap: 'var(--space-2)', alignItems: 'center' });
  Object.assign(filter.style, { flex: '1', minWidth: '0' });
  top.append(...[filter, refresh].filter(Boolean));

  const body = document.createElement('div');
  Object.assign(body.style, { display: 'flex', flexDirection: 'column', gap: 'var(--space-3)' });
  body.append(top, status, list);

  const footer = document.createElement('div');
  Object.assign(footer.style, { display: 'flex', justifyContent: 'space-between', gap: 'var(--space-2)', width: '100%' });
  const right = document.createElement('div');
  Object.assign(right.style, { display: 'flex', gap: 'var(--space-2)' });
  right.append(cancel, confirm);
  footer.append(multiple ? clear : document.createElement('span'), right);

  const modal = ATK.Modal({ title, children: body, footer, onClose: () => { if (onCancel) onCancel(); } });
  function done() { modal.remove(); }

  renderList();
  document.body.append(modal);
  setTimeout(() => filter.focus(), 50);
  return { element: modal, close: done };
}

</script>
<script>
// Inline channel finder: a text box that opens your channels as a list right under it.
// Click in and the list opens; type to filter it; paste a slug or are.na URL and press Enter (or paste) to load that instead.
// Knows nothing about what the channel is for. Needs filterChannels from channel-picker.js and ArenaToolkit.Badge.

// A pasted URL (or are.na path) is a reference to load, not a search to run.
function looksLikeChannelRef(text) {
  return /^https?:\/\//i.test(String(text || '').trim()) || /are\.na\//i.test(String(text || ''));
}

// Move the highlighted row by dir (+1 / -1), wrapping, skipping rows that cannot be chosen. -1 means none highlighted.
function nextActive(current, enabled, dir) {
  const n = enabled.length;
  if (!n || !enabled.some(Boolean)) return -1;
  let i = current;
  for (let step = 0; step < n; step++) {
    i = i < 0 ? (dir > 0 ? 0 : n - 1) : (i + dir + n) % n;
    if (enabled[i]) return i;
  }
  return -1;
}

// channels: [{ id, slug, title, visibility, counts }]
// onPick(channel): a row was chosen. onSubmit(text): Enter or paste on something that is not a list match (a slug or URL).
// disabled(channel): returns a reason string to grey the row out and make it unselectable, or '' / null to allow it.
// onRefresh(): async, returns a fresh channels array. staleAfterMs: refresh quietly on focus when the list is older than this.
// Returns { element, input, setChannels(list), setValue(text), focus() }.
function createChannelFinder({
  channels = [], label = 'Channel', placeholder = 'Find one of your channels, or paste a slug or URL',
  onPick, onSubmit = null, disabled = () => '', onRefresh = null, staleAfterMs = 5 * 60 * 1000,
} = {}) {
  const ATK = window.ArenaToolkit;
  const h = ATK._el;
  let list = channels;
  let loadedAt = Date.now();
  let open = false;
  let active = -1;
  let shown = []; // channels currently listed
  const uid = 'atk-finder-' + Math.random().toString(36).slice(2, 8);

  const input = ATK.Input({ placeholder, spellcheck: false, autocomplete: 'off' });
  input.setAttribute('role', 'combobox');
  input.setAttribute('aria-label', label);
  input.setAttribute('aria-autocomplete', 'list');
  input.setAttribute('aria-expanded', 'false');
  input.setAttribute('aria-controls', uid);

  const rows = h('div', { className: 'atk-finder__rows', role: 'listbox', id: uid, 'aria-label': `${label} suggestions` });
  const status = h('p', { className: 'atk-finder__status', role: 'status' });
  const refreshBtn = onRefresh ? ATK.Button({ variant: 'ghost', size: 'sm', children: 'Refresh', onClick: () => refresh() }) : null;
  const foot = h('div', { className: 'atk-finder__foot' }, [status, refreshBtn].filter(Boolean));
  const panel = h('div', { className: 'atk-finder__panel', hidden: true }, [rows, foot]);
  const root = h('div', { className: 'atk-finder' }, [input, panel]);

  const count = (c) => c.counts?.contents ?? c.counts?.blocks ?? c.length ?? null;

  function render() {
    const ref = looksLikeChannelRef(input.value);
    shown = ref ? [] : filterChannels(list, input.value);
    const enabled = shown.map(c => !disabled(c));
    if (active >= shown.length || (active >= 0 && !enabled[active])) active = -1;
    if (ref) {
      rows.replaceChildren(h('p', { className: 'atk-finder__hint' }, 'Press Enter to load this channel.'));
    } else if (!shown.length) {
      rows.replaceChildren(h('p', { className: 'atk-finder__hint' }, input.value.trim() ? `No channel of yours matches “${input.value.trim()}”. Press Enter to try it as a slug.` : 'No channels to show.'));
    } else {
      rows.replaceChildren(...shown.map((c, i) => {
        const why = disabled(c);
        const n = count(c);
        const row = h('div', {
          className: 'atk-finder__row' + (i === active ? ' is-active' : '') + (why ? ' is-disabled' : ''),
          role: 'option', id: `${uid}-${i}`, 'aria-selected': i === active ? 'true' : 'false', 'aria-disabled': why ? 'true' : null,
        }, [
          h('span', { className: 'atk-finder__text' }, [
            h('span', { className: 'atk-finder__name' }, c.title || c.slug),
            h('span', { className: 'atk-finder__meta' }, why || `${n ?? '?'} block${n === 1 ? '' : 's'} · ${c.slug}`),
          ]),
          c.visibility && c.visibility !== 'public' ? ATK.Badge({ variant: c.visibility === 'private' ? 'private' : 'default', children: c.visibility }) : null,
        ].filter(Boolean));
        // mousedown, not click: the input's blur would close the list before a click lands.
        row.addEventListener('mousedown', (e) => { e.preventDefault(); if (!why) choose(c); });
        return row;
      }));
    }
    input.setAttribute('aria-activedescendant', active >= 0 ? `${uid}-${active}` : '');
    status.textContent = `${list.length} channel${list.length === 1 ? '' : 's'}`;
  }

  function show() {
    if (open) return;
    open = true;
    panel.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    render();
    if (onRefresh && Date.now() - loadedAt > staleAfterMs) refresh(true);
  }
  function hide() {
    open = false;
    panel.hidden = true;
    active = -1;
    input.setAttribute('aria-expanded', 'false');
  }
  function choose(c) {
    input.value = c.slug;
    hide();
    onPick(c);
  }
  async function refresh(quiet = false) {
    if (!onRefresh) return;
    if (refreshBtn) { refreshBtn.disabled = true; refreshBtn.textContent = 'Refreshing…'; }
    try {
      list = await onRefresh();
      loadedAt = Date.now();
      if (open) render();
      status.textContent = `${list.length} channel${list.length === 1 ? '' : 's'} loaded`;
    } catch (err) {
      if (!quiet) status.textContent = `Couldn't refresh: ${err?.message || err}`;
    }
    if (refreshBtn) { refreshBtn.disabled = false; refreshBtn.textContent = 'Refresh'; }
  }

  input.addEventListener('focus', show);
  input.addEventListener('click', show);
  input.addEventListener('input', () => { active = -1; show(); render(); });
  input.addEventListener('paste', () => {
    // Read the pasted value after the browser has put it in the box.
    setTimeout(() => { if (looksLikeChannelRef(input.value) && onSubmit) { hide(); onSubmit(input.value); } }, 0);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      show();
      active = nextActive(active, shown.map(c => !disabled(c)), e.key === 'ArrowDown' ? 1 : -1);
      render();
      rows.querySelector('.is-active')?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (active >= 0 && shown[active]) choose(shown[active]);
      else if (input.value.trim() && onSubmit) { hide(); onSubmit(input.value); }
    } else if (e.key === 'Escape' && open) {
      e.preventDefault();
      hide();
    }
  });
  root.addEventListener('focusout', (e) => { if (!root.contains(e.relatedTarget)) hide(); });
  // The Refresh button is inside the root, so focus moving to it keeps the list open.

  return {
    element: root,
    input,
    setChannels(next) { list = next; loadedAt = Date.now(); if (open) render(); },
    setValue(text) { input.value = text || ''; },
    focus() { input.focus(); },
  };
}

</script>
<script>
// Pure helpers for arena-merge: no DOM, no network.

// A slug, or a full channel URL like https://www.are.na/user/channel-slug, to just the slug.
function parseSlug(input) {
  const trimmed = String(input ?? '').trim();
  if (!trimmed) return null;
  const m = trimmed.match(/^https?:\/\/(?:www\.)?are\.na\/[^/]+\/([^/?#]+)/i);
  if (m) return decodeURIComponent(m[1]);
  return trimmed;
}

function pluralBlocks(n) {
  return `${n} block${n === 1 ? '' : 's'}`;
}

function truncate(s, n) {
  s = String(s ?? '');
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

// v3 image objects use `.src` (not v2's `.url`); square first because the tiles are square.
function thumbSrc(item) {
  return item?.image?.square?.src || item?.image?.small?.src || item?.image?.medium?.src
    || item?.embed?.thumbnail_url || null;
}

// What a thumbnail tile shows when there is no picture: a short text label.
function thumbLabel(item) {
  if (!item) return 'block';
  if (item.class === 'Link') return truncate(item.title || item.source?.url || 'link', 24);
  if (item.class === 'Text') {
    const text = item.content?.plain || (typeof item.content === 'string' ? item.content : '') || 'text';
    return truncate(text, 40);
  }
  if (item.class === 'Channel' || item.type === 'Channel') return `↳ ${truncate(item.title || 'channel', 24)}`;
  return item.class || item.type || 'block';
}

// 'Image "sunset.jpg"' / 'Text #6', for log lines.
function describeBlock(item) {
  const kind = item.class || item.type || 'block';
  const text = item.content?.plain ?? (typeof item.content === 'string' ? item.content : '');
  const title = item.title || item.generated_title || text?.slice(0, 40) || '';
  return title ? `${kind} "${truncate(title, 40)}"` : `${kind} #${item.id}`;
}

// A channel dropped into another channel is connected as a Channel; everything else as a Block.
function connectableType(item) {
  return (item.type === 'Channel' || item.class === 'Channel') ? 'Channel' : 'Block';
}

// existingIds: a Set of block ids already in the destination. Returns what a merge would add and skip.
function planMerge(sourceContents, existingIds) {
  const toAdd = sourceContents.filter(it => !existingIds.has(it.id));
  return { toAdd, skipped: sourceContents.length - toAdd.length };
}

// The plain-language summary lines for the Transfer step, as data the view turns into text.
function summaryLines({ toAdd, skipped, sourceTitle, destTitle, deleteFromSource, quietMode, destStatus }) {
  const lines = [{ kind: 'add', toAdd, sourceTitle, destTitle }];
  if (skipped > 0) lines.push({ kind: 'skip', skipped });
  if (deleteFromSource) lines.push({ kind: 'remove', sourceTitle });
  if (quietMode && destStatus !== 'private') lines.push({ kind: 'quiet', destStatus });
  return lines;
}

</script>
<script>

// The merge run itself. Takes an are.na client and reports through hooks, so it has no DOM and can be tested.

// Resolves to { added, skipped, failed, removed, statusChanged, cancelled }.
// source / dest: { id, slug, title, status }. contents: the source's items (each has .id and .connection.id).
// destIds: Set of block ids already in the destination.
// opts: { deleteFromSource, quietMode }.
// hooks: { onPhase(name), onProgress({value,max,label,detail}), onLog(tone,text), onCount(key,value), shouldCancel() }.
async function runMerge({ client, source, dest, contents, destIds, opts = {}, dryRun = false, hooks = {} }) {
  const { onPhase = () => {}, onProgress = () => {}, onLog = () => {}, onCount = () => {}, shouldCancel = () => false } = hooks;
  const tag = dryRun ? '[dry run] ' : '';
  const result = { added: 0, skipped: 0, failed: 0, removed: 0, statusChanged: false, cancelled: false };

  const { skipped } = planMerge(contents, destIds);
  result.skipped = skipped;
  onCount('total', contents.length);
  onCount('skipped', skipped);
  if (skipped) onLog('info', `${tag}${pluralBlocks(skipped)} already in "${dest.title}": not copied again${opts.deleteFromSource ? ', but still removed from the source' : ''}`);

  if (opts.quietMode && dest.status !== 'private') {
    onPhase('status');
    onLog('info', `${tag}Setting "${dest.title}" to private while the merge runs`);
    try {
      if (!dryRun) await client.updateChannel(dest.slug, { status: 'private' });
      result.statusChanged = true;
    } catch (err) {
      onLog('err', `Couldn't set "${dest.title}" to private: ${err.message}. Carrying on without quiet mode, so followers may be notified.`);
    }
  }

  onPhase('copy');
  const total = contents.length;
  onProgress({ value: 0, max: total, label: 'Copying blocks', detail: '' });

  // Takes the block out of the source (when asked). Runs for added blocks and for ones already in the destination.
  async function removeFromSource(item, name) {
    const connId = item.connection?.id;
    if (!connId) {
      result.failed++;
      onCount('failed', result.failed);
      onLog('err', `${tag}Can't remove ${name} from "${source.title}": no connection id`);
      return;
    }
    if (!dryRun) await client.deleteConnection(connId);
    result.removed++;
    onCount('removed', result.removed);
    onLog('ok', `${tag}Removed ${name} from "${source.title}"`);
  }

  for (let i = 0; i < total; i++) {
    if (shouldCancel()) { result.cancelled = true; onLog('warn', 'Stopped before finishing'); break; }
    const item = contents[i];
    const name = describeBlock(item);
    try {
      let there = destIds.has(item.id);
      if (!there) {
        try {
          if (!dryRun) {
            await client.request('/connections', {}, {
              method: 'POST',
              body: { connectable_id: item.id, connectable_type: connectableType(item), channel_ids: [dest.id] },
            });
          }
          result.added++;
          onCount('added', result.added);
          onLog('ok', `${tag}Added ${name}`);
        } catch (err) {
          // 422: are.na says it is already connected there (the destination changed since we read it).
          if (err.status !== 422) throw err;
          there = true;
        }
      }
      if (there && !destIds.has(item.id)) {
        result.skipped++;
        onCount('skipped', result.skipped);
        onLog('info', `${tag}Already in "${dest.title}": ${name}`);
      }
      if (opts.deleteFromSource) await removeFromSource(item, name);
    } catch (err) {
      result.failed++;
      onCount('failed', result.failed);
      onLog('err', `${tag}${name}: ${err.message}`);
    }
    onProgress({ value: i + 1, max: total, label: 'Copying blocks', detail: `${i + 1} of ${total}` });
  }

  if (result.statusChanged) {
    onPhase('restore');
    onLog('info', `${tag}Setting "${dest.title}" back to ${dest.status}`);
    try {
      if (!dryRun) await client.updateChannel(dest.slug, { status: dest.status });
    } catch (err) {
      onLog('err', `Could not restore "${dest.title}" to ${dest.status}: ${err.message}. Please check it on are.na.`);
    }
  }

  onPhase('done');
  return result;
}

</script>
<script>
// Are.na Merge: five-step wizard. Plain DOM, built from ArenaToolkit components.
(function () {
  const ATK = window.ArenaToolkit;
  const h = (tag, attrs, kids) => ATK._el(tag, attrs, kids);

  const throttle = createThrottle({
    writeGap: 600,
    onWait: (seconds) => notify(`are.na asked us to slow down. Waiting ${seconds}s, then carrying on.`),
  });
  const client = createArenaClient({ throttle });

  const STEPS = [
    { id: 'connect', label: 'Connect', description: 'Paste a token with write access.' },
    { id: 'source', label: 'Source', description: 'Pick the channel to copy from.' },
    { id: 'destination', label: 'Destination', description: 'Pick the channel to copy into.' },
    { id: 'options', label: 'Options', description: 'Choose how the merge runs.' },
    { id: 'transfer', label: 'Transfer', description: 'Check the summary, then run it.' },
  ];

  const state = {
    step: 0, furthest: 0, user: null, myChannels: [],
    source: null, dest: null, // { id, slug, title, status, user, contents }
    opts: { deleteFromSource: false, quietMode: false },
    status: { source: null, dest: null }, // { tone, text }
    typed: { source: '', dest: '' },
    run: null,
  };

  const els = {
    header: document.getElementById('header'),
    rail: document.getElementById('step-rail'),
    pane: document.getElementById('step-pane'),
  };

  // A short, polite notice in the live region at the top of the pane (rate limit waits).
  let noticeTimer = null;
  function notify(text) {
    const live = document.getElementById('notice');
    live.textContent = text;
    live.hidden = false;
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => { live.hidden = true; }, 6000);
  }

  async function loadChannels(user = state.user) {
    state.myChannels = (await client.getUserContents(user.id, { type: 'Channel' })).filter(c => c && c.state !== 'deleted');
    return state.myChannels;
  }

  /* ── Auth ─────────────────────────────────────────────────── */
  const auth = createAuthStep({
    client,
    requireWrite: true,
    panel: true,
    loadDetail: async (user) => {
      await loadChannels(user);
      const n = state.myChannels.length;
      return `${n} of your channel${n === 1 ? '' : 's'} loaded`;
    },
    onChange: (user) => {
      state.user = user;
      account.setUser(user);
      accountSlot.hidden = !user;
      if (!user) {
        Object.assign(state, { furthest: 0, step: 0, myChannels: [], source: null, dest: null, run: null, status: { source: null, dest: null }, typed: { source: '', dest: '' } });
      }
      render();
    },
  });

  /* ── Navigation ───────────────────────────────────────────── */
  const canEnter = (i) => i <= state.furthest;

  function go(i) {
    if (i < 0 || i >= STEPS.length || !canEnter(i)) return;
    state.step = i;
    render();
  }

  function advance() {
    state.furthest = Math.max(state.furthest, state.step + 1);
    go(state.step + 1);
  }

  function renderRail() {
    const items = STEPS.map((s, i) => ({
      label: s.label,
      description: s.description,
      state: i === state.step ? 'current' : i < state.step ? 'done' : 'upcoming',
    }));
    const stepper = ATK.Stepper({ items });
    stepper.querySelectorAll('.atk-stepper__item').forEach((item, i) => {
      if (!canEnter(i)) item.classList.add('is-locked');
      item.addEventListener('click', () => go(i));
    });
    els.rail.replaceChildren(stepper);
  }

  function nav({ back = true, next = null, extra = [] } = {}) {
    const row = h('div', { className: 'step-nav' });
    const right = h('div', { className: 'step-nav__right' }, extra.concat(
      next ? [ATK.Button({ variant: next.variant || 'primary', children: next.label, disabled: next.disabled, onClick: next.onClick })] : []));
    row.append(back ? ATK.Button({ variant: 'ghost', children: '← Back', onClick: () => go(state.step - 1) }) : h('span'), right);
    return row;
  }

  /* ── Connect ──────────────────────────────────────────────── */
  function stepConnect() {
    return [
      h('h2', null, 'Connect to are.na'),
      auth.element,
      nav({ back: false, next: { label: 'Continue →', disabled: !state.user, onClick: advance } }),
    ];
  }

  /* ── Source and destination ───────────────────────────────── */
  const ROLES = {
    source: {
      key: 'source', index: 1, title: 'Source channel', field: 'Source channel',
      intro: [h('span', null, 'The channel you want to copy blocks '), h('strong', null, 'from'), h('span', null, '. Pick one of your channels, or paste a slug or full are.na URL.')],
      pickTitle: 'Pick the source channel',
    },
    dest: {
      key: 'dest', index: 2, title: 'Destination channel', field: 'Destination channel',
      intro: [h('span', null, 'The channel to add blocks '), h('strong', null, 'into'), h('span', null, '. You must own it or be a collaborator.')],
      pickTitle: 'Pick the destination channel',
    },
  };

  function setStatus(role, tone, text) {
    state.status[role] = text ? { tone, text } : null;
  }

  // Loads a channel and its contents, then stores it as the source or destination.
  async function loadChannel(role, rawInput) {
    state.typed[role] = rawInput;
    const slug = parseSlug(rawInput);
    if (!slug) { setStatus(role, 'error', 'Paste a slug or URL.'); return render(); }
    if (role === 'dest' && state.source && slug === state.source.slug) {
      setStatus(role, 'error', 'Source and destination are the same channel.');
      return render();
    }
    state[role] = null;
    state.run = null;
    state.furthest = Math.min(state.furthest, ROLES[role].index);
    setStatus(role, 'info', 'Fetching channel…');
    render();
    try {
      const ch = await client.getChannel(slug);
      setStatus(role, 'info', 'Fetching blocks…');
      render();
      const contents = await client.getChannelContents(slug);
      state[role] = { id: ch.id, slug: ch.slug, title: ch.title, status: ch.status, user: ch.user, contents, existingIds: new Set(contents.map(c => c.id)) };
      const n = contents.length;
      if (role === 'source') {
        setStatus(role, n ? 'success' : 'error', n ? `Found ${pluralBlocks(n)}.` : 'That channel has no blocks to copy.');
      } else {
        const mine = state.myChannels.some(c => c.id === ch.id);
        state.dest.writable = mine;
        setStatus(role, mine ? 'success' : 'info',
          mine ? `Found ${pluralBlocks(n)}. You can write to this channel.`
               : `“${ch.title}” isn't among your ${state.myChannels.length} channels. If you collaborate on it you can still continue; the merge will fail with a clear error if you don't have access.`);
      }
    } catch (err) {
      state[role] = null;
      setStatus(role, 'error', `Couldn't load: ${describeConnectError(err)}`);
    }
    render();
  }

  function channelCard(ch) {
    const thumbs = ch.contents.slice(0, 10).map(item => {
      const src = thumbSrc(item);
      return src
        ? h('div', { className: 'thumb' }, h('img', { src, alt: '', loading: 'lazy' }))
        : h('div', { className: 'thumb' }, thumbLabel(item));
    });
    return ATK.Card({
      children: [
        h('div', { className: 'card-title' }, ch.title),
        h('div', { className: 'card-meta' }, `by ${ch.user?.full_name || ch.user?.name || ch.user?.slug || 'unknown'} · ${pluralBlocks(ch.contents.length)}`),
        thumbs.length ? h('div', { className: 'thumbs' }, thumbs) : null,
      ].filter(Boolean),
    });
  }

  function stepChannel(role) {
    const r = ROLES[role];
    const otherKey = role === 'source' ? 'dest' : 'source';
    const finder = createChannelFinder({
      channels: state.myChannels,
      label: r.field,
      // Once one channel is chosen, the other box can't pick it again.
      disabled: (c) => state[otherKey] && c.id === state[otherKey].id
        ? `Already chosen as the ${role === 'source' ? 'destination' : 'source'}` : '',
      onRefresh: loadChannels,
      onPick: (c) => loadChannel(role, c.slug),
      onSubmit: (text) => loadChannel(role, text),
    });
    finder.setValue(state.typed[role] || (state[role] ? state[role].slug : ''));

    const st = state.status[role];
    const ch = state[role];
    const ready = role === 'source' ? !!ch && ch.contents.length > 0 : !!ch;
    return [
      h('h2', null, r.title),
      h('p', null, r.intro),
      h('div', { className: 'stack' }, [
        h('label', { className: 'field-label' }, r.field),
        finder.element,
      ]),
      st ? ATK.StatusMessage({ tone: st.tone, children: st.text }) : null,
      ch ? channelCard(ch) : null,
      nav({ next: { label: 'Continue →', disabled: !ready, onClick: advance } }),
    ].filter(Boolean);
  }

  /* ── Options ──────────────────────────────────────────────── */
  function stepOptions() {
    return [
      h('h2', null, 'Options'),
      h('p', null, 'Choose how the merge runs.'),
      h('div', { className: 'stack stack--loose' }, [
        ATK.Checkbox({
          label: 'Remove blocks from source after merging',
          description: 'Empties the source: every block ends up only in the destination, including blocks that were already there. The blocks themselves survive; only their connection to the source channel goes.',
          checked: state.opts.deleteFromSource,
          onChange: (v) => { state.opts.deleteFromSource = v; state.run = null; },
        }),
        ATK.Checkbox({
          label: 'Quiet mode: hide destination during transfer',
          description: "Temporarily sets the destination to private so followers aren't notified for each block, then restores its original status at the end. Skipped on dry runs and when the channel is already private.",
          checked: state.opts.quietMode,
          onChange: (v) => { state.opts.quietMode = v; state.run = null; },
        }),
      ]),
      nav({ next: { label: 'Continue →', onClick: advance } }),
    ];
  }

  /* ── Transfer ─────────────────────────────────────────────── */
  function newRun() {
    return {
      status: 'idle', dry: true, cancel: false,
      progress: ATK.Progress({ label: 'Preparing…' }),
      stats: ATK.StatGrid({ items: [
        { key: 'added', label: 'Added' }, { key: 'skipped', label: 'Already there' },
        { key: 'removed', label: 'Removed' }, { key: 'failed', label: 'Failed' },
      ] }),
      log: ATK.StatusLog({ label: 'Details' }),
      result: null,
    };
  }

  const LOG_TONES = { ok: 'success', info: 'message', warn: 'warning', err: 'error' };

  async function runTransfer(dryRun) {
    const run = state.run = newRun();
    run.status = 'running';
    run.dry = dryRun;
    render();
    const word = dryRun ? 'dry run' : 'merge';
    run.log.add('message', `Starting ${word}: ${pluralBlocks(state.source.contents.length)}.`);
    const phases = { status: 'Making the destination private…', copy: dryRun ? 'Dry run: merging…' : 'Merging…', restore: 'Restoring the destination…', done: 'Finished' };
    try {
      run.result = await runMerge({
        client, source: state.source, dest: state.dest,
        contents: state.source.contents, destIds: state.dest.existingIds,
        opts: state.opts, dryRun,
        hooks: {
          onPhase: (p) => run.progress.update({ label: phases[p] || p }),
          onProgress: (p) => run.progress.update(p),
          onLog: (tone, text) => run.log.add(LOG_TONES[tone] || 'message', text),
          onCount: (key, value) => run.stats.update({ [key]: value }),
          shouldCancel: () => run.cancel,
        },
      });
      run.status = 'done';
      run.progress.update({ label: dryRun ? 'Dry run complete' : 'Transfer complete', variant: run.result.failed ? 'alert' : 'success' });
    } catch (err) {
      run.status = 'error';
      run.error = describeConnectError(err);
      run.log.add('error', run.error);
      run.progress.update({ label: 'Stopped', variant: 'alert' });
    }
    if (state.run === run) render();
  }

  function confirmFullTransfer(returnFocus) {
    const toAdd = planMerge(state.source.contents, state.dest.existingIds).toAdd.length;
    const text = `This will add ${pluralBlocks(toAdd)} from “${state.source.title}” into “${state.dest.title}” on are.na`
      + (state.opts.deleteFromSource ? `, then remove them from “${state.source.title}”` : '')
      + '. The blocks themselves are not deleted.';
    const close = () => { document.removeEventListener('keydown', onKey); modal.remove(); returnFocus?.focus(); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    const ok = ATK.Button({ variant: 'primary', children: 'Run Full Merge', onClick: () => { document.removeEventListener('keydown', onKey); modal.remove(); runTransfer(false); } });
    const modal = ATK.Modal({
      title: 'Run Full Merge?',
      children: h('p', null, text),
      footer: [ATK.Button({ variant: 'ghost', children: 'Cancel', onClick: close }), ok],
      onClose: () => document.removeEventListener('keydown', onKey),
    });
    document.addEventListener('keydown', onKey);
    document.body.append(modal);
    ok.focus();
  }

  function summaryNode() {
    const { toAdd, skipped } = planMerge(state.source.contents, state.dest.existingIds);
    const s = (t) => h('strong', null, t);
    const lines = summaryLines({
      toAdd: toAdd.length, skipped, sourceTitle: state.source.title, destTitle: state.dest.title,
      deleteFromSource: state.opts.deleteFromSource, quietMode: state.opts.quietMode, destStatus: state.dest.status,
    });
    return h('div', { className: 'summary-box' }, lines.map(l => h('p', null,
      l.kind === 'add' ? ['Add ', s(String(l.toAdd)), ` block${l.toAdd === 1 ? '' : 's'} from `, s(l.sourceTitle), ' into ', s(l.destTitle), '.']
      : l.kind === 'skip' ? `${l.skipped} already there. Those will not be copied again${state.opts.deleteFromSource ? ', but will still be removed from the source' : ''}.`
      : l.kind === 'remove' ? ['Remove every block from ', s(l.sourceTitle), ' once it is in the destination.']
      : ['A full merge will set the destination to ', s('private'), ' while it runs and restore it to ', s(l.destStatus), ' at the end.'])));
  }

  function finishNode(run) {
    const r = run.result;
    if (!r) return null;
    const dest = `https://www.are.na/${state.user.slug}/${state.dest.slug}`;
    const src = `https://www.are.na/${state.source.user?.slug || state.user.slug}/${state.source.slug}`;
    if (run.dry) {
      return ATK.Card({ children: [
        h('div', { className: 'card-title' }, 'Dry run complete'),
        h('div', { className: 'card-meta' }, `${r.added} would be added, ${r.skipped} already there, ${r.failed} failed. Nothing on are.na has changed.`),
        h('p', { className: 'action-hint' }, ['If that looks right, choose ', h('strong', null, 'Run Full Merge'), '.']),
      ] });
    }
    return ATK.Card({ children: [
      h('div', { className: 'card-title' }, r.cancelled ? 'Transfer stopped' : 'Transfer complete'),
      h('div', { className: 'card-meta' }, `${r.added} added · ${r.skipped} already there · ${r.removed} removed · ${r.failed} failed`),
      h('div', { className: 'row row--wrap' }, [
        ATK.Button({ variant: 'secondary', children: `View ${state.dest.title} on are.na →`, onClick: () => window.open(dest, '_blank', 'noopener') }),
        ATK.Button({ variant: 'secondary', children: 'View source channel →', onClick: () => window.open(src, '_blank', 'noopener') }),
      ]),
    ] });
  }

  function stepTransfer() {
    const run = state.run;
    const running = run?.status === 'running';
    const fullDone = run?.status === 'done' && !run.dry;
    // Emphasis follows the next sensible move: Dry Run first, then Run Full Merge once a dry run has been seen.
    const dryDone = run?.status === 'done' && run.dry;
    let realBtn;
    const dryBtn = ATK.Button({ variant: dryDone || fullDone ? 'secondary' : 'primary', children: 'Dry Run', disabled: running, onClick: () => runTransfer(true) });
    realBtn = ATK.Button({ variant: dryDone ? 'primary' : 'secondary', children: 'Run Full Merge', disabled: running, onClick: () => confirmFullTransfer(realBtn) });
    const stopBtn = running ? ATK.Button({ variant: 'ghost', children: 'Stop', onClick: () => { run.cancel = true; } }) : null;

    return [
      h('h2', null, 'Review and transfer'),
      summaryNode(),
      h('div', { className: 'row row--wrap' }, [dryBtn, realBtn, stopBtn].filter(Boolean)),
      h('p', { className: 'action-hint' }, 'Dry Run shows what would happen and changes nothing on are.na. Run Full Merge writes to your account.'),
      h('details', { className: 'how' }, [
        h('summary', null, 'How the merge works'),
        h('ul', null, [
          'Blocks are matched by their are.na id. A block already in the destination is not copied again.',
          'With "Remove blocks from source", every block leaves the source, including ones that were already in the destination. Only the connection is removed; the block itself is never deleted.',
          'Blocks are handled one at a time: copy, then remove. If a run stops part-way, the blocks done so far stay done and the rest are untouched.',
          'A block that fails is reported and the run carries on. A failed copy is never removed from the source.',
          'Quiet mode sets the destination to private while a full merge runs, then restores it. A dry run never changes it.',
          'Blocks are not compared by URL or image yet, only by id.',
        ].map(t => h('li', null, t))),
      ]),
      run && run.status !== 'idle' ? h('div', { className: 'run' }, [run.progress, run.stats, finishNode(run), run.log].filter(Boolean)) : null,
      nav({ next: null }),
    ].filter(Boolean);
  }

  /* ── Render and header ────────────────────────────────────── */
  function render() {
    renderRail();
    const kids = [stepConnect, () => stepChannel('source'), () => stepChannel('dest'), stepOptions, stepTransfer][state.step]();
    els.pane.replaceChildren(...kids);
  }

  // Signed-in name and Disconnect, shown beside the theme chooser once connected.
  const account = ATK.AccountMenu({ onDisconnect: () => auth.disconnect() });
  const accountSlot = h('div', { className: 'account-slot', hidden: true }, account);

  function mountHeader() {
    const crumbs = h('nav', { className: 'crumbs', 'aria-label': 'Breadcrumb' },
      h('ol', null, [
        h('li', null, ATK.Link({ variant: 'muted', href: 'index.html', children: 'Are.na Tools' })),
        h('li', { 'aria-current': 'page' }, 'Are.na Merge'),
      ]));
    els.header.append(crumbs, h('div', { className: 'header-tools' }, [accountSlot, ATK.ThemeChooser()]));
  }

  mountHeader();
  render();
  auth.restore();
})();

</script>
  <script>document.getElementById('footer').replaceWith(ArenaToolkit.Footer({ toolNote: 'Blocks are matched by their are.na id. Nothing is deleted: removing a block from the source only removes its connection to that channel.' }));</script>
</body>
</html>
