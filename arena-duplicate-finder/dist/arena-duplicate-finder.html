<script>
// Progress: a thin bar with a label row. Indeterminate when value is omitted. Tool-local until promoted into shared/ui.
// The returned element has update({ value, max, label, detail }) so a running scan can change it in place.
window.ArenaToolkit.Progress = function Progress({ value = null, max = 100, label = '', detail = '', variant = 'default' } = {}) {
  const h = window.ArenaToolkit._el;
  const labelEl = h('span', { className: 'atk-progress-label' }, label);
  const detailEl = h('span', { className: 'atk-progress-detail' }, detail);
  const fill = h('div', { className: 'atk-progress-fill' });
  const track = h('div', { className: 'atk-progress-track', role: 'progressbar', 'aria-valuemin': '0' }, fill);
  const root = h('div', { className: `atk-progress atk-progress--${variant}` }, [
    h('div', { className: 'atk-progress-row' }, [labelEl, detailEl]),
    track,
  ]);

  root.update = function update(next = {}) {
    if ('label' in next) labelEl.textContent = next.label;
    if ('detail' in next) detailEl.textContent = next.detail;
    const v = 'value' in next ? next.value : value;
    const m = 'max' in next ? next.max : max;
    value = v;
    max = m;
    const indeterminate = v == null;
    root.classList.toggle('is-indeterminate', indeterminate);
    if (indeterminate) {
      track.removeAttribute('aria-valuenow');
      fill.style.width = '';
    } else {
      const pct = m > 0 ? Math.min(100, Math.max(0, (v / m) * 100)) : 0;
      track.setAttribute('aria-valuemax', String(m));
      track.setAttribute('aria-valuenow', String(v));
      fill.style.width = `${pct}%`;
    }
    track.setAttribute('aria-label', labelEl.textContent || 'Progress');
  };
  root.update({});
  return root;
};

</script>
<script>
// Notice: a short message in a stack at the bottom left. Tool-local until promoted into shared/ui.
//   Notice.show({ message, variant: 'default' | 'success' | 'alert' | 'notification', duration: 4000 (0 = stay), action: { label, onClick } })
//   Notice.dismissAll()
(function () {
  const h = window.ArenaToolkit._el;
  let stack = null;

  function getStack() {
    if (!stack || !stack.isConnected) {
      stack = h('div', { className: 'atk-notice-stack' });
      document.body.append(stack);
    }
    return stack;
  }

  function show({ message, variant = 'default', duration = 4000, action = null } = {}) {
    const alert = variant === 'alert';
    const notice = h('div', { className: `atk-notice atk-notice--${variant}`, role: alert ? 'alert' : 'status' });
    let timer = null;
    const dismiss = () => {
      clearTimeout(timer);
      if (!notice.isConnected) return;
      notice.classList.add('is-leaving');
      setTimeout(() => notice.remove(), 150);
    };
    notice.append(h('span', { className: 'atk-notice-message' }, message));
    if (action) {
      notice.append(window.ArenaToolkit.Button({ variant: 'ghost', size: 'sm', children: action.label, onClick: () => { action.onClick(); dismiss(); } }));
    }
    notice.append(h('button', { type: 'button', className: 'atk-notice-close', 'aria-label': 'Dismiss', onclick: dismiss }, '×'));
    notice.addEventListener('keydown', (e) => { if (e.key === 'Escape') dismiss(); });
    getStack().append(notice);
    if (duration > 0) timer = setTimeout(dismiss, duration);
    return { dismiss };
  }

  function dismissAll() {
    if (stack) stack.replaceChildren();
  }

  window.ArenaToolkit.Notice = { show, dismissAll };
})();

</script>
<script>
// Pure clustering: group blocks that share a normalised URL (or, optionally, title + description).

function keysForBlock(b, opts) {
  const keys = new Set();
  if (opts.sourceUrl && b.source?.url) keys.add(normaliseUrl(b.source.url));
  if (opts.descriptionUrls) extractUrls(b.description?.plain).forEach(k => keys.add(k));
  if (opts.titleDesc) {
    const t = (b.title || '').trim().toLowerCase();
    const d = (b.description?.plain || '').trim().toLowerCase().slice(0, 200);
    if (t.length > 3 && d.length > 10) keys.add(`td:${t}|${d}`);
  }
  return [...keys];
}

// Blocks sharing any key are in the same cluster; groups that overlap (a block with two different
// keys can link two buckets) are merged, so a block never appears in two clusters. Clusters have 2+ blocks.
// A block connected into several channels appears once per channel in a scan, so de-dupe by id first.
// With opts.skipMarked, blocks already carrying metadata.dupe_of are left out.
function clusterBlocks(blocks, opts) {
  const seen = new Set();
  const buckets = new Map();
  for (const b of blocks) {
    if (seen.has(b.id)) continue;
    seen.add(b.id);
    if (opts.skipMarked && b.metadata?.dupe_of != null) continue;
    for (const k of keysForBlock(b, opts)) {
      if (!buckets.has(k)) buckets.set(k, []);
      buckets.get(k).push(b);
    }
  }

  const parent = new Map();
  const find = (id) => {
    while (parent.get(id) !== id) { parent.set(id, parent.get(parent.get(id))); id = parent.get(id); }
    return id;
  };
  const byId = new Map();
  for (const bucket of buckets.values()) {
    if (bucket.length < 2) continue;
    for (const b of bucket) { byId.set(b.id, b); if (!parent.has(b.id)) parent.set(b.id, b.id); }
    const root = find(bucket[0].id);
    for (const b of bucket.slice(1)) parent.set(find(b.id), root);
  }

  const groups = new Map();
  for (const [id, b] of byId) {
    const root = find(id);
    if (!groups.has(root)) groups.set(root, []);
    groups.get(root).push(b);
  }
  return [...groups.values()];
}

</script>
<script>
// Scan: read the chosen channels page by page, remember where every block sits (including the
// connection id that deleteConnection needs), and group the duplicates. No DOM.

// Pause and resume for a running scan. The scan calls checkpoint() between requests.
function createScanControl() {
  let paused = false;
  let release = null;
  return {
    pause() { paused = true; },
    resume() { paused = false; if (release) { release(); release = null; } },
    isPaused: () => paused,
    checkpoint() {
      return paused ? new Promise(resolve => { release = resolve; }) : Promise.resolve();
    },
  };
}

const byAge = (a, b) => (a.created_at || '').localeCompare(b.created_at || '') || a.id - b.id;

// blocks: unique blocks; places: Map blockId -> [{ channelId, channelSlug, channelTitle, connectionId }]
// Returns clusters, each with its blocks oldest first (the usual best keeper), where they sit,
// and whether it lives in one channel ('single') or spans several ('cross').
function buildClusters(blocks, places, detectors) {
  return clusterBlocks(blocks, detectors).map(group => {
    const sorted = [...group].sort(byAge);
    const channelIds = [...new Set(sorted.flatMap(b => (places.get(b.id) || []).map(p => p.channelId)))];
    return {
      id: `c-${sorted.map(b => b.id).join('-')}`,
      blocks: sorted,
      places: Object.fromEntries(sorted.map(b => [b.id, places.get(b.id) || []])),
      channelIds,
      scope: channelIds.length > 1 ? 'cross' : 'single',
    };
  });
}

// Single-channel clusters grouped by channel, then the ones that span channels.
function splitClusters(clusters) {
  const byChannel = new Map();
  const cross = [];
  for (const c of clusters) {
    if (c.scope === 'cross') { cross.push(c); continue; }
    const id = c.channelIds[0];
    if (!byChannel.has(id)) byChannel.set(id, []);
    byChannel.get(id).push(c);
  }
  return { byChannel: [...byChannel].map(([channelId, list]) => ({ channelId, clusters: list })), cross };
}

// client: from createArenaClient(); channels: [{ id, slug, title }]; detectors: the Detect choices.
// onProgress({ channelIndex, channelCount, channelTitle, blocksFetched, clusterCount, channelDone }) is called after
// each page and again when a channel finishes (channelDone). clusterCount is only refreshed at the end of each channel.
// A channel that can't be read (403, 404) is skipped and reported; anything else (401, network) throws.
async function scanChannels({ client, channels, detectors, control = createScanControl(), onProgress = () => {}, per = 100 }) {
  const blocks = new Map();
  const places = new Map();
  const skipped = [];
  let blocksFetched = 0;
  let clusterCount = 0;

  for (const [i, ch] of channels.entries()) {
    const title = ch.title || ch.slug;
    for (let page = 1; ; page++) {
      await control.checkpoint();
      let body;
      try {
        body = await client.request(`/channels/${encodeURIComponent(ch.id)}/contents`, { page, per });
      } catch (err) {
        if (err?.status === 403 || err?.status === 404) { skipped.push({ channel: ch, message: err.message }); break; }
        throw err;
      }
      for (const item of body?.data || []) {
        if (!item || item.id == null || item.type === 'Channel' || item.base_type === 'Channel') continue;
        blocksFetched++;
        if (!blocks.has(item.id)) blocks.set(item.id, item);
        if (!places.has(item.id)) places.set(item.id, []);
        places.get(item.id).push({ channelId: ch.id, channelSlug: ch.slug, channelTitle: title, connectionId: item.connection?.id ?? null });
      }
      onProgress({ channelIndex: i + 1, channelCount: channels.length, channelTitle: title, blocksFetched, clusterCount, channelDone: false });
      if (!body?.meta?.has_more_pages) break;
    }
    clusterCount = buildClusters([...blocks.values()], places, detectors).length;
    onProgress({ channelIndex: i + 1, channelCount: channels.length, channelTitle: title, blocksFetched, clusterCount, channelDone: true });
  }

  const clusters = buildClusters([...blocks.values()], places, detectors);
  return { clusters, blocksFetched, uniqueBlocks: blocks.size, skipped };
}

</script>
<script>
// Review: the pure rules behind the cluster-at-a-time workspace. No DOM.
// A decision is { status: 'pending' | 'resolved' | 'skipped', canonicalId, actions: { [blockId]: 'merge' | 'leave' }, edits: { title, description, alt_text } }.

const blockTitle = b => b.title || b.generated_title || `Block ${b.id}`;
const blockDescription = b => b.description?.markdown ?? b.description?.plain ?? '';
const blockAlt = b => b.image?.alt_text ?? '';
const hasAlt = b => b.type === 'Image';

const FIELD_READERS = { title: b => b.title || '', description: blockDescription, alt_text: blockAlt };

function editsFor(block) {
  return { title: FIELD_READERS.title(block), description: FIELD_READERS.description(block), alt_text: FIELD_READERS.alt_text(block) };
}

// Oldest block is the default keeper (it usually has the most connections); the rest default to merge.
function defaultDecision(cluster, canonicalId = cluster.blocks[0].id, actions = {}) {
  const canonical = cluster.blocks.find(b => b.id === canonicalId);
  return {
    status: 'pending',
    canonicalId,
    actions: Object.fromEntries(cluster.blocks.filter(b => b.id !== canonicalId).map(b => [b.id, actions[b.id] || 'merge'])),
    edits: editsFor(canonical),
  };
}

// Choosing a different keeper keeps the other per-block actions, and starts the edit fields from the new keeper.
function chooseCanonical(cluster, decision, id) {
  if (id === decision.canonicalId) return decision;
  return { ...defaultDecision(cluster, id, decision.actions), status: decision.status === 'resolved' ? 'pending' : decision.status };
}

// Only the fields the person changed on the keeper: this is what an update would send.
function changedFields(cluster, decision) {
  const canonical = cluster.blocks.find(b => b.id === decision.canonicalId);
  const out = {};
  for (const [field, read] of Object.entries(FIELD_READERS)) {
    if (field === 'alt_text' && !hasAlt(canonical)) continue;
    if ((decision.edits[field] ?? '') !== read(canonical)) out[field] = decision.edits[field] ?? '';
  }
  return out;
}

// Other blocks with a longer value for this field than the keeper's current text, to offer "copy from".
function copyOptions(cluster, decision, field) {
  const read = FIELD_READERS[field];
  const current = (decision.edits[field] ?? '').trim();
  return cluster.blocks
    .filter(b => b.id !== decision.canonicalId)
    .map(b => ({ blockId: b.id, value: read(b) }))
    .filter(o => o.value.trim().length > current.length);
}

// Review order: single-channel clusters grouped by channel, then the cross-channel ones.
// Each item is { cluster, label } where label names the group.
function orderClusters(clusters) {
  const { byChannel, cross } = splitClusters(clusters);
  const items = [];
  for (const g of byChannel) {
    const title = g.clusters[0].places[g.clusters[0].blocks[0].id]?.find(p => p.channelId === g.channelId)?.channelTitle || `Channel ${g.channelId}`;
    for (const cluster of g.clusters) items.push({ cluster, label: `In ${title}` });
  }
  for (const cluster of cross) items.push({ cluster, label: `Across ${cluster.channelIds.length} channels` });
  return items;
}

function tally(items, decisions) {
  const t = { pending: 0, resolved: 0, skipped: 0 };
  for (const { cluster } of items) t[decisions[cluster.id]?.status || 'pending']++;
  return t;
}

// The nearest pending cluster after (dir = 1) or before (dir = -1) `from`, or null.
function nextPending(items, decisions, from, dir = 1) {
  for (let i = from + dir; i >= 0 && i < items.length; i += dir) {
    if ((decisions[items[i].cluster.id]?.status || 'pending') === 'pending') return i;
  }
  return null;
}

</script>
<script>
// Resolve: turn a decision into are.na writes, run them, and be able to take them back. No DOM.
// For a keeper C and each duplicate D set to "merge":
//   1. (once) edit C if its details were changed
//   2. for each channel D sits in: add C there if it isn't already, then remove D's connection
//   3. mark D: metadata dupe_of / dupe_marked / dupe_tool, and a "Duplicate of …" line on its description
// D is never deleted (are.na has no block delete); once unconnected it becomes an orphan.
// Blocks that belong to someone else can't be edited or marked (the API refuses), so they are only unconnected
// from your channels. Everything written is on the blocks themselves, not on the connections.

const DUPE_TOOL = 'arena-duplicate-finder';
const MARKER = /^Duplicate of \[[^\]]*\]\([^)]*\)[^\n]*(\n\s*\n---\s*\n\s*\n?)?/;

// Prepends the "Duplicate of" line, replacing one left by an earlier run rather than stacking.
function markDescription(original, canonicalId, date) {
  const line = `Duplicate of [${canonicalId}](https://www.are.na/block/${canonicalId}) — marked ${date}`;
  const rest = String(original || '').replace(MARKER, '');
  return rest.trim() ? `${line}\n\n---\n\n${rest}` : line;
}

const dupeMetadata = (canonicalId, date) => ({ dupe_of: canonicalId, dupe_marked: date, dupe_tool: DUPE_TOOL });
const clearedDupeMetadata = () => ({ dupe_of: null, dupe_marked: null, dupe_tool: null });

const isoDay = (now) => now.toISOString().slice(0, 10);

// Only a block's owner can change it (PUT /blocks/{id}). The user on a scanned block tells us whose it is:
// true / false, or null when the scan didn't say (then we try, and a 403 is reported as a problem).
function isOwned(block, myUserId) {
  if (myUserId == null || block?.user?.id == null) return null;
  return block.user.id === myUserId;
}
const ownerName = (block) => block?.user?.name || block?.user?.username || 'someone else';

// Pure: what would be done for this cluster. Nothing here touches the network.
function planResolution(cluster, decision, now = new Date(), myUserId = null) {
  const date = isoDay(now);
  const canonicalId = decision.canonicalId;
  const canonical = cluster.blocks.find(b => b.id === canonicalId);
  const keeperChannels = new Set((cluster.places[canonicalId] || []).map(p => p.channelId));
  const keeperOwned = isOwned(canonical, myUserId) !== false;
  const fields = keeperOwned ? changedFields(cluster, decision) : {};
  const notes = [];
  if (!keeperOwned) notes.push(`Block ${canonicalId} belongs to ${ownerName(canonical)}, so its details can't be edited.`);
  const merges = [];

  for (const b of cluster.blocks) {
    if (b.id === canonicalId || decision.actions[b.id] !== 'merge') continue;
    const channels = [];
    for (const p of cluster.places[b.id] || []) {
      const addKeeper = !keeperChannels.has(p.channelId);
      if (addKeeper) keeperChannels.add(p.channelId); // the first duplicate in a channel adds the keeper; later ones needn't
      if (p.connectionId == null) notes.push(`Block ${b.id} in ${p.channelTitle} has no connection id, so it stays connected there.`);
      channels.push({ ...p, addKeeper });
    }
    const foreign = isOwned(b, myUserId) === false;
    if (foreign) notes.push(`Block ${b.id} belongs to ${ownerName(b)}: it can't be marked as a duplicate, only removed from your channels. It is not deleted or changed.`);
    merges.push({
      blockId: b.id,
      title: blockTitle(b),
      foreign,
      channels,
      originalDescription: b.description?.markdown ?? b.description?.plain ?? '',
      metadata: dupeMetadata(canonicalId, date),
      description: markDescription(b.description?.markdown ?? b.description?.plain ?? '', canonicalId, date),
    });
  }
  if (merges.length) notes.push('Duplicates may also sit in channels you did not scan. Those connections are left alone.');

  return { canonicalId, canonicalTitle: blockTitle(canonical), edit: Object.keys(fields).length ? { blockId: canonicalId, fields } : null, merges, notes };
}

// Plain-language lines for the dry run and the log.
function describePlan(plan, { dryRun = true } = {}) {
  const say = (s) => (dryRun ? `Would ${s}` : s[0].toUpperCase() + s.slice(1));
  const lines = [];
  if (plan.edit) lines.push(say(`update block ${plan.edit.blockId}: ${Object.keys(plan.edit.fields).join(', ')}`));
  for (const m of plan.merges) {
    for (const c of m.channels) {
      if (c.addKeeper) lines.push(say(`add block ${plan.canonicalId} to ${c.channelTitle}`));
      if (c.connectionId != null) lines.push(say(`remove block ${m.blockId} from ${c.channelTitle}`));
    }
    if (!m.foreign) lines.push(say(`mark block ${m.blockId} as a duplicate of ${plan.canonicalId}`));
  }
  if (!plan.edit && !plan.merges.length) lines.push(dryRun ? 'Nothing to do: every other block is set to "Leave alone".' : 'Nothing to do.');
  return { lines, notes: plan.notes };
}

// Runs the plan. Each step is tried on its own: a failure is recorded and the rest carries on, except that a
// duplicate is never removed from a channel unless the keeper is (or already was) in it.
// Returns { done: [line], failed: [{ message }], undo } where undo is what undoResolution needs.
async function executeResolution(client, plan, { onStep = () => {} } = {}) {
  const done = [];
  const failed = [];
  const undo = { canonicalId: plan.canonicalId, dupes: [] };
  const attempt = async (label, fn) => {
    try { await fn(); done.push(label); onStep(label); return true; }
    catch (err) { failed.push({ message: `${label} failed: ${err?.message || err}` }); return false; }
  };

  if (plan.edit) await attempt(`Updated block ${plan.edit.blockId}`, () => client.updateBlock(plan.edit.blockId, plan.edit.fields));

  for (const m of plan.merges) {
    const record = { id: m.blockId, foreign: m.foreign, originalDescription: m.originalDescription, removedFrom: [], marked: false };
    for (const c of m.channels) {
      let ok = true;
      if (c.addKeeper) ok = await attempt(`Added block ${plan.canonicalId} to ${c.channelTitle}`, () => client.createConnection({ id: plan.canonicalId, channels: [c.channelId] }));
      if (ok && c.connectionId != null) {
        const removed = await attempt(`Removed block ${m.blockId} from ${c.channelTitle}`, () => client.deleteConnection(c.connectionId));
        if (removed) record.removedFrom.push({ channelId: c.channelId, channelTitle: c.channelTitle });
      }
    }
    if (!m.foreign) record.marked = await attempt(`Marked block ${m.blockId} as a duplicate`, () => client.updateBlock(m.blockId, { metadata: m.metadata, description: m.description }));
    undo.dupes.push(record);
  }
  return { done, failed, undo };
}

// Takes back the duplicates' side of a resolution: clears the mark, restores the description, reconnects.
// The keeper keeps any connections it gained, and any edits (we can't know it wasn't already in a channel).
async function undoResolution(client, undo) {
  const failed = [];
  for (const d of undo.dupes) {
    if (d.marked) {
      try { await client.updateBlock(d.id, { metadata: clearedDupeMetadata(), description: d.originalDescription }); }
      catch (err) { failed.push({ message: `Couldn't clear the mark on block ${d.id}: ${err?.message || err}` }); }
    }
    for (const c of d.removedFrom) {
      try { await client.createConnection({ id: d.id, channels: [c.channelId] }); }
      catch (err) { failed.push({ message: `Couldn't reconnect block ${d.id} to ${c.channelTitle}: ${err?.message || err}` }); }
    }
  }
  return { failed };
}

<script>
// What the tool has done, kept in localStorage so the Done step (and next time) can see it.
//   arena_dupefinder_orphans: blocks that lost their connections, for manual clean-up on are.na
//   arena_dupefinder_undo: the last 20 resolutions, with what undoResolution needs
const ORPHANS_KEY = 'arena_dupefinder_orphans';
const UNDO_KEY = 'arena_dupefinder_undo';
const UNDO_LIMIT = 20;

function readList(storage, key) {
  try {
    const v = JSON.parse(storage.getItem(key) || '[]');
    return Array.isArray(v) ? v : [];
  } catch {
    return [];
  }
}

function writeList(storage, key, list) {
  try { storage.setItem(key, JSON.stringify(list)); } catch { /* blocked or full: carry on unsaved */ }
}

const loadOrphans = (storage) => readList(storage, ORPHANS_KEY);
const loadUndo = (storage) => readList(storage, UNDO_KEY);

// Records the duplicates of one resolution. A block that is resolved again replaces its older entry.
function addOrphans(storage, canonicalId, dupes, now = new Date()) {
  const ids = new Set(dupes.map(d => d.id));
  const kept = loadOrphans(storage).filter(o => !ids.has(o.id));
  const fresh = dupes.map(d => ({ id: d.id, canonical: canonicalId, resolved_at: now.toISOString(), channels_removed_from: d.removedFrom.map(c => c.channelTitle) }));
  writeList(storage, ORPHANS_KEY, [...kept, ...fresh]);
}

// When a resolution is undone, its duplicates are no longer orphans.
function removeOrphans(storage, ids) {
  const gone = new Set(ids);
  writeList(storage, ORPHANS_KEY, loadOrphans(storage).filter(o => !gone.has(o.id)));
}

function pushUndo(storage, entry) {
  writeList(storage, UNDO_KEY, [...loadUndo(storage), entry].slice(-UNDO_LIMIT));
}

function dropUndo(storage, clusterId) {
  writeList(storage, UNDO_KEY, loadUndo(storage).filter(e => e.clusterId !== clusterId));
}

<script>
// Review view: one cluster at a time. DOM only; the rules live in review.js.
// items: orderClusters() output; decisions: { [clusterId]: decision }, filled in as the person works.
// Resolving writes to are.na through the callbacks below; with dryRun on (the default) it only shows what would happen.
//   onResolve({ item, decision, dryRun }) -> Promise<{ lines, notes, done, failed, undo }>
//   onUndo(undo) -> Promise<{ failed }>
//   getConnectionCount(blockId) -> Promise<number>: every channel the block is in, not just the scanned ones

// Only the card row runs on to the right-hand edge of the window; the rest of the pane keeps the content column.
// Negative right margin pulls the scroller out to the edge, matching padding keeps the last card clear of it.
function fitCardsToWindow(cards) {
  const fit = () => {
    if (!cards.isConnected) { window.removeEventListener('resize', fit); return; }
    cards.style.marginRight = cards.style.paddingRight = '';
    const spare = Math.max(0, document.documentElement.clientWidth - cards.getBoundingClientRect().right);
    cards.style.marginRight = `-${spare}px`;
    cards.style.paddingRight = `${spare}px`;
  };
  window.addEventListener('resize', fit);
  requestAnimationFrame(fit);
}

function createReviewView({ items, decisions, onFinish, onResolve, onUndo, getConnectionCount = null, myUserId = null }) {
  const ATK = window.ArenaToolkit;
  const h = (tag, attrs, kids) => ATK._el(tag, attrs, kids);

  let index = nextPending(items, decisions, -1, 1) ?? 0;
  const undoStack = [];
  let helpOpen = null;
  let dryRun = true;
  let busy = false;
  let report = null; // { dry, lines, notes, failed } for the group on screen

  const root = h('div', { className: 'review' });
  const live = h('p', { className: 'visually-hidden', role: 'status', 'aria-live': 'polite' });

  const decisionFor = (item) => decisions[item.cluster.id] || (decisions[item.cluster.id] = defaultDecision(item.cluster));
  const dateOf = (b) => (b.created_at ? new Date(b.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '');
  const link = (href, children) => { const a = ATK.Link({ href, children }); a.target = '_blank'; a.rel = 'noopener'; return a; };
  const trim = (text, n) => (text.length > n ? `${text.slice(0, n).trimEnd()}…` : text);

  /* ── Cards ─────────────────────────────────────────────────── */
  function thumb(b) {
    const src = b.image?.medium?.src || b.image?.square?.src || b.embed?.thumbnail_url;
    if (src) return ATK.Block({ variant: 'image', src, alt: blockAlt(b) || blockTitle(b) });
    return ATK.Block({ variant: 'text', children: b.content?.plain || blockDescription(b) || blockTitle(b) });
  }

  function card(item, b, i, d) {
    const keeper = b.id === d.canonicalId;
    const places = item.cluster.places[b.id] || [];
    const chooser = ATK.Radio({
      label: keeper ? 'Keeping this one' : 'Keep this one', value: b.id, name: `keep-${item.cluster.id}`, checked: keeper,
      onChange: () => chooseKeeper(b.id),
    });
    let action = h('span', { className: 'muted' }, 'Other blocks merge into this one');
    if (!keeper) {
      action = ATK.Select({
        options: [{ value: 'merge', label: 'Merge connections' }, { value: 'leave', label: 'Leave alone' }],
        value: d.actions[b.id],
        onChange: (e) => { d.actions[b.id] = e.target.value; },
      });
      action.setAttribute('aria-label', `What to do with block ${b.id}`);
    }
    return h('div', { className: `review-card${keeper ? ' is-keeper' : ''}${isOwned(b, myUserId) === false ? ' is-foreign' : ''}` }, [
      h('div', { className: 'review-card__thumb' }, [thumb(b), h('span', { className: 'review-card__num', 'aria-hidden': 'true' }, String(i + 1))]),
      h('div', { className: 'review-card__title' }, blockTitle(b)),
      h('dl', { className: 'review-card__facts' }, [
        fact('Owner', ownerLine(b)),
        fact('Added', dateOf(b)),
        getConnectionCount ? fact('Connections', h('span', { 'data-connections': String(b.id) }, connectionText(b.id))) : null,
        fact('In', places.length ? h('span', { className: 'review-card__channels' }, places.map(p =>
          h('a', { href: `https://www.are.na/channel/${p.channelSlug}`, target: '_blank', rel: 'noopener' }, ATK.Badge({ children: p.channelTitle })))) : null),
        hasAlt(b) ? fact('Alt text', blockAlt(b) || h('span', { className: 'muted' }, 'None')) : null,
        fact('Source', sourceLine(b)),
      ].filter(Boolean)),
      descriptionEl(b),
      link(`https://www.are.na/block/${b.id}`, 'View on are.na'),
      chooser,
      action,
    ].filter(Boolean));
  }

  // Total connections come from are.na one block at a time, fetched when a group is shown and then remembered.
  const connectionCounts = new Map();
  const connectionText = (id) => (connectionCounts.has(id) ? connectionCounts.get(id) : '…');
  function loadConnectionCounts(item) {
    if (!getConnectionCount) return;
    for (const b of item.cluster.blocks) {
      if (connectionCounts.has(b.id)) continue;
      connectionCounts.set(b.id, '…');
      getConnectionCount(b.id)
        .then((n) => `${n} in total`, () => '?')
        .then((text) => {
          connectionCounts.set(b.id, text);
          root.querySelectorAll(`[data-connections="${b.id}"]`).forEach(el => { el.textContent = text; });
        });
    }
  }

  const fact = (label, value) => (value ? h('div', { className: 'review-card__fact' }, [h('dt', null, label), h('dd', null, value)]) : null);

  function ownerLine(b) {
    if (!b.user) return null;
    const owned = isOwned(b, myUserId);
    if (owned === true) return `${ownerName(b)} (you)`;
    if (owned === false) return h('span', { className: 'review-card__owner' }, [ownerName(b), ' ', ATK.Badge({ children: 'Not yours' })]);
    return ownerName(b);
  }

  function sourceLine(b) {
    const url = b.source?.url;
    if (!url) return null;
    let host = url;
    try { host = new URL(url).hostname.replace(/^www\./, ''); } catch { /* show the raw text */ }
    return link(url, b.source.title || host);
  }

  // Long descriptions are cut short, with a toggle to read the rest.
  const DESCRIPTION_LIMIT = 140;
  const expanded = new Set();
  function descriptionEl(b) {
    const text = (b.description?.plain ?? blockDescription(b)).trim();
    if (!text) return null;
    const long = text.length > DESCRIPTION_LIMIT;
    const body = h('div', { className: 'review-card__description' }, long && !expanded.has(b.id) ? trim(text, DESCRIPTION_LIMIT) : text);
    if (!long) return body;
    const toggle = h('button', { type: 'button', className: 'review-card__more', 'aria-expanded': String(expanded.has(b.id)) }, expanded.has(b.id) ? 'less' : 'more >');
    toggle.addEventListener('click', () => {
      if (expanded.has(b.id)) expanded.delete(b.id); else expanded.add(b.id);
      body.textContent = expanded.has(b.id) ? text : trim(text, DESCRIPTION_LIMIT);
      toggle.textContent = expanded.has(b.id) ? 'less' : 'more >';
      toggle.setAttribute('aria-expanded', String(expanded.has(b.id)));
    });
    return h('div', null, [body, toggle]);
  }

  /* ── Keeper's details ──────────────────────────────────────── */
  function field(item, d, name, label, control) {
    const copies = copyOptions(item.cluster, d, name).map(o => ATK.Button({
      variant: 'ghost', size: 'sm', children: `Copy from block ${o.blockId}`,
      onClick: () => { d.edits[name] = o.value; render(); },
    }));
    return h('div', { className: 'stack' }, [h('label', { className: 'field-label' }, label), control, copies.length ? h('div', { className: 'row' }, copies) : null].filter(Boolean));
  }

  function details(item, d) {
    const keeper = item.cluster.blocks.find(b => b.id === d.canonicalId);
    if (isOwned(keeper, myUserId) === false) {
      return h('div', { className: 'review-details' }, [
        h('h3', { className: 'review-subhead' }, `Details for the block you keep (${keeper.id})`),
        h('p', { className: 'muted' }, `This block belongs to ${ownerName(keeper)}, so its title and description can't be edited. Consider keeping one of your own blocks instead.`),
      ]);
    }
    const title = ATK.Input({ placeholder: 'Title' });
    title.value = d.edits.title;
    title.addEventListener('input', () => { d.edits.title = title.value; });
    const desc = ATK.Textarea({ rows: 3, placeholder: 'Description' });
    desc.value = d.edits.description;
    desc.addEventListener('input', () => { d.edits.description = desc.value; });
    const parts = [field(item, d, 'title', 'Title', title), field(item, d, 'description', 'Description', desc)];
    if (hasAlt(keeper)) {
      const alt = ATK.Input({ placeholder: 'Alt text' });
      alt.value = d.edits.alt_text;
      alt.addEventListener('input', () => { d.edits.alt_text = alt.value; });
      parts.push(field(item, d, 'alt_text', 'Alt text', alt));
    }
    return h('div', { className: 'review-details' }, [h('h3', { className: 'review-subhead' }, `Details for the block you keep (${keeper.id})`), ...parts]);
  }

  /* ── Frame ─────────────────────────────────────────────────── */
  function statusBadge(d) {
    if (d.status === 'resolved' && d.problems?.length) return ATK.Badge({ variant: 'alert', children: 'Resolved with problems' });
    if (d.status === 'resolved') return ATK.Badge({ variant: 'success', children: 'Resolved' });
    if (d.status === 'skipped') return ATK.Badge({ children: 'Skipped' });
    return null;
  }

  function render() {
    closeHelp();
    const t = tally(items, decisions);
    if (!items.length) { root.replaceChildren(h('p', null, 'No groups to review.')); return; }
    if (index >= items.length) index = items.length - 1;
    const item = items[index];
    const d = decisionFor(item);
    const blocks = item.cluster.blocks;

    const header = h('div', { className: 'review-head' }, [
      h('h2', null, `Group ${index + 1} of ${items.length} · ${blocks.length} blocks · ${item.label}`),
      statusBadge(d),
    ].filter(Boolean));
    const progress = h('p', { className: 'muted' }, `${t.resolved} resolved · ${t.skipped} skipped · ${t.pending} to go`);
    const dryToggle = ATK.Checkbox({
      label: 'Dry run', description: 'Show what Resolve would do, and change nothing in are.na.',
      checked: dryRun, disabled: busy, onChange: (on) => (on ? setDryRun(true) : confirmLive()),
    });
    const cards = h('div', { className: 'review-cards' }, blocks.map((b, i) => card(item, b, i, d)));
    fitCardsToWindow(cards);

    const finishNow = ATK.Button({ variant: t.pending ? 'secondary' : 'primary', children: t.pending ? 'Finish early →' : 'Finish →', disabled: !t.resolved, onClick: () => onFinish() });
    const pager = h('div', { className: 'row' }, [
      ATK.Button({ variant: 'ghost', children: '← Previous', disabled: index === 0, onClick: () => move(-1) }),
      ATK.Button({ variant: 'ghost', children: 'Next →', disabled: index === items.length - 1, onClick: () => move(1) }),
    ]);
    const liveNote = dryRun ? null : h('p', { className: 'atk-note', role: 'status' }, 'Dry run is off: Resolve group writes to are.na straight away.');
    const actions = h('div', { className: 'step-nav' }, [
      dryToggle,
      h('div', { className: 'row' }, [
        ATK.Button({ variant: 'ghost', children: 'Undo', disabled: busy || !undoStack.length, onClick: undo }),
        ATK.Button({ variant: 'secondary', children: 'Skip group', disabled: busy, onClick: () => decide('skipped') }),
        ATK.Button({ variant: 'primary', children: busy ? 'Working…' : dryRun ? 'Preview resolve' : 'Resolve group', disabled: busy, onClick: resolve }),
      ]),
    ]);

    root.replaceChildren(
      header, progress, pager, cards, details(item, d),
      liveNote, actions, reportEl(),
      h('div', { className: 'row' }, [finishNow, ATK.Button({ variant: 'ghost', size: 'sm', children: 'Keyboard shortcuts (?)', onClick: openHelp })]),
      live,
    );
    loadConnectionCounts(item);
  }

  /* ── Actions ───────────────────────────────────────────────── */
  function chooseKeeper(id) {
    const item = items[index];
    decisions[item.cluster.id] = chooseCanonical(item.cluster, decisionFor(item), id);
    render();
  }

  function move(delta) {
    const next = index + delta;
    if (next < 0 || next >= items.length) return;
    index = next;
    render();
  }

  function moveOn() {
    const next = nextPending(items, decisions, index, 1) ?? nextPending(items, decisions, index, -1);
    if (next !== null) index = next;
  }

  // Skip only records the choice. Resolve is below, because it writes.
  function decide(status) {
    if (busy) return;
    const item = items[index];
    const d = decisionFor(item);
    undoStack.push({ clusterId: item.cluster.id, previous: JSON.parse(JSON.stringify(d)), index, written: null });
    decisions[item.cluster.id] = { ...d, status };
    report = null;
    live.textContent = 'Group skipped.';
    moveOn();
    render();
  }

  async function resolve() {
    if (busy) return;
    const item = items[index];
    const d = decisionFor(item);
    busy = true;
    report = null;
    render();
    let out;
    try {
      out = await onResolve({ item, decision: d, dryRun });
    } catch (err) {
      out = { lines: [], notes: [], done: [], failed: [{ message: err?.message || String(err) }], undo: null };
    }
    busy = false;
    if (dryRun) {
      report = { dry: true, lines: out.lines, notes: out.notes, failed: [] };
      live.textContent = 'Preview ready.';
      render();
      return;
    }
    const failed = out.failed || [];
    undoStack.push({ clusterId: item.cluster.id, previous: JSON.parse(JSON.stringify(d)), index, written: out.undo });
    decisions[item.cluster.id] = { ...d, status: 'resolved', problems: failed.map(f => f.message) };
    report = { dry: false, lines: out.done, notes: out.notes, failed };
    live.textContent = failed.length ? 'Group resolved, with problems.' : 'Group resolved.';
    if (!failed.length) moveOn();
    render();
  }

  async function undo() {
    if (busy) return;
    const last = undoStack.pop();
    if (!last) return;
    busy = true;
    render();
    let failed = [];
    if (last.written) {
      try { failed = (await onUndo(last.written)).failed || []; } catch (err) { failed = [{ message: err?.message || String(err) }]; }
    }
    busy = false;
    decisions[last.clusterId] = last.previous;
    index = last.index;
    report = failed.length ? { dry: false, lines: [], notes: [], failed } : null;
    live.textContent = failed.length ? 'Undone, with problems.' : 'Undone.';
    render();
  }

  function setDryRun(on) {
    dryRun = on;
    report = null;
    render();
  }

  // Going live changes the account, so it takes a deliberate yes.
  function confirmLive() {
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    const close = () => { document.removeEventListener('keydown', onKey); modal.remove(); render(); };
    const ok = ATK.Button({ variant: 'primary', children: 'Switch off dry run', onClick: () => { document.removeEventListener('keydown', onKey); modal.remove(); setDryRun(false); } });
    const modal = ATK.Modal({
      title: 'Switch off dry run?',
      children: h('p', null, 'Resolve will then change your are.na account straight away: it adds the block you keep to the channels the others are in, removes the others from those channels, and marks them as duplicates. The blocks themselves are not deleted, and each group can be undone.'),
      footer: [ATK.Button({ variant: 'ghost', children: 'Keep dry run on', onClick: close }), ok],
      onClose: () => document.removeEventListener('keydown', onKey),
    });
    document.addEventListener('keydown', onKey);
    document.body.append(modal);
    ok.focus();
  }

  function reportEl() {
    if (!report) return null;
    const parts = [];
    if (report.dry) parts.push(h('h3', { className: 'review-subhead' }, 'Dry run: nothing was changed'));
    else parts.push(h('h3', { className: 'review-subhead' }, report.failed.length ? 'Done, with problems' : 'Done'));
    if (report.lines.length) parts.push(h('ul', null, report.lines.map(l => h('li', null, l))));
    if (report.failed.length) parts.push(h('ul', { role: 'alert', className: 'atk-note review-problems' }, report.failed.map(f => h('li', null, f.message))));
    if (report.notes?.length) parts.push(h('ul', { className: 'muted' }, report.notes.map(n => h('li', null, n))));
    if (report.dry) parts.push(h('p', { className: 'muted' }, 'Happy with that? Switch off Dry run above, then Resolve group.'));
    return h('div', { className: 'review-report' }, parts);
  }

  /* ── Keyboard ──────────────────────────────────────────────── */
  const SHORTCUTS = [
    ['j or →', 'Next group'], ['k or ←', 'Previous group'], ['1 – 9', 'Keep that block'],
    ['Enter', 'Resolve group (or preview, in a dry run)'], ['S', 'Skip group'], ['U', 'Undo'], ['?', 'This list'],
  ];

  function openHelp() {
    if (helpOpen) return;
    helpOpen = ATK.Modal({
      title: 'Keyboard shortcuts',
      children: h('dl', { className: 'review-keys' }, SHORTCUTS.flatMap(([k, what]) => [h('dt', null, ATK.KeyChip ? ATK.KeyChip({ children: k }) : k), h('dd', null, what)])),
      onClose: () => { helpOpen = null; },
    });
    document.body.append(helpOpen);
  }

  function closeHelp() {
    helpOpen?.remove();
    helpOpen = null;
  }

  function handleKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = e.target?.tagName;
    if (['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON', 'A'].includes(tag) || e.target?.isContentEditable) return;
    if (e.key === 'Escape') { closeHelp(); return; }
    if (e.key === '?') { openHelp(); return; }
    if (helpOpen || busy) return;
    const k = e.key.toLowerCase();
    if (k === 'j' || e.key === 'ArrowRight') move(1);
    else if (k === 'k' || e.key === 'ArrowLeft') move(-1);
    else if (/^[1-9]$/.test(e.key)) { const b = items[index].cluster.blocks[Number(e.key) - 1]; if (b) chooseKeeper(b.id); }
    else if (e.key === 'Enter') resolve();
    else if (k === 's') decide('skipped');
    else if (k === 'u') undo();
    else return;
    e.preventDefault();
  }

  render();
  return { element: root, handleKey, destroy: closeHelp };
}

</script>
<script>
// Saved scan configurations: a name, the channels to scan and the detector switches.
// Stored under one localStorage key, as { [name]: { channelIds, detectors, created_at, last_run } }.
const SETS_KEY = 'arena_dupefinder_sets';
const OFFENDERS_KEY = 'arena_dupefinder_offenders';

const DEFAULT_DETECTORS = { sourceUrl: true, descriptionUrls: true, titleDesc: false, skipMarked: true };

function readJson(storage, key, fallback) {
  try {
    const raw = storage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function writeJson(storage, key, value) {
  try { storage.setItem(key, JSON.stringify(value)); } catch { /* blocked storage: carry on unsaved */ }
}

function loadSets(storage) {
  const sets = readJson(storage, SETS_KEY, {});
  return sets && typeof sets === 'object' && !Array.isArray(sets) ? sets : {};
}

// Saves (or overwrites) a named set. Returns the trimmed name, or null if the name is empty.
function saveSet(storage, name, { channelIds, detectors = DEFAULT_DETECTORS }, now = new Date()) {
  const key = String(name || '').trim();
  if (!key) return null;
  const sets = loadSets(storage);
  sets[key] = { channelIds: [...channelIds], detectors: { ...detectors }, created_at: sets[key]?.created_at || now.toISOString(), last_run: sets[key]?.last_run || null };
  writeJson(storage, SETS_KEY, sets);
  return key;
}

function deleteSet(storage, name) {
  const sets = loadSets(storage);
  delete sets[name];
  writeJson(storage, SETS_KEY, sets);
}

// Channels where duplicates turned up before, to pre-tick next time.
function loadOffenders(storage) {
  const ids = readJson(storage, OFFENDERS_KEY, []);
  return Array.isArray(ids) ? ids : [];
}

function addOffenders(storage, ids) {
  writeJson(storage, OFFENDERS_KEY, [...new Set([...loadOffenders(storage), ...ids])]);
}

// Drops ids for channels that no longer exist in `channels` (deleted, or not yours any more).
function pruneIds(ids, channels) {
  const known = new Set(channels.map(c => c.id));
  return ids.filter(id => known.has(id));
}

</script>
<script>
// Are.na Duplicate Finder: six-step wizard shell. Step 6 is a placeholder for now.
// Plain DOM, built from ArenaToolkit components. No framework.
(function () {
  const ATK = window.ArenaToolkit;
  const h = (tag, attrs, kids) => ATK._el(tag, attrs, kids);

  const throttle = createThrottle({
    onWait: (seconds) => ATK.Notice.show({ message: `are.na asked us to slow down. Waiting ${seconds}s, then carrying on.`, variant: 'notification', duration: seconds * 1000 }),
  });
  const client = createArenaClient({ throttle });

  const STEPS = [
    { id: 'connect', label: 'Connect', description: 'Paste a token that can write to your account.' },
    { id: 'scope', label: 'Scope', description: 'Choose the channels to scan.' },
    { id: 'detect', label: 'Detect', description: 'Choose how duplicates are spotted.' },
    { id: 'scan', label: 'Scan', description: 'Read the channels and group the duplicates.' },
    { id: 'review', label: 'Review', description: 'Pick the block to keep in each group.' },
    { id: 'done', label: 'Done', description: 'See what changed.' },
  ];

  const state = { step: 0, furthest: 0, user: null, myChannels: [], channelIds: [], setName: '', detectors: { ...DEFAULT_DETECTORS }, scan: null };

  const els = {
    header: document.getElementById('header'),
    rail: document.getElementById('step-rail'),
    pane: document.getElementById('step-pane'),
  };

  /* ── Auth ─────────────────────────────────────────────────── */
  const auth = createAuthStep({
    client,
    requireWrite: true,
    panel: true,
    // Loaded at connect time, as arena-merge does, so the Scope step has its list ready.
    loadDetail: async (user) => {
      state.myChannels = (await client.getUserContents(user.id, { type: 'Channel' })).filter(c => c && c.state !== 'deleted');
      const n = state.myChannels.length;
      return `${n} of your channel${n === 1 ? '' : 's'} loaded`;
    },
    onChange: (user) => {
      state.user = user;
      if (!user) { state.furthest = 0; state.step = 0; state.myChannels = []; state.channelIds = []; state.setName = ''; state.detectors = { ...DEFAULT_DETECTORS }; state.scan = null; }
      render();
    },
  });

  /* ── Navigation ───────────────────────────────────────────── */
  // A step can be entered once the one before it has been completed.
  function canEnter(i) {
    return i <= state.furthest;
  }

  function go(i) {
    if (i < 0 || i >= STEPS.length || !canEnter(i)) return;
    state.step = i;
    render();
  }

  function advance() {
    state.furthest = Math.max(state.furthest, state.step + 1);
    go(state.step + 1);
  }

  /* ── Rail ─────────────────────────────────────────────────── */
  function renderRail() {
    const items = STEPS.map((s, i) => ({
      label: s.label,
      description: s.description,
      state: i === state.step ? 'current' : i < state.step ? 'done' : 'upcoming',
    }));
    const stepper = ATK.Stepper({ items });
    stepper.querySelectorAll('.atk-stepper__item').forEach((item, i) => {
      if (!canEnter(i)) item.classList.add('is-locked');
      item.addEventListener('click', () => go(i));
    });
    els.rail.replaceChildren(stepper);
  }

  /* ── Steps ────────────────────────────────────────────────── */
  function nav({ back = true, next = null } = {}) {
    const row = h('div', { className: 'step-nav' });
    row.append(
      back ? ATK.Button({ variant: 'ghost', children: '← Back', onClick: () => go(state.step - 1) }) : h('span'),
      next ? ATK.Button({ variant: 'primary', children: next.label, disabled: next.disabled, onClick: next.onClick }) : h('span'),
    );
    return row;
  }

  function stepConnect() {
    return [
      h('h2', null, 'Connect to are.na'),
      auth.element,
      nav({ back: false, next: { label: 'Continue →', disabled: !state.user, onClick: advance } }),
    ];
  }

  /* Scope: which channels to scan, optionally saved under a name. */
  function stepScope() {
    const NEW = '';
    const sets = loadSets(localStorage);
    const byId = new Map(state.myChannels.map(c => [c.id, c]));

    const select = ATK.Select({
      options: [{ value: NEW, label: '— New scan —' }, ...Object.keys(sets).map(n => ({ value: n, label: n }))],
      value: state.setName,
      onChange: (e) => {
        state.setName = e.target.value;
        // Saved ids can outlive their channels, so drop any that have gone.
        state.channelIds = state.setName ? pruneIds(sets[state.setName].channelIds, state.myChannels) : [];
        state.detectors = { ...DEFAULT_DETECTORS, ...(state.setName ? sets[state.setName].detectors : null) };
        render();
      },
    });

    const pickBtn = ATK.Button({
      variant: 'secondary',
      children: state.channelIds.length ? 'Change channels' : 'Pick channels',
      onClick: () => {
        const offenders = pruneIds(loadOffenders(localStorage), state.myChannels);
        openChannelPicker({
          channels: state.myChannels,
          selected: state.channelIds.length ? state.channelIds : offenders,
          title: 'Pick channels to scan',
          confirmLabel: 'Scan',
          onConfirm: (ids) => { state.channelIds = ids; render(); },
        });
      },
    });

    const chosen = h('div', { className: 'chosen' }, state.channelIds.map(id => {
      const c = byId.get(id);
      const chip = h('span', { className: 'chosen__item' }, [
        ATK.Badge({ children: c ? (c.title || c.slug) : `#${id}` }),
        h('button', {
          type: 'button', className: 'chosen__remove', 'aria-label': `Remove ${c ? (c.title || c.slug) : id}`,
          onclick: () => { state.channelIds = state.channelIds.filter(x => x !== id); render(); },
        }, '×'),
      ]);
      return chip;
    }));
    if (!state.channelIds.length) chosen.append(h('p', { className: 'muted' }, 'No channels chosen yet.'));

    const nameInput = ATK.Input({ placeholder: 'Name this selection, to use it again' });
    nameInput.value = state.setName;
    const saveBtn = ATK.Button({
      variant: 'secondary', children: 'Save',
      disabled: !state.channelIds.length,
      onClick: () => {
        const name = saveSet(localStorage, nameInput.value, { channelIds: state.channelIds, detectors: state.detectors });
        if (name) { state.setName = name; render(); }
      },
    });

    return [
      h('h2', null, 'Choose channels to scan'),
      h('p', null, 'Pick the channels where you suspect duplicates. Blocks are compared across all of them.'),
      h('div', { className: 'stack' }, [
        h('label', { className: 'field-label' }, 'Saved selections'),
        select,
      ]),
      h('div', { className: 'stack' }, [
        h('label', { className: 'field-label' }, `Channels (${state.channelIds.length})`),
        chosen,
        h('div', null, pickBtn),
      ]),
      h('div', { className: 'stack' }, [
        h('label', { className: 'field-label' }, 'Save as'),
        h('div', { className: 'row' }, [nameInput, saveBtn]),
      ]),
      nav({ next: { label: 'Continue →', disabled: !state.channelIds.length, onClick: advance } }),
    ];
  }

  /* Detect: which signals count as "the same block". Choices save into the selected scan set. */
  const DETECTORS = [
    { key: 'sourceUrl', label: 'Match on source URL', description: 'Blocks saved from the same web page are duplicates.' },
    { key: 'descriptionUrls', label: 'Match on URLs in the description', description: 'Catches blocks whose description links to the page another block was saved from.' },
    { key: 'titleDesc', label: 'Match on title and description', description: 'Same title and opening description text. Noisy: expect some false matches.' },
    { key: 'skipMarked', label: 'Skip blocks already marked as duplicates', description: 'Leaves out blocks a previous run has marked dupe_of.' },
  ];

  function stepDetect() {
    const setDetectors = (patch) => {
      state.detectors = { ...state.detectors, ...patch };
      if (state.setName) saveSet(localStorage, state.setName, { channelIds: state.channelIds, detectors: state.detectors });
    };
    const options = DETECTORS.map(d => ATK.Checkbox({
      label: d.label, description: d.description, checked: !!state.detectors[d.key],
      onChange: (checked) => { setDetectors({ [d.key]: checked }); render(); },
    }));
    const noSignal = !state.detectors.sourceUrl && !state.detectors.descriptionUrls && !state.detectors.titleDesc;

    const how = h('details', { className: 'how' }, [
      h('summary', null, 'How URLs are compared'),
      h('ul', null, [
        'The host is lower-cased and a leading www. is dropped.',
        'Tracking parameters are removed: utm_*, fbclid, igshid, ref, si, feature, mc_cid and mc_eid.',
        'A trailing / is ignored.',
        'Pinterest: /pin/<id> is the key; anything after it is ignored.',
        'Instagram: /p/<shortcode> is the key; anything after it is ignored.',
      ].map(t => h('li', null, t))),
    ]);

    return [
      h('h2', null, 'Choose how duplicates are spotted'),
      h('p', null, state.setName ? `Your choices are saved with “${state.setName}”.` : 'Save a selection on the previous step to keep these choices.'),
      h('div', { className: 'stack stack--loose' }, options),
      noSignal ? h('p', { className: 'muted' }, 'Switch on at least one way of matching to continue.') : null,
      how,
      nav({ next: { label: 'Continue →', disabled: noSignal, onClick: advance } }),
    ].filter(Boolean);
  }

  /* Scan: read the channels, then group the duplicates. Read-only: nothing is written to are.na. */
  const scanSignature = () => JSON.stringify([state.channelIds, state.detectors]);

  async function startScan() {
    const control = createScanControl();
    const channels = state.channelIds.map(id => state.myChannels.find(c => c.id === id)).filter(Boolean);
    const progress = ATK.Progress({ label: 'Starting…' });
    const scan = state.scan = { status: 'running', signature: scanSignature(), control, progress, result: null, error: '' };
    render();
    try {
      scan.result = await scanChannels({
        client, channels, detectors: state.detectors, control,
        onProgress: (p) => progress.update({
          value: p.channelIndex - (p.channelDone ? 0 : 1), max: p.channelCount,
          label: `Channel ${p.channelIndex} of ${p.channelCount} · ${p.channelTitle}`,
          detail: `${p.blocksFetched} blocks fetched · ${p.clusterCount} group${p.clusterCount === 1 ? '' : 's'} so far`,
        }),
      });
      scan.status = 'done';
      for (const sk of scan.result.skipped) {
        ATK.Notice.show({ message: `Couldn't read ${sk.channel.title || sk.channel.slug}, so it was skipped.`, variant: 'alert', duration: 8000 });
      }
    } catch (err) {
      scan.status = 'error';
      scan.error = describeConnectError(err);
    }
    if (state.scan === scan) render();
  }

  function stepScan() {
    const scan = state.scan && state.scan.signature === scanSignature() ? state.scan : null;
    const n = state.channelIds.length;
    const head = h('h2', null, 'Scan your channels');

    if (!scan || scan.status === 'error') {
      return [
        head,
        h('p', null, `Ready to read ${n} channel${n === 1 ? '' : 's'}. This only reads: nothing in are.na is changed.`),
        scan ? h('p', { role: 'alert' }, `The scan stopped. ${scan.error}`) : null,
        nav({ next: { label: scan ? 'Try again' : 'Start scan', onClick: startScan } }),
      ].filter(Boolean);
    }

    if (scan.status === 'running') {
      const pauseBtn = ATK.Button({
        variant: 'secondary', children: scan.control.isPaused() ? 'Resume' : 'Pause',
        onClick: () => { scan.control.isPaused() ? scan.control.resume() : scan.control.pause(); render(); },
      });
      return [head, scan.progress, h('div', null, pauseBtn), nav({ back: false })];
    }

    const { clusters, uniqueBlocks, skipped } = scan.result;
    const { byChannel, cross } = splitClusters(clusters);
    const within = byChannel.reduce((sum, g) => sum + g.clusters.length, 0);
    const lines = clusters.length
      ? [
          h('p', null, `Found ${clusters.length} group${clusters.length === 1 ? '' : 's'} of duplicates among ${uniqueBlocks} blocks.`),
          h('ul', null, [
            h('li', null, `${within} within a single channel`),
            h('li', null, `${cross.length} across more than one channel`),
          ]),
        ]
      : [h('p', null, `No duplicates found among ${uniqueBlocks} blocks. Try switching on another way of matching.`)];
    return [
      head,
      ATK.Progress({ value: 1, max: 1, label: 'Scan complete', variant: 'success' }),
      ...lines,
      skipped.length ? h('p', { className: 'muted' }, `Skipped (couldn't be read): ${skipped.map(s => s.channel.title || s.channel.slug).join(', ')}.`) : null,
      nav({ next: clusters.length ? { label: 'Review →', onClick: advance } : { label: 'Scan again', onClick: startScan } }),
    ].filter(Boolean);
  }

  /* Resolve one group: a dry run only describes it; live runs write to are.na, then keep the record for Done and Undo. */
  async function resolveCluster({ item, decision, dryRun }) {
    const plan = planResolution(item.cluster, decision, new Date(), state.user?.id ?? null);
    if (dryRun) return { ...describePlan(plan, { dryRun: true }), done: [], failed: [], undo: null };
    const out = await executeResolution(client, plan);
    const { notes } = describePlan(plan, { dryRun: false });
    const moved = out.undo.dupes.filter(d => d.marked || d.removedFrom.length || d.foreign);
    const orphaned = moved.filter(d => !d.foreign); // someone else's block isn't yours to delete
    if (moved.length) {
      if (orphaned.length) addOrphans(localStorage, plan.canonicalId, orphaned);
      pushUndo(localStorage, { clusterId: item.cluster.id, ...out.undo, resolved_at: new Date().toISOString() });
      addOffenders(localStorage, item.cluster.channelIds);
    }
    return { lines: out.done, notes, done: out.done, failed: out.failed, undo: { ...out.undo, clusterId: item.cluster.id } };
  }

  async function undoCluster(undo) {
    const out = await undoResolution(client, undo);
    removeOrphans(localStorage, undo.dupes.map(d => d.id));
    dropUndo(localStorage, undo.clusterId);
    return out;
  }

  /* Review: decide, group by group. */
  function stepReview() {
    const scan = state.scan;
    if (!scan || scan.status !== 'done') return [h('p', { className: 'muted' }, 'Run a scan first.'), nav({})];
    if (!scan.review) {
      scan.decisions = {};
      scan.review = createReviewView({
        items: orderClusters(scan.result.clusters), decisions: scan.decisions, onFinish: advance,
        onResolve: resolveCluster, onUndo: undoCluster,
        getConnectionCount: async (id) => (await client.request(`/blocks/${id}/connections`, { per: 1 }))?.meta?.total_count ?? 0,
        myUserId: state.user?.id ?? null,
      });
    }
    return [scan.review.element, nav({ next: null })];
  }

  document.addEventListener('keydown', (e) => {
    if (state.step === 4 && state.scan?.review) state.scan.review.handleKey(e);
  });

  function stepPlaceholder(i) {
    return [
      h('h2', null, `${i + 1}. ${STEPS[i].label}`),
      h('p', { className: 'muted' }, 'Not built yet.'),
      nav({ next: i < STEPS.length - 1 ? { label: 'Continue →', onClick: advance } : null }),
    ];
  }

  function render() {
    renderRail();
    const kids = state.step === 0 ? stepConnect() : state.step === 1 ? stepScope() : state.step === 2 ? stepDetect() : state.step === 3 ? stepScan() : state.step === 4 ? stepReview() : stepPlaceholder(state.step);
    els.pane.replaceChildren(...kids);
  }

  /* ── Header ───────────────────────────────────────────────── */
  function mountHeader() {
    const crumbs = h('nav', { className: 'crumbs', 'aria-label': 'Breadcrumb' },
      h('ol', null, [
        h('li', null, ATK.Link({ variant: 'muted', href: 'index.html', children: 'Are.na Tools' })),
        h('li', { 'aria-current': 'page' }, 'Are.na Duplicate Finder'),
      ]));
    els.header.append(crumbs, ATK.ThemeChooser());
  }

  mountHeader();
  render();
  auth.restore();
})();

</script>
</body>
</html>
