<style>
/* ArenaToolkit — component styles. All colours route through tokens.css so themes flip automatically. */

.atk-btn {
  font-family: var(--font-sans);
  font-size: 14.4px;
  line-height: 1;
  font-weight: 700;
  padding: 0 var(--space-3);
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
  box-sizing: border-box;
}
.atk-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.atk-btn--primary {
  background: var(--accent-primary);
  color: var(--surface-page);
  border-color: var(--accent-primary);
}
.atk-btn--primary:hover:not(:disabled) {
  background: var(--text-primary);
  border-color: var(--text-primary);
}

.atk-btn--secondary {
  background: transparent;
  color: var(--text-secondary);
  border-color: var(--border-strong);
}
.atk-btn--secondary:hover:not(:disabled) {
  color: var(--text-primary);
  border-color: var(--text-primary);
}

.atk-btn--ghost {
  background: var(--surface-card);
  color: var(--text-secondary);
}
.atk-btn--ghost:hover:not(:disabled) {
  background: var(--surface-media);
  color: var(--text-primary);
}

.atk-btn--sm {
  font-size: 12.5px;
  height: 28px;
  padding: 0 var(--space-2);
}

/* Input */
.atk-input {
  font-family: var(--font-sans);
  font-size: 14.4px;
  line-height: 1.2;
  font-weight: 400;
  padding: 0 var(--space-2);
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-input);
  background: var(--surface-card);
  color: var(--text-primary);
  outline: none;
  width: 100%;
  box-sizing: border-box;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}
.atk-input:hover { border-color: var(--border-strong); }
.atk-input:focus { border-color: var(--border-focus); }
.atk-input::placeholder { color: var(--text-faint); }
.atk-input:disabled {
  color: var(--text-faint);
  background: var(--surface-sunken);
  cursor: not-allowed;
}

/* Link */
.atk-link {
  color: var(--text-secondary);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: 1px;
  font-weight: 700;
  cursor: pointer;
  transition: color 120ms ease;
}
.atk-link:hover { color: var(--text-primary); }

.atk-link--muted {
  color: var(--text-muted);
  text-decoration: none;
  font-weight: 400;
}
.atk-link--muted:hover { color: var(--text-primary); }

/* Card */
.atk-card {
  background: transparent;
  border: 1px solid var(--border-card);
  border-radius: var(--radius-sm);
  padding: var(--space-3);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14.4px;
  line-height: 21px;
}
/* Cards are unfilled by default; opt in with variant: 'filled'. */
.atk-card--filled { background: var(--surface-card); }
.atk-card__title {
  font-size: 16px;
  font-weight: 700;
  line-height: 20px;
  margin: 0 0 var(--space-1) 0;
}
.atk-card__body { color: var(--text-secondary); }

/* Badge — matches are.na's .c-eZIjnL: 3px radius chip, mono, 10px uppercase. */
.atk-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 18px;
  padding: 0 6px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-transform: uppercase;
  white-space: nowrap;
  vertical-align: middle;
  background: var(--surface-card);
  color: var(--text-muted);
}
.atk-badge--private {
  background: var(--accent-private);
  color: var(--surface-page);
}
.atk-badge--success {
  background: var(--accent-success);
  color: var(--surface-page);
}
.atk-badge--alert {
  background: var(--accent-alert);
  color: var(--surface-page);
}
.atk-badge--focus {
  background: var(--accent-focus);
  color: var(--surface-page);
}

/* Block — matches are.na's channel-grid block pattern. Four variants: image, attachment, text, channel.
   Blocks are always square and SPACIOUS — ~260–320px in the real UI, laid out on a repeat(auto-fill, minmax(260px, 1fr)) grid. */
.atk-block {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface-page);
  overflow: hidden;
  box-sizing: border-box;
  aspect-ratio: 1 / 1;
  min-width: 180px;
}

/* image + attachment: no border, image fills */
.atk-block--image,
.atk-block--attachment {
  padding: 0;
  background: var(--surface-media);
}
.atk-block--image > img,
.atk-block--attachment > img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* text: hairline border, generous padding, content top-left aligned, supports inline markup */
.atk-block--text {
  border: 1px solid var(--border-card);
  padding: var(--space-3);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.45;
  color: var(--text-primary);
}
.atk-block--text strong,
.atk-block--text b { font-weight: 700; }
.atk-block--text em,
.atk-block--text i { font-style: italic; }
.atk-block--text a {
  color: var(--text-primary);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* Fading text wrapper — mirrors are.na's .c-ftzJsE-gidtAM-direction-vertical.
   Overflow fades to transparent over the bottom third of the block so long
   text goes soft rather than hard-clipping, and action buttons overlay cleanly. */
.atk-block__text-fade {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to top, transparent 0%, #000 33%);
          mask-image: linear-gradient(to top, transparent 0%, #000 33%);
}
.atk-block__text-fade > p { margin: 0 0 var(--space-2) 0; }
.atk-block__text-fade > p:last-child { margin-bottom: 0; }

/* channel: 2px border, content centred. Three colour variants matching are.na's channel states.
   Default (variant 'channel') is the closed/neutral look. */
.atk-block--channel,
.atk-block--channel-closed,
.atk-block--channel-open,
.atk-block--channel-private {
  border-width: 2px;
  border-style: solid;
  padding: var(--space-3);
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: border-color 120ms ease;
}

/* Closed / default — grey. */
.atk-block--channel,
.atk-block--channel-closed {
  border-color: var(--border-input);
}
.atk-block--channel:hover,
.atk-block--channel:focus-within,
.atk-block--channel-closed:hover,
.atk-block--channel-closed:focus-within {
  border-color: var(--text-secondary);
}

/* Open — green. Soft resting border, deep hover. Text takes the strong green. */
.atk-block--channel-open {
  border-color: var(--channel-open);
  color: var(--accent-success);
}
.atk-block--channel-open:hover,
.atk-block--channel-open:focus-within {
  border-color: var(--accent-success);
}

/* Private — red/pink border and text. */
.atk-block--channel-private {
  border-color: var(--channel-private);
  color: var(--accent-private);
}
.atk-block--channel-private:hover,
.atk-block--channel-private:focus-within {
  border-color: var(--accent-private);
}

/* Channel body stack — title / byline / meta, centred */
.atk-block__content {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  min-width: 0;
  max-width: 100%;
}
.atk-block__title {
  font-size: 24px;
  line-height: 1.25;
  font-weight: 400;
  color: inherit;
}
.atk-block__byline {
  font-size: 14.4px;
  line-height: 1.35;
  font-weight: 700;
  color: inherit;
  margin-top: var(--space-1);
}
.atk-block__meta {
  font-size: 14.4px;
  line-height: 1.35;
  font-weight: 400;
  color: inherit;
}

/* Label — small chip, bottom-right. e.g. "PDF" on attachment blocks. */
.atk-block__label {
  position: absolute;
  right: var(--space-2);
  bottom: var(--space-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 18px;
  padding: 0 6px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1;
  font-weight: 600;
  text-transform: uppercase;
  background: var(--surface-card);
  color: var(--text-muted);
  pointer-events: none;
}

/* Actions row — hover-revealed. Mirrors are.na's .c-hRIxJA pattern. */
.atk-block__actions {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-3);
  opacity: 0;
  visibility: hidden;
  transform: translateY(2px);
  transition: opacity 150ms ease, transform 150ms ease, visibility 150ms;
  pointer-events: none;
}
.atk-block:hover .atk-block__actions,
.atk-block:focus-within .atk-block__actions {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  pointer-events: auto;
}

/* Individual action button — bare text until hovered, then picks up border */
.atk-block__action {
  all: unset;
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  height: 28px;
  padding: 0 var(--space-2);
  font-family: var(--font-sans);
  font-size: 14.4px;
  font-weight: 700;
  color: var(--text-primary);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-decoration: none;
  transition: border-color 120ms ease, background-color 120ms ease;
}
.atk-block__action:hover {
  border-color: var(--border-strong);
  background: var(--surface-card);
}
.atk-block__action:focus-visible {
  border-color: var(--border-focus);
  outline: none;
}

/* Badge — filled brand & nsfw variants (NEW / BETA / API / NSFW chips) */
.atk-badge--brand {
  background: var(--accent-primary);
  color: var(--surface-page);
}
.atk-badge--nsfw {
  background: var(--accent-notification);
  color: var(--surface-page);
}

/* ────────────────────────────────────────────────────────────
   Modal — centred panel on a dimmed, blurred backdrop
   ──────────────────────────────────────────────────────────── */
.atk-modal__backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.25);
  -webkit-backdrop-filter: blur(8px);
          backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
  z-index: 100;
  font-family: var(--font-sans);
}
.atk-modal {
  background: var(--surface-card);
  border-radius: var(--radius-sm);
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.12);
  width: 100%;
  max-width: 460px;
  max-height: calc(100vh - var(--space-6));
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.atk-modal__header {

      disabled: opts.disabled || null,
      onchange: opts.onChange

      if (typeof o === 'string') o = { value: o, label: o };
      var optAttrs = { value: o.value };
      if (o.value === opts.value) optAttrs.selected = '';

  function Textarea(opts) {

      className: 'atk-textarea',

      name: opts.name || null,

        className: 'atk-tabs__tab',

    var root = el('div', { className: 'atk-stepper' });

  var THEME_KEY = 'arena_toolkit_theme';
  var THEME_OPTIONS = [
    { id: 'light', label: 'Light' },
    { id: 'dusk', label: 'Dusk' },
    { id: 'dark', label: 'Dark' },
    { id: 'dawn', label: 'Dawn' }
  ];

  // Palette: the system's own Icons/Theme.svg (Phosphor), inlined so it takes the text colour.
  var PALETTE_SVG =
    '<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M200.77,53.89A103.27,103.27,0,0,0,128,24h-1.07A104,104,0,0,0,24,128c0,43,26.58,79.06,69.36,94.17A32,32,0,0,0,136,192a16,16,0,0,1,16-16h46.21a31.81,31.81,0,0,0,31.2-24.88,104.43,104.43,0,0,0,2.59-24A103.28,103.28,0,0,0,200.77,53.89Zm13,93.71A15.89,15.89,0,0,1,198.21,160H152a32,32,0,0,0-32,32,16,16,0,0,1-21.31,15.07C62.49,194.3,40,164,40,128a88,88,0,0,1,87.09-88h.9a88.35,88.35,0,0,1,88,87.25A88.86,88.86,0,0,1,213.81,147.6ZM140,76a12,12,0,1,1-12-12A12,12,0,0,1,140,76ZM96,100A12,12,0,1,1,84,88,12,12,0,0,1,96,100Zm0,56a12,12,0,1,1-12-12A12,12,0,0,1,96,156Zm88-56a12,12,0,1,1-12-12A12,12,0,0,1,184,100Z"/></svg>';
  var CHECK_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function svgSpan(markup) {

    span.innerHTML = markup; // static strings above, never user input

  var SYSTEM_OPTION = { id: 'system', label: 'System' };

  }

  // 'system' (or anything unknown) falls through to the system light/dark setting.

    opts = opts || {};
    var ids = themeIds(opts.themes);
    if (ids.indexOf(opts.asked) !== -1) return opts.asked;
    if (ids.indexOf(opts.saved) !== -1) return opts.saved;
    var wanted = opts.prefersDark ? 'dark' : 'light';
    return ids.indexOf(wanted) !== -1 ? wanted : ids[0];

  function themeChoice(opts) {
    opts = opts || {};

    if (ids.indexOf(opts.saved) !== -1) return opts.saved;

    }

    function open() {
      var menuItems = [];
      entries.forEach(function (t) {
        // System sits apart from the named themes.
        if (t === SYSTEM_OPTION && themes.length) menuItems.push({ separator: true });
        menuItems.push({
          label: t.label,
          icon: t.id === choice ? svgSpan(CHECK_SVG) : el('span'),
          onClick: function () { choose(t.id); }
        });
      });
      var menu = Menu({ items: menuItems });
      var items = Array.prototype.slice.call(menu.querySelectorAll('.atk-menu__item'));
      items.forEach(function (item, i) {
        item.setAttribute('role', 'menuitemradio');
        item.setAttribute('aria-checked', String(entries[i].id === choice));
      });
      menu.addEventListener('keydown', function (e) {
        var i = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      });
      popover = el('div', { className: 'atk-theme-chooser__popover' }, menu);
      root.appendChild(popover);
      button.setAttribute('aria-expanded', 'true');
      var selected = items[entries.map(function (t) { return t.id; }).indexOf(choice)];
      (selected || items[0]).focus();
    }

    button.addEventListener('click', function () { if (popover) close(); else open(); });
    document.addEventListener('click', function (e) { if (popover && !root.contains(e.target)) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && popover) close(true); });

    root.appendChild(button);
    return root;
  }
  ThemeChooser.resolve = resolveTheme;
  ThemeChooser.choice = themeChoice;

  /* ── ChannelRow / ChannelList ──────────────────────────────────
     A channel as a coloured bar: badge, name, block count, metadata count,
     owner, caret. Opens (a <details>) to show whatever you pass as children.
     ChannelList stacks rows and adds an optional sort menu; sorting itself
     is yours: re-order with list.setRows(). */

  var CHEVRON_SVG =
    '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>';

  function ChannelRow(opts) {
    opts = opts || {};
    var visibility = opts.visibility || 'closed';
    var badgeVariant = { public: 'success', private: 'private' }[visibility] || 'default';
    var caret = svgSpan(CHEVRON_SVG);
    caret.className = 'atk-channel-row__caret';
    var summary = el('summary', null, [
      Badge({ variant: badgeVariant, children: visibility }),
      el('span', { className: 'atk-channel-row__title' }, opts.title),
      opts.count != null
        ? el('span', { className: 'atk-channel-row__count', title: 'Blocks in this channel' }, String(opts.count))
        : null,
      opts.metadataCount != null
        ? el('span', { title: 'Metadata entries' }, Badge({ children: String(opts.metadataCount) }))
        : null,
      opts.owner ? el('span', { className: 'atk-channel-row__owner' }, opts.owner) : null,
      caret
    ]);
    return el('details', {
      className: 'atk-channel-row',
      'data-visibility': visibility,
      open: opts.open ? true : null
    }, [summary, el('div', { className: 'atk-channel-row__body' }, opts.children)]);
  }

  var channelListCount = 0;

  function ChannelList(opts) {
    opts = opts || {};
    var root = el('div', { className: 'atk-channel-list' });
    var rowsEl = el('div', { className: 'atk-channel-list__rows' });
    var toolbar = null;
    if (opts.sorts && opts.sorts.length) {
      var select = Select({
        options: opts.sorts,
        value: opts.sortValue || opts.sorts[0].value,
        onChange: function (e) { if (opts.onSort) opts.onSort(e.target.value); }
      });
      select.id = 'atk-channel-sort-' + (++channelListCount);
      toolbar = el('div', { className: 'atk-channel-list__toolbar', hidden: true }, [
        el('label', { for: select.id }, opts.sortLabel || 'Sort'),
        select
      ]);
      root.appendChild(toolbar);
    }
    root.appendChild(rowsEl);

    // Replace the list's contents. Rows you pass again are moved, not rebuilt, so open rows stay open.
    // The sort menu shows once there are two or more. A single node (a message) works too.
    root.setRows = function (nodes) {
      rowsEl.replaceChildren.apply(rowsEl, nodes);
      if (toolbar) toolbar.hidden = nodes.length < 2;
    };
    root.setRows(opts.rows || []);
    return root;
  }

  window.ArenaToolkit = {
    ChannelRow: ChannelRow,
    ChannelList: ChannelList,
    ThemeChooser: ThemeChooser,
    Button: Button,
    Input: Input,
    Link: Link,
    Card: Card,
    Badge: Badge,
    Block: Block,
    Modal: Modal,
    Menu: Menu,
    KeyChip: KeyChip,
    Select: Select,
    Textarea: Textarea,
    Tabs: Tabs,
    Stepper: Stepper,
    _el: el
  };
}());

<script>
// are.na v3 client. Endpoints checked against https://api.are.na/v3/openapi.json.
// Writes (updateBlock, createConnection, deleteConnection) need a token with write scope.
const ARENA_API_BASE = 'https://api.are.na/v3';

class ArenaError extends Error {
  constructor(status, message, body) {
    super(message);
    this.name = 'ArenaError';
    this.status = status;
    this.body = body;
  }
}

// throttle: the function from createThrottle(); omit in tests to call fetch directly.
function createArenaClient({ token = null, fetchImpl = (...a) => globalThis.fetch(...a), throttle = null, base = ARENA_API_BASE } = {}) {
  let currentToken = token;

  // params go in the query string; opts.body (if any) is sent as JSON.
  async function request(path, params = {}, { method = 'GET', body = null } = {}) {
    const url = new URL(base + path);
    for (const [k, v] of Object.entries(params)) {
      if (v != null) url.searchParams.set(k, String(v));
    }
    const doFetch = () => fetchImpl(url.toString(), {
      method,
      headers: {
        Accept: 'application/json',
        ...(body ? { 'Content-Type': 'application/json' } : {}),
        ...(currentToken ? { Authorization: `Bearer ${currentToken}` } : {}),
      },
      ...(body ? { body: JSON.stringify(body) } : {}),
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
    });
    const res = throttle ? await throttle(doFetch) : await doFetch();

    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = null; }

    if (!res.ok) {
      const msg = data?.details?.message || data?.error || `are.na error ${res.status}`;
      throw new ArenaError(res.status, msg, data);
    }
    return data;
  }

  // Follows meta.has_more_pages and returns every item in `data`. onPage(items, meta) fires per page.
  async function paginate(path, params = {}, { per = 100, onPage = null } = {}) {
    const all = [];
    for (let page = 1; ; page++) {
      const body = await request(path, { ...params, page, per });
      const items = body?.data || [];
      all.push(...items);
      if (onPage) onPage(items, body?.meta);
      if (!body?.meta?.has_more_pages) return all;
    }
  }

  return {
    setToken(t) { currentToken = t || null; },
    request,
    paginate,
    getCurrentUser: () => request('/me'),
    getBlock: id => request(`/blocks/${encodeURIComponent(id)}`),
    getBlockConnections: (id, opts = {}) => paginate(`/blocks/${encodeURIComponent(id)}/connections`, {}, opts),
    getChannel: idOrSlug => request(`/channels/${encodeURIComponent(idOrSlug)}`),
    // Every block/channel in a channel. Each item carries `connection.id`, which deleteConnection needs.
    // params: { type } filters to Text, Image, Link, Attachment, Embed, Channel or Block.
    getChannelContents: (idOrSlug, params = {}, opts = {}) => paginate(`/channels/${encodeURIComponent(idOrSlug)}/contents`, params, opts),

    // A user's own contents (as arena-merge does it). params: { type: 'Channel' } for just their channels.
    getUserContents: (userId, params = {}, opts = {}) => paginate(`/users/${encodeURIComponent(userId)}/contents`, params, opts),

    // fields: any of title, description, alt_text (Image blocks), metadata (merged; null deletes a key).
    // Owner only.
    updateBlock: (id, fields) => request(`/blocks/${encodeURIComponent(id)}`, {}, { method: 'PUT', body: fields }),
    // Connects a block (or channel) into one or more channels. Resolves to the created Connection[].
    // channels: ids or slugs, or { id, position?, metadata? } objects.
    createConnection: async ({ id, type = 'Block', channels }) => {
      const res = await request('/connections', {}, {
        method: 'POST',
        body: {
          connectable_id: id,
          connectable_type: type,
          channels: channels.map(c => (typeof c === 'object' ? c : { id: c })),
        },
      });
      return res?.data || [];
    },
    // Takes the *connection* id (from a channel's contents, or createConnection), not a block id.
    // Removes the block from that channel only; the block itself stays. Resolves to null (204).
    deleteConnection: connectionId => request(`/connections/${encodeURIComponent(connectionId)}`, {}, { method: 'DELETE' }),
  };
}

<script>
// Polite pacing for are.na: 150 ms between requests, and on 429 back off [2, 4, 8] s,
// honouring Retry-After. Wraps a function that returns a fetch Response.
const THROTTLE_GAP_MS = 150;
const THROTTLE_BACKOFF_S = [2, 4, 8];

// onWait(seconds, attempt) is called before each backoff sleep, so the UI can say so.
function createThrottle({
  gap = THROTTLE_GAP_MS,
  backoff = THROTTLE_BACKOFF_S,
  sleep = ms => new Promise(r => setTimeout(r, ms)),
  now = () => Date.now(),
  onWait = null,
} = {}) {
  let nextSlot = 0;

  // Reserve the next start time synchronously, so concurrent callers queue up in order.
  async function takeSlot() {
    const start = Math.max(now(), nextSlot);
    nextSlot = start + gap;
    const wait = start - now();
    if (wait > 0) await sleep(wait);
  }

  return async function throttled(doFetch) {
    for (let attempt = 0; ; attempt++) {
      await takeSlot();
      const res = await doFetch();
      if (res.status !== 429 || attempt >= backoff.length) return res;
      const retryAfter = Number(res.headers?.get?.('retry-after'));
      const seconds = retryAfter > 0 ? retryAfter : backoff[attempt];
      if (onWait) onWait(seconds, attempt + 1);
      await sleep(seconds * 1000);
    }
  };
}

</script>
<script>
// URL normaliser for spotting the same link saved twice. Pinterest- and Instagram-aware.
// Returns a comparison key (not a fetchable URL); unparseable input comes back unchanged.
const TRACKING_PARAMS = [
  'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content',
  'fbclid', 'igshid', 'ref', 'si', 'feature', 'mc_cid', 'mc_eid',
];

function normaliseUrl(u) {
  try {
    const url = new URL(u);
    const host = url.hostname.toLowerCase().replace(/^www\./, '');
    TRACKING_PARAMS.forEach(k => url.searchParams.delete(k));

    if (host.endsWith('pinterest.com')) {
      const m = url.pathname.match(/^\/pin\/(\d+)/);
      if (m) return `pinterest.com/pin/${m[1]}`;
    }
    // Shortcodes are case-sensitive, so this returns before the final lowercase.
    if (host === 'instagram.com') {
      const m = url.pathname.match(/^\/p\/([^/]+)/);
      if (m) return `instagram.com/p/${m[1]}`;
    }
    return (host + url.pathname + url.search).replace(/\/$/, '').toLowerCase();
  } catch {
    return u;
  }
}

// Every http(s) URL in a piece of text, normalised. Trailing punctuation is trimmed,
// so "see https://x.com/a)." doesn't key differently from "https://x.com/a".
function extractUrls(text) {
  if (!text) return [];
  return (text.match(/https?:\/\/\S+/gi) || []).map(raw => normaliseUrl(raw.replace(/[)\]>.,;:!?'"]+$/, '')));
}

<script>
// PAT connect widget: paste a token, test it against /me, remember it in localStorage.
// Built only from ArenaToolkit components. Options for tools that change things:
//  - requireWrite: the token is checked for write scope before it is accepted or saved.
//  - panel: arena-merge's Connect layout: a labelled field, a "Remember on this computer"
//    checkbox (unticked, the token lives in sessionStorage and goes with the tab), and an
//    account chip once connected. loadDetail(user) can fetch the chip's second line.
const AUTH_STORAGE_KEY = 'arena_toolkit_pat';
const AUTH_TOKEN_URL = 'https://www.are.na/settings/personal-access-tokens';

function readSavedToken(storage, key = AUTH_STORAGE_KEY) {
  try { return storage.getItem(key) || null; } catch { return null; }
}

function saveToken(storage, token, key = AUTH_STORAGE_KEY) {
  try { storage.setItem(key, token); } catch { /* private window or blocked storage: carry on unsaved */ }
}

function clearToken(storage, key = AUTH_STORAGE_KEY) {
  try { storage.removeItem(key); } catch { /* nothing to clear */ }
}

// Two letters for the account chip's avatar: "Kim Plowright" -> "KP", "kim-plowright" -> "K".
function initialsFor(user) {
  const name = String(user?.full_name || user?.slug || '?').trim();
  return name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
}

function describeConnectError(err) {
  if (err?.status === 401) return "are.na didn't recognise that token. Check it was copied whole.";
  if (err?.status === 429) return 'are.na is asking us to slow down. Try again in a minute.';
  if (err?.status) return `are.na said: ${err.message}`;
  return "Couldn't reach are.na. Check your connection and try again.";
}

// DELETE /connections/0 never matches anything: 403 means a read-only token, 404 means write is allowed.
// (The trick arena-merge and to-arena use; nothing is changed either way.)
async function checkWriteAccess(client) {
  try {
    await client.deleteConnection(0);
    return true;
  } catch (err) {
    if (err?.status === 403) return false;
    if (err?.status === 404) return true;
    throw err;
  }
}

function statusRow(label, message) {
  const row = document.createElement('div');
  Object.assign(row.style, { display: 'flex', flexWrap: 'wrap', gap: 'var(--space-2)', alignItems: 'center' });
  row.append(window.ArenaToolkit.Badge({ variant: 'alert', children: label }), message);
  return row;
}

function node(tag, text, style) {
  const n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (style) Object.assign(n.style, style);
  return n;
}

// client: from createArenaClient(). onChange(user | null) fires on connect and disconnect.
function createAuthStep({
  client,
  storage = globalThis.localStorage,
  session = globalThis.sessionStorage,
  storageKey = AUTH_STORAGE_KEY,
  onChange = null,
  requireWrite = false,
  panel = false,
  loadDetail = null,
} = {}) {
  const ATK = window.ArenaToolkit;
  let user = null;
  let detail = null;
  let remember = true;

  const element = node('div', null, { display: 'flex', flexDirection: 'column', gap: 'var(--space-2)' });

  function rememberCheck() {
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = remember;
    box.addEventListener('change', () => { remember = box.checked; });
    const text = node('span');
    text.append('Remember on this computer', node('br'), node('span', 'Unticked, it is forgotten when you close the tab.', {
      color: 'var(--text-muted)', font: 'var(--text-body-sm)',
    }));
    const label = node('label', null, { display: 'flex', gap: 'var(--space-2)', alignItems: 'flex-start', cursor: 'pointer' });
    label.append(box, text);
    return label;
  }

  function accountChip() {
    const avatar = node('div', initialsFor(user), {
      width: '32px', height: '32px', borderRadius: '50%', flexShrink: '0',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'var(--accent-primary)', color: 'var(--surface-page)', font: 'var(--text-ui-strong)',
    });
    const who = node('div', null, { flex: '1', minWidth: '0', color: 'var(--text-secondary)' });
    const name = node('strong', user.full_name || user.slug, { color: 'var(--text-primary)' });
    who.append('Signed in as ', name);
    if (detail) who.append(node('br'), node('span', detail, { color: 'var(--text-muted)', font: 'var(--text-body-sm)' }));
    const chip = node('div', null, {
      display: 'flex', alignItems: 'center', gap: 'var(--space-3)', padding: 'var(--space-3)',
      background: 'var(--surface-sunken)', borderRadius: 'var(--radius-sm)',
    });
    chip.append(avatar, who, ATK.Button({ variant: 'ghost', size: 'sm', children: 'Disconnect', onClick: disconnect }));
    return chip;
  }

  function render(statusNode) {
    element.replaceChildren();
    if (user && panel) {
      element.append(accountChip());
      return;
    }
    if (user) {
      const row = node('div', null, { display: 'flex', alignItems: 'center', gap: 'var(--space-2)' });
      row.append(
        ATK.Badge({ variant: 'success', children: `Connected as @${user.slug}` }),
        ATK.Button({ variant: 'ghost', size: 'sm', children: 'Disconnect', onClick: disconnect }),
      );
      element.append(row);
      return;
    }

    const intro = node('p', null, { margin: 0 });
    intro.append(
      panel ? 'Create a ' : 'Paste a ',
      ATK.Link({ href: AUTH_TOKEN_URL, children: 'personal access token' }),
    );
    if (requireWrite) {
      intro.append(panel
        ? ' with read and write ticked, then paste it below. The token stays in your browser only.'
        : ' with the write scope ticked. This tool changes your account: it adds and removes connections and edits blocks, so a read-only token will not work.');
    } else {
      intro.append(' with read access. That is all this tool needs. Some content, including private channels, only shows up once you are connected.');
    }
    intro.querySelector('a').target = '_blank';
    intro.querySelector('a').rel = 'noopener';

    const input = ATK.Input({ type: 'password', placeholder: panel ? 'paste it here' : 'Paste your token here' });
    input.id = 'arena-token';
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.style.flex = '1';
    const submit = () => connect(input.value);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

    const row = node('div', null, { display: 'flex', gap: 'var(--space-2)' });
    row.append(input, ATK.Button({ variant: panel ? 'secondary' : 'primary', children: 'Connect', onClick: submit }));

    const note = node('p', 'Your token stays in this browser and is only ever sent to are.na.', {
      margin: 0, color: 'var(--text-muted)', font: 'var(--text-body-sm)',
    });

    if (panel) {
      const label = node('label', 'Personal access token', { font: 'var(--text-ui-strong)', color: 'var(--text-muted)' });
      label.htmlFor = 'arena-token';
      element.append(intro, label, row, rememberCheck());
      if (statusNode) element.append(statusNode);
      return;
    }

    element.append(intro, row, note);
    if (statusNode) element.append(statusNode);
  }

  async function connect(rawToken) {
    const token = String(rawToken || '').trim();
    if (!token) {
      render(statusRow('No token', 'Paste a token first.'));
      return null;
    }
    render(ATK.Badge({ children: 'Checking…' }));
    client.setToken(token);
    try {
      user = await client.getCurrentUser();
    } catch (err) {
      client.setToken(null);
      render(statusRow('Couldn\'t connect', describeConnectError(err)));
      return null;
    }
    if (requireWrite) {
      let writable = false;
      try {
        writable = await checkWriteAccess(client);
      } catch (err) {
        client.setToken(null);
        user = null;
        render(statusRow('Couldn\'t connect', describeConnectError(err)));
        return null;
      }
      if (!writable) {
        client.setToken(null);
        user = null;
        render(statusRow('Read-only token', 'This token can\'t write. Create a new one with the write scope ticked.'));
        return null;
      }
    }
    // Remembered tokens go to localStorage; otherwise sessionStorage, which goes with the tab.
    clearToken(storage, storageKey);
    clearToken(session, storageKey);
    saveToken(remember ? storage : session, token, storageKey);
    detail = null;
    if (loadDetail) {
      render(node('p', 'Loading your channels…', { margin: 0, color: 'var(--text-muted)' }));
      try { detail = await loadDetail(user); } catch { detail = null; }
    }
    render();
    if (onChange) onChange(user);
    return user;
  }

  // Re-connect with a saved token, if there is one. Returns the user or null.
  async function restore() {
    const inLocal = readSavedToken(storage, storageKey);
    const saved = inLocal || readSavedToken(session, storageKey);
    if (!saved) { render(); return null; }
    remember = !!inLocal;
    const result = await connect(saved);
    if (!result) { clearToken(storage, storageKey); clearToken(session, storageKey); }
    return result;
  }

  function disconnect() {
    user = null;
    detail = null;
    client.setToken(null);
    clearToken(storage, storageKey);
    clearToken(session, storageKey);
    render();
    if (onChange) onChange(null);
  }

  render();
  return { element, connect, restore, disconnect, getUser: () => user };
}

</script>
<script>
// Multi-select channel picker, lifted from arena-merge's single-select dialog.
// Knows nothing about what the channels are for: give it channels and the ids already
// chosen, get the new ids back through onConfirm. Built from ArenaToolkit components.

// Case-insensitive match on title or slug. An empty query matches everything.
function filterChannels(channels, query) {
  const q = String(query || '').toLowerCase().trim();
  if (!q) return channels;
  return channels.filter(c => (c.title || '').toLowerCase().includes(q) || (c.slug || '').toLowerCase().includes(q));
}

// Returns a new array with id added or removed, keeping the order picked.
function toggleId(ids, id) {
  return ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id];
}

function blockCount(c) {
  return c.counts?.contents ?? c.counts?.blocks ?? c.length ?? null;
}

// channels: [{ id, slug, title, visibility, counts }]; selected: [id]
// Returns { element, open(), close() }; the element is a Modal you append to document.body.
function openChannelPicker({ channels, selected = [], title = 'Pick channels', confirmLabel = 'Use', onConfirm, onCancel = null }) {
  const ATK = window.ArenaToolkit;
  let chosen = [...selected];
  let query = '';

  const filter = ATK.Input({ type: 'search', placeholder: 'Filter by name or slug' });
  filter.setAttribute('aria-label', 'Filter channels');
  filter.addEventListener('input', () => { query = filter.value; renderList(); });

  const list = document.createElement('div');
  Object.assign(list.style, { display: 'flex', flexDirection: 'column', maxHeight: '50vh', overflowY: 'auto' });

  const confirm = ATK.Button({ variant: 'primary', children: confirmLabel, onClick: () => { done(); onConfirm(chosen); } });

  function updateConfirm() {
    confirm.textContent = `${confirmLabel} ${chosen.length} channel${chosen.length === 1 ? '' : 's'}`;
    confirm.disabled = chosen.length === 0;
  }

  function renderList() {
    const matches = filterChannels(channels, query);
    if (!matches.length) {
      const empty = document.createElement('p');
      empty.className = 'muted';
      empty.textContent = query ? `No channels match "${query}".` : 'No channels to show.';
      list.replaceChildren(empty);
    } else {
      list.replaceChildren(...matches.map(row));
    }
    updateConfirm();
  }

  function row(c) {
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = chosen.includes(c.id);
    box.addEventListener('change', () => { chosen = toggleId(chosen, c.id); updateConfirm(); });

    const n = blockCount(c);
    const text = document.createElement('span');
    Object.assign(text.style, { flex: '1', minWidth: '0' });
    const name = document.createElement('span');
    name.textContent = c.title || c.slug;
    const meta = document.createElement('span');
    meta.textContent = `${n ?? '?'} block${n === 1 ? '' : 's'} · ${c.slug}`;
    Object.assign(meta.style, { display: 'block', color: 'var(--text-muted)', font: 'var(--text-body-sm)' });
    text.append(name, meta);

    const label = document.createElement('label');
    Object.assign(label.style, {
      display: 'flex', alignItems: 'center', gap: 'var(--space-2)', cursor: 'pointer',
      padding: 'var(--space-2) var(--space-1)', borderBottom: '1px solid var(--border-card)',
    });
    label.append(box, text);
    if (c.visibility && c.visibility !== 'public') {
      label.append(ATK.Badge({ variant: c.visibility === 'private' ? 'private' : 'default', children: c.visibility }));
    }
    return label;
  }

  const clear = ATK.Button({ variant: 'ghost', children: 'Clear', onClick: () => { chosen = []; renderList(); } });
  const cancel = ATK.Button({ variant: 'secondary', children: 'Cancel', onClick: () => { done(); if (onCancel) onCancel(); } });

  const body = document.createElement('div');
  Object.assign(body.style, { display: 'flex', flexDirection: 'column', gap: 'var(--space-3)' });
  body.append(filter, list);

  const footer = document.createElement('div');
  Object.assign(footer.style, { display: 'flex', justifyContent: 'space-between', gap: 'var(--space-2)', width: '100%' });
  const right = document.createElement('div');
  Object.assign(right.style, { display: 'flex', gap: 'var(--space-2)' });
  right.append(cancel, confirm);
  footer.append(clear, right);

  const modal = ATK.Modal({ title, children: body, footer, onClose: () => { if (onCancel) onCancel(); } });
  function done() { modal.remove(); }

  renderList();
  document.body.append(modal);
  setTimeout(() => filter.focus(), 50);
  return { element: modal, close: done };
}

</script>
<script>
// Pure clustering: group blocks that share a normalised URL (or, optionally, title + description).

function keysForBlock(b, opts) {
  const keys = new Set();
  if (opts.sourceUrl && b.source?.url) keys.add(normaliseUrl(b.source.url));
  if (opts.descriptionUrls) extractUrls(b.description?.plain).forEach(k => keys.add(k));
  if (opts.titleDesc) {
    const t = (b.title || '').trim().toLowerCase();
    const d = (b.description?.plain || '').trim().toLowerCase().slice(0, 200);
    if (t.length > 3 && d.length > 10) keys.add(`td:${t}|${d}`);
  }
  return [...keys];
}

// Blocks sharing any key land in the same bucket; buckets of 2+ are clusters.
// A block connected into several channels appears once per channel in a scan, so de-dupe by id first.
// With opts.skipMarked, blocks already carrying metadata.dupe_of are left out.
function clusterBlocks(blocks, opts) {
  const seen = new Set();
  const buckets = new Map();
  for (const b of blocks) {
    if (seen.has(b.id)) continue;
    seen.add(b.id);
    if (opts.skipMarked && b.metadata?.dupe_of != null) continue;
    for (const k of keysForBlock(b, opts)) {
      if (!buckets.has(k)) buckets.set(k, []);
      buckets.get(k).push(b);
    }
  }
  return [...buckets.values()].filter(cluster => cluster.length >= 2);
}

<script>
// Saved scan configurations: a name, the channels to scan and the detector switches.
// Stored under one localStorage key, as { [name]: { channelIds, detectors, created_at, last_run } }.
const SETS_KEY = 'arena_dupefinder_sets';
const OFFENDERS_KEY = 'arena_dupefinder_offenders';

const DEFAULT_DETECTORS = { sourceUrl: true, descriptionUrls: true, titleDesc: false, skipMarked: true };

function readJson(storage, key, fallback) {
  try {
    const raw = storage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function writeJson(storage, key, value) {
  try { storage.setItem(key, JSON.stringify(value)); } catch { /* blocked storage: carry on unsaved */ }
}

function loadSets(storage) {
  const sets = readJson(storage, SETS_KEY, {});
  return sets && typeof sets === 'object' && !Array.isArray(sets) ? sets : {};
}

// Saves (or overwrites) a named set. Returns the trimmed name, or null if the name is empty.
function saveSet(storage, name, { channelIds, detectors = DEFAULT_DETECTORS }, now = new Date()) {
  const key = String(name || '').trim();
  if (!key) return null;
  const sets = loadSets(storage);
  sets[key] = { channelIds: [...channelIds], detectors: { ...detectors }, created_at: sets[key]?.created_at || now.toISOString(), last_run: sets[key]?.last_run || null };
  writeJson(storage, SETS_KEY, sets);
  return key;
}

function deleteSet(storage, name) {
  const sets = loadSets(storage);
  delete sets[name];
  writeJson(storage, SETS_KEY, sets);
}

// Channels where duplicates turned up before, to pre-tick next time.
function loadOffenders(storage) {
  const ids = readJson(storage, OFFENDERS_KEY, []);
  return Array.isArray(ids) ? ids : [];
}

function addOffenders(storage, ids) {
  writeJson(storage, OFFENDERS_KEY, [...new Set([...loadOffenders(storage), ...ids])]);
}

// Drops ids for channels that no longer exist in `channels` (deleted, or not yours any more).
function pruneIds(ids, channels) {
  const known = new Set(channels.map(c => c.id));
  return ids.filter(id => known.has(id));
}

</script>
<script>
// Are.na Duplicate Finder: six-step wizard shell. Steps 2 to 6 are placeholders for now.
// Plain DOM, built from ArenaToolkit components. No framework.
(function () {
  const ATK = window.ArenaToolkit;
  const h = (tag, attrs, kids) => ATK._el(tag, attrs, kids);

  const throttle = createThrottle();
  const client = createArenaClient({ throttle });

  const STEPS = [
    { id: 'connect', label: 'Connect', description: 'Paste a token that can write to your account.' },
    { id: 'scope', label: 'Scope', description: 'Choose the channels to scan.' },
    { id: 'detect', label: 'Detect', description: 'Choose how duplicates are spotted.' },
    { id: 'scan', label: 'Scan', description: 'Read the channels and group the duplicates.' },
    { id: 'review', label: 'Review', description: 'Pick the block to keep in each group.' },
    { id: 'done', label: 'Done', description: 'See what changed.' },
  ];

  const state = { step: 0, furthest: 0, user: null, myChannels: [], channelIds: [], setName: '' };

  const els = {
    header: document.getElementById('header'),
    rail: document.getElementById('step-rail'),
    pane: document.getElementById('step-pane'),
  };

  /* ── Auth ─────────────────────────────────────────────────── */
  const auth = createAuthStep({
    client,
    requireWrite: true,
    panel: true,
    // Loaded at connect time, as arena-merge does, so the Scope step has its list ready.
    loadDetail: async (user) => {
      state.myChannels = (await client.getUserContents(user.id, { type: 'Channel' })).filter(c => c && c.state !== 'deleted');
      const n = state.myChannels.length;
      return `${n} of your channel${n === 1 ? '' : 's'} loaded`;
    },
    onChange: (user) => {
      state.user = user;
      if (!user) { state.furthest = 0; state.step = 0; state.myChannels = []; state.channelIds = []; state.setName = ''; }
      render();
    },
  });

  /* ── Navigation ───────────────────────────────────────────── */
  // A step can be entered once the one before it has been completed.
  function canEnter(i) {
    return i <= state.furthest;
  }

  function go(i) {
    if (i < 0 || i >= STEPS.length || !canEnter(i)) return;
    state.step = i;
    render();
  }

  function advance() {
    state.furthest = Math.max(state.furthest, state.step + 1);
    go(state.step + 1);
  }

  /* ── Rail ─────────────────────────────────────────────────── */
  function renderRail() {
    const items = STEPS.map((s, i) => ({
      label: s.label,
      description: s.description,
      state: i === state.step ? 'current' : i < state.step ? 'done' : 'upcoming',
    }));
    const stepper = ATK.Stepper({ items });
    stepper.querySelectorAll('.atk-stepper__item').forEach((item, i) => {
      if (!canEnter(i)) item.classList.add('is-locked');
      item.addEventListener('click', () => go(i));
    });
    els.rail.replaceChildren(stepper);
  }

  /* ── Steps ────────────────────────────────────────────────── */
  function nav({ back = true, next = null } = {}) {
    const row = h('div', { className: 'step-nav' });
    row.append(
      back ? ATK.Button({ variant: 'ghost', children: '← Back', onClick: () => go(state.step - 1) }) : h('span'),
      next ? ATK.Button({ variant: 'primary', children: next.label, disabled: next.disabled, onClick: next.onClick }) : h('span'),
    );
    return row;
  }

  function stepConnect() {
    return [
      h('h2', null, 'Connect to are.na'),
      auth.element,
      nav({ back: false, next: { label: 'Continue →', disabled: !state.user, onClick: advance } }),
    ];
  }

  /* Scope: which channels to scan, optionally saved under a name. */
  function stepScope() {
    const NEW = '';
    const sets = loadSets(localStorage);
    const byId = new Map(state.myChannels.map(c => [c.id, c]));

    const select = ATK.Select({
      options: [{ value: NEW, label: '— New scan —' }, ...Object.keys(sets).map(n => ({ value: n, label: n }))],
      value: state.setName,
      onChange: (e) => {
        state.setName = e.target.value;
        // Saved ids can outlive their channels, so drop any that have gone.
        state.channelIds = state.setName ? pruneIds(sets[state.setName].channelIds, state.myChannels) : [];
        render();
      },
    });

    const pickBtn = ATK.Button({
      variant: 'secondary',
      children: state.channelIds.length ? 'Change channels' : 'Pick channels',
      onClick: () => {
        const offenders = pruneIds(loadOffenders(localStorage), state.myChannels);
        openChannelPicker({
          channels: state.myChannels,
          selected: state.channelIds.length ? state.channelIds : offenders,
          title: 'Pick channels to scan',
          confirmLabel: 'Scan',
          onConfirm: (ids) => { state.channelIds = ids; render(); },
        });
      },
    });

    const chosen = h('div', { className: 'chosen' }, state.channelIds.map(id => {
      const c = byId.get(id);
      const chip = h('span', { className: 'chosen__item' }, [
        ATK.Badge({ children: c ? (c.title || c.slug) : `#${id}` }),
        h('button', {
          type: 'button', className: 'chosen__remove', 'aria-label': `Remove ${c ? (c.title || c.slug) : id}`,
          onclick: () => { state.channelIds = state.channelIds.filter(x => x !== id); render(); },
        }, '×'),
      ]);
      return chip;
    }));
    if (!state.channelIds.length) chosen.append(h('p', { className: 'muted' }, 'No channels chosen yet.'));

    const nameInput = ATK.Input({ placeholder: 'Name this selection, to use it again' });
    nameInput.value = state.setName;
    const saveBtn = ATK.Button({
      variant: 'secondary', children: 'Save',
      disabled: !state.channelIds.length,
      onClick: () => {
        const name = saveSet(localStorage, nameInput.value, { channelIds: state.channelIds });
        if (name) { state.setName = name; render(); }
      },
    });

    return [
      h('h2', null, 'Choose channels to scan'),
      h('p', null, 'Pick the channels where you suspect duplicates. Blocks are compared across all of them.'),
      h('div', { className: 'stack' }, [
        h('label', { className: 'field-label' }, 'Saved selections'),
        select,
      ]),
      h('div', { className: 'stack' }, [
        h('label', { className: 'field-label' }, `Channels (${state.channelIds.length})`),
        chosen,
        h('div', null, pickBtn),
      ]),
      h('div', { className: 'stack' }, [
        h('label', { className: 'field-label' }, 'Save as'),
        h('div', { className: 'row' }, [nameInput, saveBtn]),
      ]),
      nav({ next: { label: 'Continue →', disabled: !state.channelIds.length, onClick: advance } }),
    ];
  }

  function stepPlaceholder(i) {
    return [
      h('h2', null, `${i + 1}. ${STEPS[i].label}`),
      h('p', { className: 'muted' }, 'Not built yet.'),
      nav({ next: i < STEPS.length - 1 ? { label: 'Continue →', onClick: advance } : null }),
    ];
  }

  function render() {
    renderRail();
    const kids = state.step === 0 ? stepConnect() : state.step === 1 ? stepScope() : stepPlaceholder(state.step);
    els.pane.replaceChildren(...kids);
  }

  /* ── Header ───────────────────────────────────────────────── */
  function mountHeader() {
    const crumbs = h('nav', { className: 'crumbs', 'aria-label': 'Breadcrumb' },
      h('ol', null, [
        h('li', null, ATK.Link({ variant: 'muted', href: 'index.html', children: 'Are.na Tools' })),
        h('li', { 'aria-current': 'page' }, 'Are.na Duplicate Finder'),
      ]));
    els.header.append(crumbs, ATK.ThemeChooser());
  }

  mountHeader();
  render();
  auth.restore();
})();

</script>
