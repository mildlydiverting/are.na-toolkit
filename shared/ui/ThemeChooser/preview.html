<!-- @dsCard group="Overlays" height=260 -->
<!doctype html>
<html>
<head><style>
  body { margin: 0; padding: 20px; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); }
  #root { display: flex; justify-content: flex-end; }
</style></head>
<body>
<div id="root"></div>
<script>
  // ThemeChooser applies a theme to <html> as soon as it is created. In this card, keep the theme
  // the page is showing; choosing from the menu still switches it.
  var shown = document.documentElement.getAttribute('data-theme');
  document.getElementById('root').appendChild(window.ArenaToolkit.ThemeChooser());
  if (shown) document.documentElement.setAttribute('data-theme', shown);
</script>
</body>
</html>
