/* Arena Toolkit — generated from tokens.json */
:root, [data-theme="light"] {
  --surface-page: #ffffff; /* Page background. are.na --colors-background / gray0. */
  --surface-card: #f7f7f7; /* Content cards. Lifts above surface-page. are.na gray1. */
  --surface-media: #ededed; /* Behind thumbnails and image placeholders. are.na gray2. */
  --surface-sunken: #ededed; /* Inset or quiet panels. Shares gray2 with surface-media on purpose. */
  --border-card: #ededed; /* Hairline between cards and page. 1px solid. are.na gray2. */
  --border-input: #dedede; /* Default input border. Visible but quiet. are.na gray3. */
  --border-strong: #999999; /* Divider or border that carries weight. are.na gray4. */
  --border-focus: #000000; /* Focus ring. are.na --colors-foreground / gray7. */
  --text-primary: #000000; /* Body text and primary labels. are.na --colors-foreground / gray7. */
  --text-secondary: #333333; /* Supporting text. Links. are.na --colors-link / gray6. */
  --text-muted: #696969; /* Low-emphasis text. Labels above fields, status lines. are.na --colors-slate / gray5. */
  --text-faint: #999999; /* Placeholders and disabled text. Never for text that must be read. are.na gray4. */
  --text-heading: #333333; /* Section headings. Deliberately a touch quieter than text-primary. are.na gray6. */
  --accent-primary: #00075f; /* Primary call-to-action background. are.na --colors-brandDark / blue3 — always the high-contrast opposite of the page: deep navy on light themes, near-white or pale indigo on dark themes. */
  --accent-focus: #3d46c2; /* Focus ring and current selection. are.na --colors-focus / blue2. Dawn uses a dustier, more muted indigo. */
  --accent-success: #238020; /* Positive status, confirmation. are.na --colors-channelPublic3 / green3. */
  --accent-notification: #a87253; /* Soft notification brown. are.na --colors-notification. Dawn is the warmest. */
  --accent-private: #b93d3d; /* Private channel marker. are.na --colors-channelPrivate3 / red3. Light / Dark are red; Dawn / Dusk shift to rose pink. */
  --accent-alert: #e15100; /* Warnings, destructive-action confirmations, errors. are.na --colors-alert. */
  --channel-open: #b4d6b3; /* Resting border on an open (public) channel block. are.na --colors-channelPublic2 / green2. Hover deepens to accent-success. */
  --channel-private: #dfbebe; /* Resting border on a private channel block. are.na --colors-channelPrivate2 / red2. Hover deepens to accent-private. */
  --channel-bar-open: #f4f8f3; /* Fill of an open (public) channel row. are.na --colors-channelPublic1 / green1. Closed rows use surface-card (are.na channelClosed1). */
  --channel-bar-private: #faf4f3; /* Fill of a private channel row. are.na --colors-channelPrivate1 / red1. */
  --channel-badge-open: #eaf1e7; /* Badge fill on an open channel row, a step off channel-bar-open. Not an are.na variable: sampled from are.na's rendered row (within one step). */
  --channel-badge-closed: #efefef; /* Badge fill on a closed channel row, a step off surface-card. */
  --channel-badge-private: #f5eae8; /* Badge fill on a private channel row, a step off channel-bar-private. */
  --shadow-soft: 0 0 20px rgba(0, 0, 0, 0.08); /* Elevated card. Modal. Dropdown. */
  --shadow-ambient: 0 0 34px rgba(0, 0, 0, 0.05); /* Very subtle ground shadow. Hover lift. */
}

:root {
  --space-nudge: 2px; /* Micro adjustment. Code chip vertical padding, 2px baseline shifts. Not step zero — a named special-purpose value in are.na. */
  --space-1: 5px; /* Tight spacing within a related group. Gap between inline elements. */
  --space-2: 10px; /* Small gaps between controls. Button icon-to-text gap. Horizontal padding on compact inputs. */
  --space-3: 15px; /* The workhorse. Default padding. Card interior. Grid gutters. */
  --space-4: 20px; /* Section spacing. Headroom around a block. Toast padding. */
  --space-5: 25px; /* Modest section break. */
  --space-6: 35px; /* Large section break. Between major regions. */
  --space-7: 45px; /* Big section break. */
  --space-8: 65px; /* Page-level gaps. Padding of modal containers. */
  --space-9: 80px; /* Hero and marketing structure. */
  --space-10: 100px; /* Very large spacing. Marketing-only. */
  --space-11: 130px; /* Page-level marketing hero padding. */
  --radius-sm: 3px; /* The default. Buttons, inputs, cards, media, thumbnails, badges — essentially everything. are.na --radii-1. */
  --radius-round: 50%; /* Perfect circles. Avatars, dot indicators. are.na --radii-round. */
  --radius-pill: 9999px; /* Full pills. Audio scrubbers, progress tracks, segmented controls — NOT badges in are.na. are.na --radii-pill. */
  --font-sans: "Areal", Arial, Helvetica, sans-serif;

<style>
/* ArenaToolkit — component styles. All colours route through tokens.css so themes flip automatically. */

.atk-btn {
  font-family: var(--font-sans);
  font-size: 14.4px;
  line-height: 1;
  font-weight: 700;
  padding: 0 var(--space-3);
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
  box-sizing: border-box;
}
.atk-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.atk-btn--primary {
  background: var(--accent-primary);
  color: var(--surface-page);
  border-color: var(--accent-primary);
}
.atk-btn--primary:hover:not(:disabled) {
  background: var(--text-primary);
  border-color: var(--text-primary);
}

.atk-btn--secondary {
  background: transparent;
  color: var(--text-secondary);
  border-color: var(--border-strong);
}
.atk-btn--secondary:hover:not(:disabled) {
  color: var(--text-primary);
  border-color: var(--text-primary);
}

.atk-btn--ghost {
  background: var(--surface-card);
  color: var(--text-secondary);
}
.atk-btn--ghost:hover:not(:disabled) {
  background: var(--surface-media);
  color: var(--text-primary);
}

.atk-btn--sm {
  font-size: 12.5px;
  height: 28px;
  padding: 0 var(--space-2);
}

/* Input */
.atk-input {
  font-family: var(--font-sans);
  font-size: 14.4px;
  line-height: 1.2;
  font-weight: 400;
  padding: 0 var(--space-2);
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-input);
  background: var(--surface-card);
  color: var(--text-primary);
  outline: none;
  width: 100%;
  box-sizing: border-box;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}
.atk-input:hover { border-color: var(--border-strong); }
.atk-input:focus { border-color: var(--border-focus); }
.atk-input::placeholder { color: var(--text-faint); }
.atk-input:disabled {
  color: var(--text-faint);
  background: var(--surface-sunken);
  cursor: not-allowed;
}

/* Link */
.atk-link {
  color: var(--text-secondary);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: 1px;
  font-weight: 700;
  cursor: pointer;
  transition: color 120ms ease;
}
.atk-link:hover { color: var(--text-primary); }

.atk-link--muted {
  color: var(--text-muted);
  text-decoration: none;
  font-weight: 400;
}
.atk-link--muted:hover { color: var(--text-primary); }

/* Card */
.atk-card {
  background: transparent;
  border: 1px solid var(--border-card);
  border-radius: var(--radius-sm);
  padding: var(--space-3);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14.4px;
  line-height: 21px;
}
/* Cards are unfilled by default; opt in with variant: 'filled'. */
.atk-card--filled { background: var(--surface-card); }
.atk-card__title {
  font-size: 16px;
  font-weight: 700;
  line-height: 20px;
  margin: 0 0 var(--space-1) 0;
}
.atk-card__body { color: var(--text-secondary); }

/* Badge — matches are.na's .c-eZIjnL: 3px radius chip, mono, 10px uppercase. */
.atk-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 18px;
  padding: 0 6px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-transform: uppercase;
  white-space: nowrap;
  vertical-align: middle;
  background: var(--surface-card);
  color: var(--text-muted);
}
.atk-badge--private {
  background: var(--accent-private);
  color: var(--surface-page);
}
.atk-badge--success {
  background: var(--accent-success);
  color: var(--surface-page);
}
.atk-badge--alert {
  background: var(--accent-alert);
  color: var(--surface-page);
}
.atk-badge--focus {
  background: var(--accent-focus);
  color: var(--surface-page);
}

/* Block — matches are.na's channel-grid block pattern. Four variants: image, attachment, text, channel.
   Blocks are always square and SPACIOUS — ~260–320px in the real UI, laid out on a repeat(auto-fill, minmax(260px, 1fr)) grid. */
.atk-block {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface-page);
  overflow: hidden;
  box-sizing: border-box;
  aspect-ratio: 1 / 1;
  min-width: 180px;
}

/* image + attachment: no border, image fills */
.atk-block--image,
.atk-block--attachment {
  padding: 0;
  background: var(--surface-media);
}
.atk-block--image > img,
.atk-block--attachment > img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* text: hairline border, generous padding, content top-left aligned, supports inline markup */
.atk-block--text {
  border: 1px solid var(--border-card);
  padding: var(--space-3);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.45;
  color: var(--text-primary);
}
.atk-block--text strong,
.atk-block--text b { font-weight: 700; }
.atk-block--text em,
.atk-block--text i { font-style: italic; }
.atk-block--text a {
  color: var(--text-primary);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* Fading text wrapper — mirrors are.na's .c-ftzJsE-gidtAM-direction-vertical.
   Overflow fades to transparent over the bottom third of the block so long
   text goes soft rather than hard-clipping, and action buttons overlay cleanly. */
.atk-block__text-fade {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to top, transparent 0%, #000 33%);
          mask-image: linear-gradient(to top, transparent 0%, #000 33%);
}
.atk-block__text-fade > p { margin: 0 0 var(--space-2) 0; }
.atk-block__text-fade > p:last-child { margin-bottom: 0; }

/* channel: 2px border, content centred. Three colour variants matching are.na's channel states.
   Default (variant 'channel') is the closed/neutral look. */
.atk-block--channel,
.atk-block--channel-closed,
.atk-block--channel-open,
.atk-block--channel-private {
  border-width: 2px;
  border-style: solid;
  padding: var(--space-3);
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: border-color 120ms ease;
}

/* Closed / default — grey. */
.atk-block--channel,
.atk-block--channel-closed {
  border-color: var(--border-input);
}
.atk-block--channel:hover,
.atk-block--channel:focus-within,
.atk-block--channel-closed:hover,
.atk-block--channel-closed:focus-within {
  border-color: var(--text-secondary);
}

/* Open — green. Soft resting border, deep hover. Text takes the strong green. */
.atk-block--channel-open {
  border-color: var(--channel-open);
  color: var(--accent-success);
}
.atk-block--channel-open:hover,
.atk-block--channel-open:focus-within {
  border-color: var(--accent-success);
}

/* Private — red/pink border and text. */
.atk-block--channel-private {
  border-color: var(--channel-private);
  color: var(--accent-private);
}
.atk-block--channel-private:hover,
.atk-block--channel-private:focus-within {
  border-color: var(--accent-private);
}

/* Channel body stack — title / byline / meta, centred */
.atk-block__content {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  min-width: 0;
  max-width: 100%;
}
.atk-block__title {
  font-size: 24px;
  line-height: 1.25;
  font-weight: 400;
  color: inherit;
}
.atk-block__byline {
  font-size: 14.4px;
  line-height: 1.35;
  font-weight: 700;
  color: inherit;
  margin-top: var(--space-1);
}
.atk-block__meta {
  font-size: 14.4px;
  line-height: 1.35;
  font-weight: 400;
  color: inherit;
}

/* Label — small chip, bottom-right. e.g. "PDF" on attachment blocks. */
.atk-block__label {
  position: absolute;
  right: var(--space-2);
  bottom: var(--space-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 18px;
  padding: 0 6px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1;
  font-weight: 600;
  text-transform: uppercase;
  background: var(--surface-card);
  color: var(--text-muted);
  pointer-events: none;
}

/* Actions row — hover-revealed. Mirrors are.na's .c-hRIxJA pattern. */
.atk-block__actions {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-3);
  opacity: 0;
  visibility: hidden;
  transform: translateY(2px);
  transition: opacity 150ms ease, transform 150ms ease, visibility 150ms;
  pointer-events: none;
}
.atk-block:hover .atk-block__actions,
.atk-block:focus-within .atk-block__actions {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  pointer-events: auto;
}

/* Individual action button — same size as a toolkit Button (md), but bare until hovered */
.atk-block__action {
  all: unset;
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  height: 36px;                /* matches .atk-btn */
  padding: 0 var(--space-3);   /* matches .atk-btn */
  font-family: var(--font-sans);
  font-size: 14.4px;           /* matches .atk-btn */
  font-weight: 700;            /* matches .atk-btn */
  line-height: 1;              /* matches .atk-btn */
  color: var(--text-primary);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-decoration: none;
  transition: border-color 120ms ease, background-color 120ms ease;
}
.atk-block__action:hover {
  border-color: var(--border-strong);
  background: var(--surface-card);
}
.atk-block__action:focus-visible {
  border-color: var(--border-focus);
  outline: none;
}
/* A lone action fills the row — e.g. a block that only offers "Connect →" */
.atk-block__actions .atk-block__action:only-child {
  flex: 1;
}

/* Badge — filled brand & nsfw variants (NEW / BETA / API / NSFW chips) */
.atk-badge--brand {
  background: var(--accent-primary);
  color: var(--surface-page);
}
.atk-badge--nsfw {
  background: var(--accent-notification);
  color: var(--surface-page);
}

/* ────────────────────────────────────────────────────────────
   Modal — centred panel on a dimmed, blurred backdrop
   ──────────────────────────────────────────────────────────── */
.atk-modal__backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.25);
  -webkit-backdrop-filter: blur(8px);
          backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
  z-index: 100;
  font-family: var(--font-sans);
}
.atk-modal {
  background: var(--surface-card);

    <section class="input-bar" id="input-bar">
      <!-- Input + Inspect button -->
    </section>

    <section class="result-pane" id="result-pane" aria-live="polite">
      <!-- Block / Connections / Channels sections render here -->
    </section>
  </main>

<script>
/* ArenaToolkit — component bundle. Classic script, assigns window.ArenaToolkit. */
(function () {
  'use strict';

  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'className') node.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
        else if (k.indexOf('on') === 0 && typeof v === 'function') {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (v === true) {
          node.setAttribute(k, '');
        } else {
          node.setAttribute(k, String(v));
        }
      }
    }
    if (kids == null) return node;
    if (!Array.isArray(kids)) kids = [kids];
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i];
      if (c == null) continue;
      if (typeof c === 'string' || typeof c === 'number') {
        node.appendChild(document.createTextNode(String(c)));
      } else {
        node.appendChild(c);
      }
    }
    return node;
  }

  function Button(opts) {
    opts = opts || {};
    var cls = ['atk-btn', 'atk-btn--' + (opts.variant || 'primary')];
    if (opts.size === 'sm') cls.push('atk-btn--sm');
    return el('button', {
      className: cls.join(' '),
      type: opts.type || 'button',
      disabled: opts.disabled || null,
      onclick: opts.onClick
    }, opts.children);
  }

  function Input(opts) {
    opts = opts || {};
    var node = el('input', {
      className: 'atk-input',
      type: opts.type || 'text',
      placeholder: opts.placeholder || null,
      name: opts.name || null,
      disabled: opts.disabled || null,
      oninput: opts.onInput
    });
    if (opts.value != null) node.value = opts.value;
    return node;
  }

  function Link(opts) {
    opts = opts || {};
    var cls = ['atk-link'];
    if (opts.variant === 'muted') cls.push('atk-link--muted');
    return el('a', {
      className: cls.join(' '),
      href: opts.href || '#'
    }, opts.children);
  }

  function Card(opts) {
    opts = opts || {};
    var kids = [];
    if (opts.title) kids.push(el('div', { className: 'atk-card__title' }, opts.title));
    kids.push(el('div', { className: 'atk-card__body' }, opts.children));
    return el('div', { className: opts.variant === 'filled' ? 'atk-card atk-card--filled' : 'atk-card' }, kids);
  }

  function Badge(opts) {
    opts = opts || {};
    var cls = ['atk-badge'];
    if (opts.variant && opts.variant !== 'default') cls.push('atk-badge--' + opts.variant);
    return el('span', { className: cls.join(' ') }, opts.children);
  }

  function Block(opts) {
    opts = opts || {};
    var variant = opts.variant || 'text';
    var cls = ['atk-block', 'atk-block--' + variant];
    var kids = [];

    // Image (image / attachment variants)
    if (opts.src) {
      kids.push(el('img', { src: opts.src, alt: opts.alt || '' }));
    }

    // Text variant: content IS the block body — children or html, with inline markup allowed.
    // Channel variant: structured title / byline / meta, centred.
    if (variant === 'text') {
      var textWrap;
      if (opts.html != null) {
        textWrap = el('div', { className: 'atk-block__text-fade' });
        textWrap.innerHTML = opts.html;
      } else {
        textWrap = el('div', { className: 'atk-block__text-fade' }, opts.children);
      }
      kids.push(textWrap);
    } else if (variant === 'channel' || variant.indexOf('channel-') === 0) {
      var body = [];
      if (opts.title) body.push(el('div', { className: 'atk-block__title' }, opts.title));
      if (opts.byline) body.push(el('div', { className: 'atk-block__byline' }, opts.byline));
      if (opts.meta) body.push(el('div', { className: 'atk-block__meta' }, opts.meta));
      if (body.length) kids.push(el('div', { className: 'atk-block__content' }, body));
    }

    // Label (bottom-right chip, e.g. "PDF")
    if (opts.label) {
      kids.push(el('span', { className: 'atk-block__label' }, opts.label));
    }

    // Hover-revealed actions row
    if (opts.actions && opts.actions.length) {
      var actionNodes = opts.actions.map(function (a) {
        var tag = a.href ? 'a' : 'button';
        var attrs = {
          className: 'atk-block__action',
          href: a.href || null,
          type: a.href ? null : 'button',
          onclick: a.onClick
        };
        return el(tag, attrs, a.label);
      });
      kids.push(el('div', { className: 'atk-block__actions' }, actionNodes));
    }

    return el('div', { className: cls.join(' ') }, kids);
  }

  function KeyChip(opts) {
    opts = opts || {};
    return el('kbd', { className: 'atk-key' }, opts.children);
  }

  function Menu(opts) {
    opts = opts || {};
    var menu = el('div', { className: 'atk-menu', role: 'menu' });
    (opts.items || []).forEach(function (item) {
      if (item.separator) {
        menu.appendChild(el('div', { className: 'atk-menu__separator' }));
        return;
      }
      var tag = item.href ? 'a' : 'button';
      var kids = [];
      if (item.icon) kids.push(el('span', { className: 'atk-menu__icon' }, item.icon));
      kids.push(el('span', { className: 'atk-menu__label' }, item.label));
      if (item.shortcut) {
        kids.push(el('span', { className: 'atk-menu__shortcut' },
          KeyChip({ children: item.shortcut })));
      }
      menu.appendChild(el(tag, {
        className: 'atk-menu__item',
        href: item.href || null,
        type: item.href ? null : 'button',
        role: 'menuitem',
        onclick: item.onClick
      }, kids));
    });
    return menu;
  }

  function Modal(opts) {
    opts = opts || {};
    var backdrop = el('div', { className: 'atk-modal__backdrop', role: 'dialog', 'aria-modal': 'true' });
    var panel = el('div', { className: 'atk-modal' });

    function close(e) {
      if (opts.onClose) opts.onClose(e);
      if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
    }

    if (opts.title) {
      var closeBtn = el('button', {
        className: 'atk-modal__close',
        type: 'button',
        onclick: close,
        'aria-label': 'Close'
      }, '×');
      panel.appendChild(el('div', { className: 'atk-modal__header' }, [
        el('span', null, opts.title),
        closeBtn
      ]));
    }
    if (opts.children != null) {
      panel.appendChild(el('div', { className: 'atk-modal__body' }, opts.children));
    }
    if (opts.footer != null) {
      panel.appendChild(el('div', { className: 'atk-modal__footer' }, opts.footer));
    }

    backdrop.appendChild(panel);
    backdrop.addEventListener('click', function (e) {
      if (e.target === backdrop) close(e);
    });
    return backdrop;
  }

  function Select(opts) {
    opts = opts || {};
    var attrs = {
      className: 'atk-select',
      name: opts.name || null,
      disabled: opts.disabled || null,
      onchange: opts.onChange
    };
    var options = (opts.options || []).map(function (o) {
      if (typeof o === 'string') o = { value: o, label: o };
      var optAttrs = { value: o.value };
      if (o.value === opts.value) optAttrs.selected = '';
      return el('option', optAttrs, o.label);
    });
    return el('select', attrs, options);
  }

  function Textarea(opts) {
    opts = opts || {};
    var node = el('textarea', {
      className: 'atk-textarea',
      placeholder: opts.placeholder || null,
      name: opts.name || null,
      rows: opts.rows || null,
      disabled: opts.disabled || null,
      oninput: opts.onInput
    });
    if (opts.value != null) node.value = opts.value;
    return node;
  }

  function Tabs(opts) {
    opts = opts || {};
    var tabs = el('div', { className: 'atk-tabs', role: 'tablist' });
    var items = opts.items || [];
    items.forEach(function (t, idx) {
      var isActive = (opts.value != null)
        ? (t.value === opts.value)
        : (idx === 0);
      var kids = [t.label];
      if (t.count != null) {
        kids.push(el('span', { className: 'atk-tabs__count' }, String(t.count)));
      }
      tabs.appendChild(el('button', {
        className: 'atk-tabs__tab',
        type: 'button',
        role: 'tab',
        'aria-selected': isActive ? 'true' : 'false',
        onclick: function (e) {
          if (opts.onChange) opts.onChange(t.value, e);
        }
      }, kids));
    });
    return tabs;
  }

  function Stepper(opts) {
    opts = opts || {};
    var root = el('div', { className: 'atk-stepper' });
    (opts.items || []).forEach(function (step) {
      var state = step.state || 'upcoming';
      var item = el('div', { className: 'atk-stepper__item is-' + state });
      item.appendChild(el('div', { className: 'atk-stepper__track' },
        el('span', { className: 'atk-stepper__dot' })));
      var body = el('div', { className: 'atk-stepper__body' },
        el('div', { className: 'atk-stepper__label' }, step.label));
      if (step.description && state === 'current') {
        body.appendChild(el('div', { className: 'atk-stepper__description' }, step.description));
      }
      item.appendChild(body);
      root.appendChild(item);
    });
    return root;
  }

  /* ── ThemeChooser ──────────────────────────────────────────────
     Palette button + Menu of themes. Sets data-theme on <html> and
     remembers the choice in localStorage, shared by every tool on the
     same origin. Order of precedence: ?theme= (not saved) > saved > system. */

  var THEME_KEY = 'arena_toolkit_theme';
  var THEME_OPTIONS = [
    { id: 'light', label: 'Light' },
    { id: 'dusk', label: 'Dusk' },
    { id: 'dark', label: 'Dark' },
    { id: 'dawn', label: 'Dawn' }
  ];

  // Palette: the system's own Icons/Theme.svg (Phosphor), inlined so it takes the text colour.
  var PALETTE_SVG =
    '<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M200.77,53.89A103.27,103.27,0,0,0,128,24h-1.07A104,104,0,0,0,24,128c0,43,26.58,79.06,69.36,94.17A32,32,0,0,0,136,192a16,16,0,0,1,16-16h46.21a31.81,31.81,0,0,0,31.2-24.88,104.43,104.43,0,0,0,2.59-24A103.28,103.28,0,0,0,200.77,53.89Zm13,93.71A15.89,15.89,0,0,1,198.21,160H152a32,32,0,0,0-32,32,16,16,0,0,1-21.31,15.07C62.49,194.3,40,164,40,128a88,88,0,0,1,87.09-88h.9a88.35,88.35,0,0,1,88,87.25A88.86,88.86,0,0,1,213.81,147.6ZM140,76a12,12,0,1,1-12-12A12,12,0,0,1,140,76ZM96,100A12,12,0,1,1,84,88,12,12,0,0,1,96,100Zm0,56a12,12,0,1,1-12-12A12,12,0,0,1,96,156Zm88-56a12,12,0,1,1-12-12A12,12,0,0,1,184,100Z"/></svg>';
  var CHECK_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function svgSpan(markup) {
    var span = el('span');
    span.innerHTML = markup; // static strings above, never user input
    return span;
  }

  var SYSTEM_OPTION = { id: 'system', label: 'System' };

  function themeIds(themes) {
    return (themes || THEME_OPTIONS).map(function (t) { return t.id || t; });
  }

  // Pure: which theme applies. asked = ?theme=, saved = localStorage value.
  // 'system' (or anything unknown) falls through to the system light/dark setting.
  function resolveTheme(opts) {
    opts = opts || {};
    var ids = themeIds(opts.themes);
    if (ids.indexOf(opts.asked) !== -1) return opts.asked;
    if (ids.indexOf(opts.saved) !== -1) return opts.saved;
    var wanted = opts.prefersDark ? 'dark' : 'light';
    return ids.indexOf(wanted) !== -1 ? wanted : ids[0];
  }

  // Pure: which menu entry is selected: ?theme=, else the saved theme, else 'system'.
  function themeChoice(opts) {
    opts = opts || {};
    var ids = themeIds(opts.themes);
    if (ids.indexOf(opts.asked) !== -1) return opts.asked;
    if (ids.indexOf(opts.saved) !== -1) return opts.saved;
    return 'system';
  }

  function ThemeChooser(opts) {
    opts = opts || {};
    var themes = opts.themes || THEME_OPTIONS;
    var entries = opts.system === false ? themes : themes.concat([SYSTEM_OPTION]);
    var key = opts.storageKey || THEME_KEY;
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    function read() { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function write(value) { try { localStorage.setItem(key, value); } catch (e) { /* private mode */ } }

    var choice = themeChoice({
      themes: themes,
      asked: new URLSearchParams(location.search).get('theme'),
      saved: read()
    });
    function apply() {
      document.documentElement.setAttribute('data-theme', resolveTheme({
        themes: themes,
        asked: choice === 'system' ? null : choice,
        prefersDark: !!(mq && mq.matches)
      }));
    }
    apply();
    // While on System, follow the operating system as it changes.
    if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (choice === 'system') apply(); });

    var root = el('div', { className: 'atk-theme-chooser' });
    var button = el('button', {
      className: 'atk-theme-chooser__button',
      type: 'button',
      title: 'Theme',
      'aria-label': 'Choose theme',
      'aria-haspopup': 'menu',
      'aria-expanded': 'false'
    }, svgSpan(PALETTE_SVG));
    var popover = null;

    function close(returnFocus) {
      if (!popover) return;
      popover.remove();
      popover = null;
      button.setAttribute('aria-expanded', 'false');
      if (returnFocus) button.focus();
    }

    function choose(id) {
      choice = id;
      apply();
      write(id);
      close(true);
      if (typeof opts.onChange === 'function') opts.onChange(id);
    }

    function open() {
      var menuItems = [];
      entries.forEach(function (t) {
        // System sits apart from the named themes.
        if (t === SYSTEM_OPTION && themes.length) menuItems.push({ separator: true });
        menuItems.push({
          label: t.label,
          icon: t.id === choice ? svgSpan(CHECK_SVG) : el('span'),
          onClick: function () { choose(t.id); }
        });
      });
      var menu = Menu({ items: menuItems });
      var items = Array.prototype.slice.call(menu.querySelectorAll('.atk-menu__item'));
      items.forEach(function (item, i) {
        item.setAttribute('role', 'menuitemradio');
        item.setAttribute('aria-checked', String(entries[i].id === choice));
      });
      menu.addEventListener('keydown', function (e) {
        var i = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      });
      popover = el('div', { className: 'atk-theme-chooser__popover' }, menu);
      root.appendChild(popover);
      button.setAttribute('aria-expanded', 'true');
      var selected = items[entries.map(function (t) { return t.id; }).indexOf(choice)];
      (selected || items[0]).focus();
    }

    button.addEventListener('click', function () { if (popover) close(); else open(); });
    document.addEventListener('click', function (e) { if (popover && !root.contains(e.target)) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && popover) close(true); });

    root.appendChild(button);
    return root;
  }
  ThemeChooser.resolve = resolveTheme;
  ThemeChooser.choice = themeChoice;

  /* ── ChannelRow / ChannelList ──────────────────────────────────
     A channel as a coloured bar: badge, name, block count, metadata count,
     owner, caret. Opens (a <details>) to show whatever you pass as children.
     ChannelList stacks rows and adds an optional sort menu; sorting itself
     is yours: re-order with list.setRows(). */

  var CHEVRON_SVG =
    '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>';

  function ChannelRow(opts) {
    opts = opts || {};
    var visibility = opts.visibility || 'closed';
    var badgeVariant = { public: 'success', private: 'private' }[visibility] || 'default';
    var caret = svgSpan(CHEVRON_SVG);
    caret.className = 'atk-channel-row__caret';
    var summary = el('summary', null, [
      Badge({ variant: badgeVariant, children: visibility }),
      el('span', { className: 'atk-channel-row__title' }, opts.title),
      opts.count != null
        ? el('span', { className: 'atk-channel-row__count', title: 'Blocks in this channel' }, String(opts.count))
        : null,
      opts.metadataCount != null
        ? el('span', { title: 'Metadata entries' }, Badge({ children: String(opts.metadataCount) }))
        : null,
      opts.owner ? el('span', { className: 'atk-channel-row__owner' }, opts.owner) : null,
      caret
    ]);
    return el('details', {
      className: 'atk-channel-row',
      'data-visibility': visibility,
      open: opts.open ? true : null
    }, [summary, el('div', { className: 'atk-channel-row__body' }, opts.children)]);
  }

  var channelListCount = 0;

  function ChannelList(opts) {
    opts = opts || {};
    var root = el('div', { className: 'atk-channel-list' });
    var rowsEl = el('div', { className: 'atk-channel-list__rows' });
    var toolbar = null;
    if (opts.sorts && opts.sorts.length) {
      var select = Select({
        options: opts.sorts,
        value: opts.sortValue || opts.sorts[0].value,
        onChange: function (e) { if (opts.onSort) opts.onSort(e.target.value); }
      });
      select.id = 'atk-channel-sort-' + (++channelListCount);
      toolbar = el('div', { className: 'atk-channel-list__toolbar', hidden: true }, [
        el('label', { for: select.id }, opts.sortLabel || 'Sort'),
        select
      ]);
      root.appendChild(toolbar);
    }
    root.appendChild(rowsEl);

    // Replace the list's contents. Rows you pass again are moved, not rebuilt, so open rows stay open.
    // The sort menu shows once there are two or more. A single node (a message) works too.
    root.setRows = function (nodes) {
      rowsEl.replaceChildren.apply(rowsEl, nodes);
      if (toolbar) toolbar.hidden = nodes.length < 2;
    };
    root.setRows(opts.rows || []);
    return root;
  }

  window.ArenaToolkit = {
    ChannelRow: ChannelRow,
    ChannelList: ChannelList,
    ThemeChooser: ThemeChooser,
    Button: Button,
    Input: Input,
    Link: Link,
    Card: Card,
    Badge: Badge,
    Block: Block,
    Modal: Modal,
    Menu: Menu,
    KeyChip: KeyChip,
    Select: Select,
    Textarea: Textarea,
    Tabs: Tabs,
    Stepper: Stepper,
    _el: el
  };
}());

</script>
<script>
// are.na v3 client. Endpoints checked against https://api.are.na/v3/openapi.json.
// Writes (updateBlock, createConnection, deleteConnection) need a token with write scope.
const ARENA_API_BASE = 'https://api.are.na/v3';

class ArenaError extends Error {
  constructor(status, message, body) {
    super(message);
    this.name = 'ArenaError';
    this.status = status;
    this.body = body;
  }
}

// throttle: the function from createThrottle(); omit in tests to call fetch directly.
function createArenaClient({ token = null, fetchImpl = (...a) => globalThis.fetch(...a), throttle = null, base = ARENA_API_BASE } = {}) {
  let currentToken = token;

  // params go in the query string; opts.body (if any) is sent as JSON.
  async function request(path, params = {}, { method = 'GET', body = null } = {}) {
    const url = new URL(base + path);
    for (const [k, v] of Object.entries(params)) {
      if (v != null) url.searchParams.set(k, String(v));
    }
    const doFetch = () => fetchImpl(url.toString(), {
      method,
      headers: {
        Accept: 'application/json',
        ...(body ? { 'Content-Type': 'application/json' } : {}),
        ...(currentToken ? { Authorization: `Bearer ${currentToken}` } : {}),
      },
      ...(body ? { body: JSON.stringify(body) } : {}),
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
    });
    const res = throttle ? await throttle(doFetch) : await doFetch();

    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = null; }

    if (!res.ok) {
      const msg = data?.details?.message || data?.error || `are.na error ${res.status}`;
      throw new ArenaError(res.status, msg, data);
    }
    return data;
  }

  // Follows meta.has_more_pages and returns every item in `data`. onPage(items, meta) fires per page.
  async function paginate(path, params = {}, { per = 100, onPage = null } = {}) {
    const all = [];
    for (let page = 1; ; page++) {
      const body = await request(path, { ...params, page, per });
      const items = body?.data || [];
      all.push(...items);
      if (onPage) onPage(items, body?.meta);
      if (!body?.meta?.has_more_pages) return all;
    }
  }

  return {
    setToken(t) { currentToken = t || null; },
    request,
    paginate,
    getCurrentUser: () => request('/me'),
    getBlock: id => request(`/blocks/${encodeURIComponent(id)}`),
    getBlockConnections: (id, opts = {}) => paginate(`/blocks/${encodeURIComponent(id)}/connections`, {}, opts),
    getChannel: idOrSlug => request(`/channels/${encodeURIComponent(idOrSlug)}`),
    // Every block/channel in a channel. Each item carries `connection.id`, which deleteConnection needs.
    // params: { type } filters to Text, Image, Link, Attachment, Embed, Channel or Block.
    getChannelContents: (idOrSlug, params = {}, opts = {}) => paginate(`/channels/${encodeURIComponent(idOrSlug)}/contents`, params, opts),

    // A user's own contents (as arena-merge does it). params: { type: 'Channel' } for just their channels.
    getUserContents: (userId, params = {}, opts = {}) => paginate(`/users/${encodeURIComponent(userId)}/contents`, params, opts),

    // fields: any of title, description, alt_text (Image blocks), metadata (merged; null deletes a key).
    // Owner only.
    updateBlock: (id, fields) => request(`/blocks/${encodeURIComponent(id)}`, {}, { method: 'PUT', body: fields }),
    // Connects a block (or channel) into one or more channels. Resolves to the created Connection[].
    // channels: ids or slugs, or { id, position?, metadata? } objects.
    createConnection: async ({ id, type = 'Block', channels }) => {
      const res = await request('/connections', {}, {
        method: 'POST',
        body: {
          connectable_id: id,
          connectable_type: type,
          channels: channels.map(c => (typeof c === 'object' ? c : { id: c })),
        },
      });
      return res?.data || [];
    },
    // Takes the *connection* id (from a channel's contents, or createConnection), not a block id.
    // Removes the block from that channel only; the block itself stays. Resolves to null (204).
    deleteConnection: connectionId => request(`/connections/${encodeURIComponent(connectionId)}`, {}, { method: 'DELETE' }),
  };
}

<script>
// Polite pacing for are.na: 150 ms between requests, and on 429 back off [2, 4, 8] s,
// honouring Retry-After. Wraps a function that returns a fetch Response.
const THROTTLE_GAP_MS = 150;
const THROTTLE_BACKOFF_S = [2, 4, 8];

// onWait(seconds, attempt) is called before each backoff sleep, so the UI can say so.
function createThrottle({
  gap = THROTTLE_GAP_MS,
  backoff = THROTTLE_BACKOFF_S,
  sleep = ms => new Promise(r => setTimeout(r, ms)),
  now = () => Date.now(),
  onWait = null,
} = {}) {
  let nextSlot = 0;

  // Reserve the next start time synchronously, so concurrent callers queue up in order.
  async function takeSlot() {
    const start = Math.max(now(), nextSlot);
    nextSlot = start + gap;
    const wait = start - now();
    if (wait > 0) await sleep(wait);
  }

  return async function throttled(doFetch) {
    for (let attempt = 0; ; attempt++) {
      await takeSlot();
      const res = await doFetch();
      if (res.status !== 429 || attempt >= backoff.length) return res;
      const retryAfter = Number(res.headers?.get?.('retry-after'));
      const seconds = retryAfter > 0 ? retryAfter : backoff[attempt];
      if (onWait) onWait(seconds, attempt + 1);
      await sleep(seconds * 1000);
    }
  };
}

<script>
// PAT connect widget: paste a token, test it against /me, remember it in localStorage.
// Built only from ArenaToolkit components. Options for tools that change things:
//  - requireWrite: the token is checked for write scope before it is accepted or saved.
//  - writeMessage: a line shown above the form, e.g. "Editing needs a token with write access."
//  - For a page that is read-only until asked: leave requireWrite off, call ensureWrite() (true / false /
//    null for not connected), and if it is not true call setRequireWrite(true, message) and open the form.
//  - panel: arena-merge's Connect layout: a labelled field, a "Remember on this computer"
//    checkbox (unticked, the token lives in sessionStorage and goes with the tab), and an
//    account chip once connected. loadDetail(user) can fetch the chip's second line.
const AUTH_STORAGE_KEY = 'arena_toolkit_pat';
const AUTH_TOKEN_URL = 'https://www.are.na/settings/personal-access-tokens';

function readSavedToken(storage, key = AUTH_STORAGE_KEY) {
  try { return storage.getItem(key) || null; } catch { return null; }
}

function saveToken(storage, token, key = AUTH_STORAGE_KEY) {
  try { storage.setItem(key, token); } catch { /* private window or blocked storage: carry on unsaved */ }
}

function clearToken(storage, key = AUTH_STORAGE_KEY) {
  try { storage.removeItem(key); } catch { /* nothing to clear */ }
}

// Two letters for the account chip's avatar: "Kim Plowright" -> "KP", "kim-plowright" -> "K".
function initialsFor(user) {
  const name = String(user?.full_name || user?.slug || '?').trim();
  return name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
}

function describeConnectError(err) {
  if (err?.status === 401) return "are.na didn't recognise that token. Check it was copied whole.";
  if (err?.status === 429) return 'are.na is asking us to slow down. Try again in a minute.';
  if (err?.status) return `are.na said: ${err.message}`;
  return "Couldn't reach are.na. Check your connection and try again.";
}

// DELETE /connections/0 never matches anything: 403 means a read-only token, 404 means write is allowed.
// (The trick arena-merge and to-arena use; nothing is changed either way.)
async function checkWriteAccess(client) {
  try {
    await client.deleteConnection(0);
    return true;
  } catch (err) {
    if (err?.status === 403) return false;
    if (err?.status === 404) return true;
    throw err;
  }
}

// Remembers whether the connected token can write, so a page can ask "can I edit?" without a request each time.
// Call reset() when the token changes; mark(true) when a connect has already proved write access.
function createWriteGate(client) {
  let answer = null;
  return {
    mark(value) { answer = value; },
    reset() { answer = null; },
    // true / false from the cache or one probe. A failed probe (401, offline) throws and caches nothing.
    async check() {
      if (answer === null) answer = await checkWriteAccess(client);
      return answer;
    },
  };
}

function statusRow(label, message) {
  const row = document.createElement('div');
  Object.assign(row.style, { display: 'flex', flexWrap: 'wrap', gap: 'var(--space-2)', alignItems: 'center' });
  row.append(window.ArenaToolkit.Badge({ variant: 'alert', children: label }), message);
  return row;
}

function node(tag, text, style) {
  const n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (style) Object.assign(n.style, style);
  return n;
}

// client: from createArenaClient(). onChange(user | null) fires on connect and disconnect.
function createAuthStep({
  client,
  storage = globalThis.localStorage,
  session = globalThis.sessionStorage,
  storageKey = AUTH_STORAGE_KEY,
  onChange = null,
  requireWrite: initialRequireWrite = false,
  writeMessage: initialWriteMessage = null,
  panel = false,
  loadDetail = null,
} = {}) {
  const ATK = window.ArenaToolkit;
  let requireWrite = initialRequireWrite;
  let writeMessage = initialWriteMessage;
  const writeGate = createWriteGate(client);
  let user = null;
  let detail = null;
  let remember = true;

  const element = node('div', null, { display: 'flex', flexDirection: 'column', gap: 'var(--space-2)' });

  function rememberCheck() {
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = remember;
    box.addEventListener('change', () => { remember = box.checked; });
    const text = node('span');
    text.append('Remember on this computer', node('br'), node('span', 'Unticked, it is forgotten when you close the tab.', {
      color: 'var(--text-muted)', font: 'var(--text-body-sm)',
    }));
    const label = node('label', null, { display: 'flex', gap: 'var(--space-2)', alignItems: 'flex-start', cursor: 'pointer' });
    label.append(box, text);
    return label;
  }

  function accountChip() {
    const avatar = node('div', initialsFor(user), {
      width: '32px', height: '32px', borderRadius: '50%', flexShrink: '0',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'var(--accent-primary)', color: 'var(--surface-page)', font: 'var(--text-ui-strong)',
    });
    const who = node('div', null, { flex: '1', minWidth: '0', color: 'var(--text-secondary)' });
    const name = node('strong', user.full_name || user.slug, { color: 'var(--text-primary)' });
    who.append('Signed in as ', name);
    if (detail) who.append(node('br'), node('span', detail, { color: 'var(--text-muted)', font: 'var(--text-body-sm)' }));
    const chip = node('div', null, {
      display: 'flex', alignItems: 'center', gap: 'var(--space-3)', padding: 'var(--space-3)',
      background: 'var(--surface-sunken)', borderRadius: 'var(--radius-sm)',
    });
    chip.append(avatar, who, ATK.Button({ variant: 'ghost', size: 'sm', children: 'Disconnect', onClick: disconnect }));
    return chip;
  }

  function render(statusNode) {
    element.replaceChildren();
    if (user && panel) {
      element.append(accountChip());
      return;
    }
    if (user) {
      const row = node('div', null, { display: 'flex', alignItems: 'center', gap: 'var(--space-2)' });
      row.append(
        ATK.Badge({ variant: 'success', children: `Connected as @${user.slug}` }),
        ATK.Button({ variant: 'ghost', size: 'sm', children: 'Disconnect', onClick: disconnect }),
      );
      element.append(row);
      return;
    }

    if (writeMessage) element.append(node('p', writeMessage, { margin: 0, font: 'var(--text-ui-strong)' }));

    const intro = node('p', null, { margin: 0 });
    intro.append(
      panel ? 'Create a ' : 'Paste a ',
      ATK.Link({ href: AUTH_TOKEN_URL, children: 'personal access token' }),
    );
    if (requireWrite) {
      intro.append(panel
        ? ' with read and write ticked, then paste it below. The token stays in your browser only.'
        : ' with the write scope ticked. This tool changes your account: it adds and removes connections and edits blocks, so a read-only token will not work.');
    } else {
      intro.append(' with read access. That is all this tool needs. Some content, including private channels, only shows up once you are connected.');
    }
    intro.querySelector('a').target = '_blank';
    intro.querySelector('a').rel = 'noopener';

    const input = ATK.Input({ type: 'password', placeholder: panel ? 'paste it here' : 'Paste your token here' });
    input.id = 'arena-token';
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.style.flex = '1';
    const submit = () => connect(input.value);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

    const row = node('div', null, { display: 'flex', gap: 'var(--space-2)' });
    row.append(input, ATK.Button({ variant: panel ? 'secondary' : 'primary', children: 'Connect', onClick: submit }));

    const note = node('p', 'Your token stays in this browser and is only ever sent to are.na.', {
      margin: 0, color: 'var(--text-muted)', font: 'var(--text-body-sm)',
    });

    if (panel) {
      const label = node('label', 'Personal access token', { font: 'var(--text-ui-strong)', color: 'var(--text-muted)' });
      label.htmlFor = 'arena-token';
      element.append(intro, label, row, rememberCheck());
      if (statusNode) element.append(statusNode);
      return;
    }

    element.append(intro, row, note);
    if (statusNode) element.append(statusNode);
  }

  async function connect(rawToken) {
    const token = String(rawToken || '').trim();
    if (!token) {
      render(statusRow('No token', 'Paste a token first.'));
      return null;
    }
    render(ATK.Badge({ children: 'Checking…' }));
    client.setToken(token);
    writeGate.reset();
    try {
      user = await client.getCurrentUser();
    } catch (err) {
      client.setToken(null);
      render(statusRow('Couldn\'t connect', describeConnectError(err)));
      return null;
    }
    if (requireWrite) {
      let writable = false;
      try {
        writable = await checkWriteAccess(client);
      } catch (err) {
        client.setToken(null);
        user = null;
        render(statusRow('Couldn\'t connect', describeConnectError(err)));
        return null;
      }
      if (!writable) {
        client.setToken(null);
        user = null;
        render(statusRow('Read-only token', 'This token can\'t write. Create a new one with the write scope ticked.'));
        return null;
      }
      writeGate.mark(true);
    }
    // Remembered tokens go to localStorage; otherwise sessionStorage, which goes with the tab.
    clearToken(storage, storageKey);
    clearToken(session, storageKey);
    saveToken(remember ? storage : session, token, storageKey);
    detail = null;
    if (loadDetail) {
      render(node('p', 'Loading your channels…', { margin: 0, color: 'var(--text-muted)' }));
      try { detail = await loadDetail(user); } catch { detail = null; }
    }
    render();
    if (onChange) onChange(user);
    return user;
  }

  // Re-connect with a saved token, if there is one. Returns the user or null.
  async function restore() {
    const inLocal = readSavedToken(storage, storageKey);
    const saved = inLocal || readSavedToken(session, storageKey);
    if (!saved) { render(); return null; }
    remember = !!inLocal;
    const result = await connect(saved);
    if (!result) { clearToken(storage, storageKey); clearToken(session, storageKey); }
    return result;
  }

  // Can the connected token write? true / false, or null when nobody is connected.
  // Checked once per token (the DELETE /connections/0 probe); throws on 401 or a network error.
  async function ensureWrite() {
    if (!user) return null;
    return writeGate.check();
  }

  // Switch to write mode, for a page that is read-only until the person asks to edit.
  // message appears above the form. A connected token is dropped so the form can take a write token.
  // setRequireWrite(false) puts the widget back to its read-only wording.
  function setRequireWrite(enabled = true, message = null) {
    requireWrite = !!enabled;
    writeMessage = enabled ? message : null;
    if (enabled && user) disconnect();
    else render();
  }

  function disconnect() {
    user = null;
    detail = null;
    writeGate.reset();
    client.setToken(null);
    clearToken(storage, storageKey);
    clearToken(session, storageKey);
    render();
    if (onChange) onChange(null);
  }

  render();
  return { element, connect, restore, disconnect, ensureWrite, setRequireWrite, getUser: () => user };
}

</script>

// Turns what the user pasted into a block id, or null if it isn't one.
// Accepts a bare id or an are.na block URL (with or without scheme, www, trailing slash, query or anchor).
function parseBlockInput(raw) {
  if (raw == null) return null;
  const s = String(raw).trim();
  if (!s) return null;
  if (/^\d+$/.test(s)) return toId(s);
  try {
    const url = new URL(/^https?:\/\//i.test(s) ? s : `https://${s}`);
    if (!/^(www\.)?are\.na$/i.test(url.hostname)) return null;
    const m = url.pathname.match(/^\/block\/(\d+)\/?$/);
    if (m) return toId(m[1]);
  } catch { /* not a URL */ }
  return null;
}

function toId(digits) {
  const n = parseInt(digits, 10);
  return Number.isSafeInteger(n) && n > 0 ? n : null;
}

<script>
// Small pure helpers for turning API values into display values.

// "2024-03-15T10:30:00Z" -> "2024-03-15"; anything else -> ""
function formatDate(iso) {
  const m = /^(\d{4}-\d{2}-\d{2})/.exec(String(iso || ''));
  return m ? m[1] : '';
}

// Metadata object (or null) -> [[key, display string], …] in the API's order.
function metadataEntries(metadata) {
  if (!metadata || typeof metadata !== 'object') return [];
  return Object.entries(metadata).map(([k, v]) => [k, String(v)]);
}

// A value that is exactly one web address -> that address; anything else (other schemes, extra text) -> null.
function webUrl(text) {
  const t = String(text ?? '').trim();
  if (!t || /\s/.test(t)) return null;
  try {
    const u = new URL(t);
    return u.protocol === 'http:' || u.protocol === 'https:' ? u.href : null;
  } catch {
    return null;
  }
}

// Embedded user -> "@slug", or "(unknown)" when the API gave us nothing.
function userHandle(user) {
  return user?.slug ? `@${user.slug}` : '(unknown)';
}

function userUrl(user) {
  return user?.slug ? `https://www.are.na/${encodeURIComponent(user.slug)}` : null;
}

function blockUrl(id) {
  return `https://www.are.na/block/${id}`;
}

// Channel owners can be users or groups. Groups have no profile page we can link to safely.
function ownerLabel(owner) {
  if (!owner) return '(unknown)';
  return owner.type === 'Group' ? `${owner.name || owner.slug} (group)` : userHandle(owner);
}

function ownerUrl(owner) {
  return owner?.type === 'Group' ? null : userUrl(owner);
}

function channelUrl(channel) {
  if (!channel?.slug) return null;
  const owner = channel.owner;
  return owner?.type !== 'Group' && owner?.slug
    ? `https://www.are.na/${encodeURIComponent(owner.slug)}/${encodeURIComponent(channel.slug)}`
    : `https://www.are.na/channel/${encodeURIComponent(channel.slug)}`;
}

// Compact count for a row: 169 -> "169", 1234 -> "1.2k", 10400 -> "10k", 2500000 -> "2.5m".
function formatCount(n) {
  if (typeof n !== 'number' || !Number.isFinite(n) || n < 0) return '';
  const trim = (x) => String(Math.round(x * 10) / 10);
  if (n < 1000) return String(Math.round(n));
  if (n < 10000) return `${trim(n / 1000)}k`;
  if (n < 1000000) return `${Math.round(n / 1000)}k`;
  return `${trim(n / 1000000)}m`;
}

// Order for the connected-channels list. "recent"/"oldest" use the channel's created date.
// Anything else (including "default") keeps are.na's own order. Ties keep their original order.
const CHANNEL_SORTS = [
  { value: 'default', label: 'Default order' },
  { value: 'recent', label: 'Most recent first' },
  { value: 'oldest', label: 'Oldest first' },
  { value: 'blocks', label: 'Most blocks' },
  { value: 'metadata', label: 'Most metadata' },
];

function sortChannels(channels, mode) {
  const time = (ch) => { const t = Date.parse(ch.created_at); return Number.isNaN(t) ? null : t; };
  const blocks = (ch) => ch.counts?.contents ?? ch.counts?.blocks ?? 0;
  const meta = (ch) => metadataEntries(ch.metadata).length;
  const byDate = (dir) => (a, b) => {
    const x = time(a), y = time(b);
    if (x === null && y === null) return 0;
    if (x === null) return 1; // undated channels go last either way
    if (y === null) return -1;
    return dir * (x - y);
  };
  const compare = {
    recent: byDate(-1),
    oldest: byDate(1),
    blocks: (a, b) => blocks(b) - blocks(a),
    metadata: (a, b) => meta(b) - meta(a),
  }[mode];
  return compare ? [...channels].sort(compare) : [...channels];
}

// Lookup history: most recent first, deduped by id, capped.
const HISTORY_CAP = 10;

function updateHistory(list, entry, cap = HISTORY_CAP) {
  const rest = (Array.isArray(list) ? list : []).filter((e) => e && e.id !== entry.id);
  return [entry, ...rest].slice(0, cap);
}

// Whatever came out of storage: keep only entries with a numeric id.
function cleanHistory(raw) {
  return (Array.isArray(raw) ? raw : [])
    .filter((e) => e && Number.isInteger(e.id))
    .slice(0, HISTORY_CAP);
}

function readJson(storage, key, fallback) {
  try {
    const text = storage.getItem(key);
    return text == null ? fallback : JSON.parse(text);
  } catch { return fallback; }
}

function writeJson(storage, key, value) {
  try { storage.setItem(key, JSON.stringify(value)); } catch { /* storage blocked: carry on unsaved */ }
