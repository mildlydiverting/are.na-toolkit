<script>
// Pure logic for the block metadata editor: types, validation, diffs and the tag list format.
// No DOM. Plan: _claude/arena-palimpsest-v2-editing-and-tagging-plan.md (§4.2, §4.3, §5, §6).

const META_KEY_PATTERN = /^[A-Za-z0-9_]{1,40}$/;
const META_MAX_KEYS = 50;
const META_MAX_BYTES = 32 * 1024;
const META_MAX_VALUE_CHARS = 2000;

// Finite, and if it is a whole number, inside JavaScript's safe range.
const isSafeNumeric = (v) => Number.isFinite(v) && (!Number.isInteger(v) || Number.isSafeInteger(v));

// A JSON array string such as '["a","b"]' (goby.garden's multi-select encoding), or null.
function jsonArrayItems(text) {
  const t = String(text).trim();
  if (!t.startsWith('[') || !t.endsWith(']')) return null;
  try {
    const arr = JSON.parse(t);
    return Array.isArray(arr) && arr.every((x) => typeof x === 'string' || typeof x === 'number')
      ? arr.map(String)
      : null;
  } catch {
    return null;
  }
}

// A string made only of "- item" lines (blank lines ignored), or a JSON array string.
function looksLikeList(text) {
  if (typeof text !== 'string') return false;
  if (jsonArrayItems(text)) return true;
  const lines = text.split(/\r?\n/).filter((l) => l.trim() !== '');
  return lines.length > 0 && lines.every((l) => /^\s*-(\s|$)/.test(l));
}

// 'text' | 'number' | 'checkbox' | 'list'. Numbers outside the safe range are Text, so they are never re-sent as numbers.
function detectType(value) {
  if (typeof value === 'boolean') return 'checkbox';
  if (typeof value === 'number') return isSafeNumeric(value) ? 'number' : 'text';
  if (typeof value === 'string' && looksLikeList(value)) return 'list';
  return 'text';
}

// null when fine, otherwise a plain-language message.
function validateKey(key, existingKeys = []) {
  const k = String(key ?? '');
  if (!k) return 'Give the property a name.';
  if (!META_KEY_PATTERN.test(k)) {
    return k.length > 40
      ? 'Names can be at most 40 characters.'
      : 'Names can only use letters, numbers and underscores.';
  }
  if (new Set(existingKeys).has(k)) return `There is already a property called ${k}.`;
  return null;
}

// ---- Tags: a YAML bullet list inside one string (plan §6) ----

function unquoteTag(s) {
  const m = /^"(.*)"$/.exec(s);
  if (m) return m[1].replace(/\\(["\\])/g, '$1');
  const q = /^'(.*)'$/.exec(s);
  return q ? q[1].replace(/''/g, "'") : s;
}

const cleanTag = (t) => String(t).trim().replace(/ {2,}/g, ' ');

// Text (bullet list, or JSON array string) -> array of tags.
function parseList(text) {
  if (text == null) return [];
  const fromJson = jsonArrayItems(text);
  const raw = fromJson
    ? fromJson
    : String(text)
        .split(/\r?\n/)
        .filter((l) => l.trim() !== '')
        .map((l) => unquoteTag(l.replace(/^\s*-\s?/, '').trim()));
  return dedupe(raw.map(cleanTag).filter(Boolean));
}

function dedupe(items) {
  const seen = new Set();
  return items.filter((t) => {
    const k = t.toLowerCase();
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

const NEEDS_QUOTES = /(:|\s#|")|^[-[{&*!|>'%@`#]/;

// Array of tags -> "- a\n- b". Trims, collapses spaces, drops empties and case-insensitive duplicates.
function serialiseList(items) {
  return dedupe((items || []).map(cleanTag).filter(Boolean))
    .map((t) => `- ${NEEDS_QUOTES.test(t) ? `"${t.replace(/(["\\])/g, '\\$1')}"` : t}`)
    .join('\n');
}

// ---- Values and type changes ----

// raw: what the person typed or chose (string, boolean, number, or for lists an array or text).
// -> { ok: true, value } or { ok: false, message }
function validateValue(type, raw) {
  if (type === 'checkbox') {
    if (typeof raw === 'boolean') return { ok: true, value: raw };
    const s = String(raw).trim().toLowerCase();
    if (s === 'true' || s === 'false') return { ok: true, value: s === 'true' };
    return { ok: false, message: 'Choose on or off.' };
  }
  if (type === 'number') {
    const s = String(raw ?? '').trim();
    if (s === '') return { ok: false, message: 'Enter a number.' };
    const n = Number(s);
    if (!Number.isFinite(n)) return { ok: false, message: 'Not a number. Change the value first.' };
    if (Number.isInteger(n) && !Number.isSafeInteger(n)) {
      return { ok: false, message: 'Too large to store as a number safely. Keep it as Text.' };
    }
    return { ok: true, value: n };
  }
  if (type === 'list') {
    const text = Array.isArray(raw) ? serialiseList(raw) : serialiseList(parseList(raw));
    if (text.length > META_MAX_VALUE_CHARS) {
      return { ok: false, message: `Too many tags for one are.na value (limit ${META_MAX_VALUE_CHARS} characters). Currently ${text.length}.` };
    }
    return { ok: true, value: text };
  }
  const s = String(raw ?? '');
  if (s.length > META_MAX_VALUE_CHARS) {
    return { ok: false, message: `Text can be at most ${META_MAX_VALUE_CHARS} characters. Currently ${s.length}.` };
  }
  return { ok: true, value: s };
}

// Change a value from one type to another.
// -> { ok: true, value, lossy } (lossy: show the "your data will be adapted" warning) or { ok: false, message }
function coerce(fromType, toType, value) {
  if (fromType === toType) return { ok: true, value, lossy: false };

  // Everything else goes through its text form.
  const asText = fromType === 'list' ? value : String(value ?? '');

  if (toType === 'text') return { ok: true, value: asText, lossy: false };

  if (toType === 'list') {
    const items = fromType === 'list' ? parseList(value) : asText.split(/[,\n]/).map(cleanTag).filter(Boolean);
    const out = validateValue('list', items);
    if (!out.ok) return out;
    return { ok: true, value: out.value, lossy: out.value !== asText };
  }

  // A list can become a number or checkbox only when it has exactly one item.
  let single = asText;
  if (fromType === 'list') {
    const items = parseList(value);
    if (items.length !== 1) return { ok: false, message: 'A list with several items cannot become a single value. Remove items first.' };
    single = items[0];
  }

  if (toType === 'number') {
    if (fromType === 'checkbox') return { ok: true, value: value ? 1 : 0, lossy: true };
    const out = validateValue('number', single);
    return out.ok ? { ok: true, value: out.value, lossy: fromType === 'list' } : out;
  }

  if (toType === 'checkbox') {
    if (fromType === 'number') return { ok: true, value: value !== 0, lossy: true };
    const s = single.trim().toLowerCase();
    if (s === 'true' || s === 'false') return { ok: true, value: s === 'true', lossy: fromType === 'list' };
    return { ok: false, message: 'Not true or false. Change the value first.' };
  }

  return { ok: false, message: 'Unknown type.' };
}

// ---- Comparing ----

const has = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
const same = (a, b) => Object.is(a, b);

// The metadata to send: added or changed keys as they are in `edited`, removed keys as null.
// Unchanged keys are left out, so values we never touched keep their original type. {} when nothing differs.
function buildPatch(original, edited) {
  const orig = original || {};
  const next = edited || {};
  const patch = {};
  for (const key of Object.keys(next)) {
    if (!has(orig, key) || !same(orig[key], next[key])) patch[key] = next[key];
  }
  for (const key of Object.keys(orig)) {
    if (!has(next, key)) patch[key] = null;
  }
  return patch;
}

// For the review panel: { added: [{key, value, type}], changed: [{key, from, to, fromType, toType}], removed: [{key, value, type}] }
function diffMetadata(original, edited) {
  const orig = original || {};
  const next = edited || {};
  const out = { added: [], changed: [], removed: [] };
  for (const key of Object.keys(next)) {
    if (!has(orig, key)) {
      out.added.push({ key, value: next[key], type: detectType(next[key]) });
    } else if (!same(orig[key], next[key])) {
      out.changed.push({
        key, from: orig[key], to: next[key],
        fromType: detectType(orig[key]), toType: detectType(next[key]),
      });
    }
  }
  for (const key of Object.keys(orig)) {
    if (!has(next, key)) out.removed.push({ key, value: orig[key], type: detectType(orig[key]) });
  }
  return out;
}

// Whole-block limits: 50 keys, 32KB. -> { ok, keyCount, bytes, problems: string[] }
function checkLimits(metadata) {
  const meta = metadata || {};
  const keyCount = Object.keys(meta).length;
  const bytes = new TextEncoder().encode(JSON.stringify(meta)).length;
  const problems = [];
  if (keyCount > META_MAX_KEYS) problems.push(`A block can have at most ${META_MAX_KEYS} properties. This one has ${keyCount}.`);
  if (bytes > META_MAX_BYTES) problems.push(`Metadata can be at most 32KB in total. This is ${(bytes / 1024).toFixed(1)}KB.`);
  return { ok: problems.length === 0, keyCount, bytes, problems };
}

</script>
<script>
// Metadata editor for one block: Edit toggle, property rows, Review, Save. DOM only;
// the rules (types, validation, patch, diff) live in metadata-edit.js.
// Plan: _claude/arena-palimpsest-v2-editing-and-tagging-plan.md §4.

let metaRowSeq = 0;

const META_TYPES = [
  { value: 'text', label: 'Text', icon: 'Aa' },
  { value: 'number', label: 'Number', icon: '#' },
  { value: 'checkbox', label: 'Checkbox', icon: '☑' },
  { value: 'list', label: 'List', icon: '≡' },
];
const metaTypeInfo = (type) => META_TYPES.find((t) => t.value === type) || META_TYPES[0];

// Keys other tools write. `lock` asks for a second click before editing or removing.
const META_TOOL_KEYS = [
  { prefix: 'dupe_', by: 'arena-duplicate-finder', lock: true },
  { prefix: 'goby__', by: 'goby.garden', lock: false },
];
const metaToolFor = (key) => META_TOOL_KEYS.find((t) => key.startsWith(t.prefix)) || null;

function metaRawFor(type, value) {
  if (type === 'list') return parseList(value);
  if (type === 'checkbox') return !!value;
  return value == null ? '' : String(value);
}

// How a value reads in the review panel and in warnings.
function metaShow(value) {
  if (value === null || value === undefined || value === '') return '(empty)';
  if (typeof value === 'string' && detectType(value) === 'list') return parseList(value).join(', ');
  return String(value);
}

function metaSaveError(err) {
  if (err?.status === 401) return "are.na didn't accept the token. Connect again, then save.";
  if (err?.status === 403) return "This token can't edit this block. It needs write access, and the block must be yours.";
  if (err?.status === 404) return 'are.na could not find this block any more.';
  if (err?.status === 422) return `are.na rejected the changes: ${err.message}`;
  if (err?.status === 429) return 'are.na is asking us to slow down. Nothing was lost; try Save again in a minute.';
  return describeConnectError(err);
}

// block: the block from are.na. renderView(metadata) -> node for the read-only list.
// requestWrite() -> Promise<{ ok, message? }> (opens Connect when the token cannot write).
// onSaved(block) is told about the saved block.
function createMetadataEditor({ block, client, renderView, requestWrite, onSaved }) {
  const ATK = window.ArenaToolkit;
  const h = (tag, attrs, kids) => ATK._el(tag, attrs, kids);

  let current = block;
  let mode = 'view'; // 'view' | 'edit' | 'review'
  let original = {};
  let rows = [];
  let patch = {};
  let stale = [];
  let notice = '';
  let saveError = '';
  let busy = '';
  let menu = null; // { row, node }
  let focusAfter = null;

  const root = h('div', { className: 'metadata' });
  const live = h('p', { className: 'visually-hidden', role: 'status', 'aria-live': 'polite' });

  /* ── Rows ──────────────────────────────────────────────────── */
  function makeRow(key, value, isNew) {
    const type = isNew ? 'text' : detectType(value);
    const tool = isNew ? null : metaToolFor(key);
    return {
      id: ++metaRowSeq, key, isNew, original: value, type, touched: false,
      unlocked: !(tool && tool.lock), raw: metaRawFor(type, value),
      notice: '', keyError: '', valueError: '',
    };
  }

  // A blank new row is ignored until the person types something.
  const isLive = (row) => !(row.isNew && !row.key && !row.touched);

  function evaluate(row) {
    if (!row.isNew && !row.touched) return { ok: true, value: row.original };
    return validateValue(row.type, row.raw);
  }

  // Sets each row's error text and returns the edited metadata plus any whole-block problems.
  function analyse() {
    const liveRows = rows.filter(isLive);
    const meta = {};
    for (const row of liveRows) {
      const others = liveRows.filter((r) => r !== row).map((r) => r.key).filter(Boolean);
      row.keyError = row.isNew ? validateKey(row.key, others) || '' : '';
      const out = evaluate(row);
      row.valueError = out.ok ? row.notice : out.message;
      if (!row.keyError && out.ok) meta[row.key] = out.value;
    }
    const limits = checkLimits(meta);
    const hasRowError = liveRows.some((r) => r.keyError || r.valueError);
    const changes = buildPatch(original, meta);
    return { meta, limits, hasRowError, changeCount: Object.keys(changes).length };
  }

  const isDirty = () => {
    if (mode === 'view') return false;
    const a = analyse();
    return a.changeCount > 0 || rows.some((r) => r.touched || (r.isNew && r.key));
  };

  /* ── Updating without rebuilding (keeps focus while typing) ── */
  function refresh() {
    const a = analyse();
    for (const row of rows) {
      if (row.keyErrEl) row.keyErrEl.textContent = row.keyError;
      if (row.valErrEl) row.valErrEl.textContent = row.valueError;
    }
    const first = a.limits.problems[0] || '';
    if (limitsEl) limitsEl.textContent = first;
    if (reviewBtn) reviewBtn.disabled = !(a.changeCount > 0 && !a.hasRowError && a.limits.ok);
    if (countEl) countEl.textContent = a.changeCount ? `${a.changeCount} change${a.changeCount === 1 ? '' : 's'}` : 'No changes yet';
  }
  let limitsEl = null;
  let reviewBtn = null;
  let countEl = null;

  /* ── Value controls ────────────────────────────────────────── */
  function touch(row) {
    row.touched = true;
    row.notice = '';
    refresh();
  }

  function listControl(row, id, disabled) {
    const wrap = h('div', { className: 'meta-chips' });
    const input = ATK.Input({ placeholder: 'Add a tag' });
    input.id = id;
    input.disabled = disabled;
    input.autocomplete = 'off';
    function draw() {
      wrap.replaceChildren(
        ...row.raw.map((tag, i) => h('span', { className: 'meta-chip' }, [
          tag,
          h('button', {
            type: 'button', className: 'meta-chip__x', disabled: disabled || null,
            'aria-label': `Remove tag ${tag}`,
            onClick: () => { row.raw = row.raw.filter((_, j) => j !== i); touch(row); draw(); input.focus(); },
          }, '×'),
        ])),
        input,
      );
    }
    function add() {
      const text = input.value.replace(/,+\s*$/, '').trim();
      if (!text) return;
      row.raw = [...row.raw, text];
      input.value = '';
      touch(row);
      draw();
      input.focus();
    }
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(); }
    });
    input.addEventListener('blur', add);
    draw();
    return wrap;
  }

  function valueControl(row, id, disabled) {
    const label = `Value of ${row.key || 'new property'}`;
    if (row.type === 'checkbox') {
      const box = h('input', { type: 'checkbox', id, className: 'meta-check', disabled: disabled || null });
      box.checked = !!row.raw;
      const word = h('span', null, row.raw ? 'On' : 'Off');
      box.addEventListener('change', () => { row.raw = box.checked; word.textContent = box.checked ? 'On' : 'Off'; touch(row); });
      return h('label', { className: 'meta-check-label', for: id }, [box, word]);
    }
    if (row.type === 'list') return listControl(row, id, disabled);
    const multiline = row.type === 'text' && (String(row.raw).includes('\n') || String(row.raw).length > 80);
    const control = multiline ? ATK.Textarea({ rows: 3 }) : ATK.Input({ type: row.type === 'number' ? 'number' : 'text' });
    if (row.type === 'number') control.step = 'any';
    control.value = row.raw;
    control.id = id;
    control.disabled = disabled;
    control.setAttribute('aria-label', label);
    control.addEventListener('input', () => { row.raw = control.value; touch(row); });
    return control;
  }

  /* ── Row menu: Type, Copy value, Remove ────────────────────── */
  function closeMenu(returnFocus) {
    if (!menu) return;
    const btn = menu.button;
    menu.node.remove();
    menu = null;
    if (returnFocus) btn?.focus();
  }

  function openMenuFor(row, wrap, button) {
    if (menu && menu.row === row) { closeMenu(true); return; }
    closeMenu();
    const locked = !row.unlocked;
    const items = [];
    if (!locked) {
      META_TYPES.forEach((t) => items.push({
        label: `Type: ${t.label}`, icon: t.value === row.type ? '✓' : '',
        onClick: () => { closeMenu(); changeType(row, t.value); },
      }));
      items.push({ separator: true });
    }
    items.push({ label: 'Copy value', onClick: () => { closeMenu(true); copyValue(row); } });
    if (locked) {
      items.push({ label: 'Unlock to edit or remove', onClick: () => { closeMenu(); row.unlocked = true; focusAfter = `meta-val-${row.id}`; render(); } });
    } else {
      items.push({ label: 'Remove', onClick: () => { closeMenu(); removeRow(row); } });
    }
    const node = h('div', { className: 'meta-menu' }, ATK.Menu({ items }));
    wrap.append(node);
    menu = { row, node, button };
    node.querySelector('button')?.focus();
  }

  async function copyValue(row) {
    const out = evaluate(row);
    try {
      await navigator.clipboard.writeText(metaShow(out.ok ? out.value : row.raw));
      live.textContent = `Copied the value of ${row.key}.`;
    } catch {
      live.textContent = "Couldn't copy the value.";
    }
  }

  function removeRow(row) {
    rows = rows.filter((r) => r !== row);
    live.textContent = `Removed ${row.key || 'new property'}, not saved yet.`;
    focusAfter = 'meta-add';
    render();
  }

  function changeType(row, to) {
    if (to === row.type) return;
    const now = evaluate(row);
    if (!now.ok) { row.notice = 'Fix the value before changing its type.'; refresh(); return; }
    // An empty value has nothing to adapt: just start the new type empty.
    const isEmpty = now.value === '' || now.value == null || (row.type === 'list' && !parseList(now.value).length);
    const out = isEmpty ? { ok: true, value: to === 'checkbox' ? false : '', lossy: false } : coerce(row.type, to, now.value);
    if (!out.ok) { row.notice = out.message; refresh(); return; }
    const apply = () => {
      row.type = to;
      row.raw = metaRawFor(to, out.value);
      row.touched = true;
      row.notice = '';
      focusAfter = `meta-val-${row.id}`;
      render();
    };
    if (!out.lossy) { apply(); return; }
    confirmChange(
      `Change ${row.key || 'this property'} to ${metaTypeInfo(to).label}?`,
      `Your ${metaTypeInfo(row.type).label.toLowerCase()} data is not compatible. It will be adapted to: ${metaShow(out.value)}`,
      apply,
    );
  }

  function confirmChange(title, message, onConfirm) {
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    const close = () => { document.removeEventListener('keydown', onKey); modal.remove(); };
    const ok = ATK.Button({ variant: 'primary', children: 'Change type', onClick: () => { close(); onConfirm(); } });
    const modal = ATK.Modal({
      title,
      children: h('p', null, message),
      footer: [ATK.Button({ variant: 'ghost', children: 'Cancel', onClick: close }), ok],
      onClose: () => document.removeEventListener('keydown', onKey),
    });
    document.addEventListener('keydown', onKey);
    document.body.append(modal);
    ok.focus();
  }

  /* ── Rendering ─────────────────────────────────────────────── */
  function rowEl(row) {
    const keyId = `meta-key-${row.id}`;
    const valId = `meta-val-${row.id}`;
    const tool = row.isNew ? null : metaToolFor(row.key);
    const locked = !row.unlocked;
    const t = metaTypeInfo(row.type);

    let keyNode;
    if (row.isNew) {
      keyNode = ATK.Input({ placeholder: 'name' });
      keyNode.id = keyId;
      keyNode.value = row.key;
      keyNode.maxLength = 60;
      keyNode.autocomplete = 'off';
      keyNode.spellcheck = false;
      keyNode.setAttribute('aria-label', 'Property name');
      keyNode.addEventListener('input', () => { row.key = keyNode.value; refresh(); });
    } else {
      keyNode = h('label', { className: 'meta-row__name', for: valId }, row.key);
    }
    row.keyErrEl = h('span', { className: 'meta-error', role: 'alert' });
    row.valErrEl = h('span', { className: 'meta-error', role: 'alert' });

    const typeTag = h('span', { className: 'meta-type' }, [h('span', { 'aria-hidden': 'true' }, t.icon), ` ${t.label}`]);
    const noteNodes = [];
    if (tool) {
      noteNodes.push(h('span', { className: 'meta-note' }, `Written by ${tool.by}`));
      if (locked) {
        noteNodes.push(ATK.Button({
          variant: 'ghost', size: 'sm', children: 'Edit anyway',
          onClick: () => { row.unlocked = true; focusAfter = valId; render(); },
        }));
      }
    }

    const menuWrap = h('div', { className: 'meta-menu-wrap' });
    const menuBtn = h('button', {
      type: 'button', className: 'meta-menu-btn', 'aria-haspopup': 'menu',
      'aria-label': `Options for ${row.key || 'new property'}`,
    }, '⋯');
    menuBtn.addEventListener('click', (e) => { e.stopPropagation(); openMenuFor(row, menuWrap, menuBtn); });
    menuWrap.append(menuBtn);

    return h('div', { className: 'meta-row' }, [
      h('div', { className: 'meta-row__key' }, [keyNode, typeTag, row.keyErrEl]),
      h('div', { className: 'meta-row__value' }, [valueControl(row, valId, locked), ...noteNodes, row.valErrEl]),
      menuWrap,
    ]);
  }

  function addRow() {
    const row = makeRow('', '', true);
    rows.push(row);
    focusAfter = `meta-key-${row.id}`;
    render();
  }

  function editBody() {
    limitsEl = h('p', { className: 'meta-error', role: 'alert' });
    countEl = h('span', { className: 'muted' });
    reviewBtn = ATK.Button({ variant: 'primary', children: 'Review changes', disabled: true, onClick: openReview });
    const addBtn = ATK.Button({ variant: 'ghost', size: 'sm', children: '+ Add property', onClick: addRow });
    addBtn.id = 'meta-add';
    const body = h('div', { className: 'meta-edit' }, [
      limitsEl,
      rows.length ? h('div', { className: 'meta-rows' }, rows.map(rowEl)) : h('p', { className: 'muted' }, 'No properties yet.'),
      h('div', null, addBtn),
      h('div', { className: 'meta-actions' }, [
        reviewBtn,
        ATK.Button({ variant: 'ghost', children: 'Cancel', onClick: cancel }),
        countEl,
      ]),
    ]);
    return body;
  }

  function reviewList(title, items, describe) {
    if (!items.length) return null;
    return h('div', { className: 'meta-review__group' }, [
      h('h4', { className: 'meta-review__title' }, `${title} (${items.length})`),
      h('ul', null, items.map((it) => h('li', null, describe(it)))),
    ]);
  }

  function reviewBody() {
    const d = diffMetadata(original, applyPatchTo(original, patch));
    const typeWord = (v) => metaTypeInfo(detectType(v)).label.toLowerCase();
    const body = [];
    if (stale.length) {
      body.push(h('p', { className: 'meta-warning', role: 'alert' },
        `${stale.join(', ')} changed on are.na since you started editing. Saving will overwrite ${stale.length === 1 ? 'it' : 'them'}.`));
    }
    body.push(
      reviewList('Added', d.added, (a) => [h('code', null, a.key), ` = ${metaShow(a.value)} `, h('span', { className: 'muted' }, `(${typeWord(a.value)})`)]),
      reviewList('Changed', d.changed, (c) => [h('code', null, c.key), `: ${metaShow(c.from)} → ${metaShow(c.to)} `,
        c.fromType !== c.toType ? h('span', { className: 'muted' }, `(${c.fromType} → ${c.toType})`) : null]),
      reviewList('Removed', d.removed, (r) => [h('code', null, r.key), ` (was ${metaShow(r.value)})`]),
      h('div', { className: 'meta-review__group' }, [
        h('h4', { className: 'meta-review__title' }, `Request body for PUT /v3/blocks/${current.id}`),
        h('pre', { className: 'meta-json', tabindex: '0' }, JSON.stringify({ metadata: patch }, null, 2)),
      ]),
    );
    if (saveError) body.push(h('p', { className: 'meta-warning', role: 'alert' }, saveError));
    body.push(h('div', { className: 'meta-actions' }, [
      ATK.Button({ variant: 'primary', children: busy === 'saving' ? 'Saving…' : 'Save', disabled: busy === 'saving', onClick: save }),
      ATK.Button({ variant: 'secondary', children: 'Back to editing', disabled: busy === 'saving', onClick: () => { saveError = ''; mode = 'edit'; render(); } }),
      ATK.Button({ variant: 'ghost', children: 'Cancel', disabled: busy === 'saving', onClick: cancel }),
    ]));
    return h('div', { className: 'meta-review' }, body);
  }

  // `original` with the patch applied: null removes a key.
  function applyPatchTo(base, p) {
    const out = { ...base };
    for (const [k, v] of Object.entries(p)) {
      if (v === null) delete out[k]; else out[k] = v;
    }
    return out;
  }

  function headerEl() {
    const count = Object.keys(current.metadata || {}).length;
    const head = [h('h3', { className: 'metadata__title' }, [
      'Metadata ', ATK.Badge({ children: String(count) }),
      mode !== 'view' ? ATK.Badge({ variant: 'focus', children: mode === 'review' ? 'Reviewing' : 'Editing' }) : null,
    ])];
    if (mode === 'view') {
      if (current.can && current.can.manage === false) {
        head.push(h('span', { className: 'muted', title: 'You can only edit blocks you own' }, 'Read-only'));
      } else {
        head.push(ATK.Button({ variant: 'secondary', size: 'sm', children: 'Edit', onClick: startEditing }));
      }
    }
    return h('div', { className: 'metadata__head' }, head);
  }

  function render() {
    closeMenu();
    limitsEl = reviewBtn = countEl = null;
    const body = mode === 'view' ? renderView(current.metadata)
      : mode === 'edit' ? editBody()
      : reviewBody();
    root.replaceChildren(...[
      headerEl(),
      notice ? h('p', { className: 'meta-warning', role: 'alert' }, notice) : null,
      body,
      live,
    ].filter(Boolean));
    if (mode === 'edit') refresh();
    if (focusAfter) {
      document.getElementById(focusAfter)?.focus();
      focusAfter = null;
    }
  }

  /* ── Flow ──────────────────────────────────────────────────── */
  const onDocClick = (e) => { if (menu && !menu.node.parentNode.contains(e.target)) closeMenu(); };
  const onDocKey = (e) => { if (e.key === 'Escape' && menu) closeMenu(true); };
  const onBeforeUnload = (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } };

  function listen(on) {
    const act = on ? 'addEventListener' : 'removeEventListener';
    document[act]('click', onDocClick);
    document[act]('keydown', onDocKey);
    window[act]('beforeunload', onBeforeUnload);
  }

  async function startEditing() {
    if (mode !== 'view') return;
    notice = '';
    const gate = await requestWrite();
    if (!gate.ok) {
      notice = gate.message || '';
      render();
      return;
    }
    original = { ...(current.metadata || {}) };
    rows = Object.entries(original).map(([k, v]) => makeRow(k, v, false));
    mode = 'edit';
    saveError = '';
    listen(true);
    render();
    live.textContent = 'Editing metadata.';
  }

  function leaveEditing() {
    mode = 'view';
    rows = [];
    patch = {};
    stale = [];
    saveError = '';
    busy = '';
    listen(false);
  }

  function cancel() {
    leaveEditing();
    focusAfter = null;
    render();
    live.textContent = 'Edits discarded.';
  }

  async function openReview() {
    const a = analyse();
    if (!(a.changeCount > 0 && !a.hasRowError && a.limits.ok)) return;
    patch = buildPatch(original, a.meta);
    stale = [];
    reviewBtn.disabled = true;
    reviewBtn.textContent = 'Checking…';
    try {
      const fresh = await client.getBlock(current.id);
      const now = fresh.metadata || {};
      stale = Object.keys(patch).filter((k) => !Object.is(now[k], original[k]));
    } catch {
      /* The check is a courtesy; the PUT is a merge either way. */
    }
    saveError = '';
    mode = 'review';
    render();
  }

  async function save() {
    if (busy) return;
    busy = 'saving';
    saveError = '';
    render();
    try {
      const res = await client.updateBlock(current.id, { metadata: patch });
      const saved = res && res.id != null ? res : await client.getBlock(current.id);
      current = { ...current, ...saved };
      leaveEditing();
      notice = '';
      render();
      live.textContent = 'Saved.';
      if (onSaved) onSaved(current);
    } catch (err) {
      busy = '';
      saveError = metaSaveError(err);
      render();
    }
  }

  render();
  return { element: root, startEditing, isDirty };
}

</script>
<script>
// Are.na Palimpsest: inspect a block's metadata, connections and channels; edit a block's own metadata.
// Plain DOM, built from ArenaToolkit components. No framework.
(function () {
  const ATK = window.ArenaToolkit;

  function h(tag, attrs, kids) {
    return ATK._el(tag, attrs, kids);
  }

  const throttle = createThrottle({ onWait: (s) => showWait(s) });
  const client = createArenaClient({ throttle });

  const els = {
    header: document.getElementById('header'),
    inputBar: document.getElementById('input-bar'),
    resultPane: document.getElementById('result-pane'),
  };

  /* ── Rate-limit feedback ─────────────────────────────────────── */
  let waitBanner = null;
  let waitTimer = null;
  function showWait(seconds) {
    if (!waitBanner) {
      waitBanner = h('p', { className: 'muted', role: 'status' });
      els.inputBar.append(waitBanner);
    }
    waitBanner.textContent = `Waiting ${seconds}s for are.na's rate limit…`;
    clearTimeout(waitTimer);
    waitTimer = setTimeout(() => { waitBanner?.remove(); waitBanner = null; }, seconds * 1000 + 500);
  }

  /* ── Header and Connect ──────────────────────────────────────── */
  const authSlot = h('div', { className: 'palimpsest-header__auth' });
  let connectModal = null;

  // Set when Edit needs a write token: the Connect modal then asks for one, and once it is
  // connected the block is reloaded (so `can` is known) and put straight into edit mode.
  let pendingEditId = null;

  const auth = createAuthStep({
    client,
    onChange: (user) => {
      renderAuthSlot(user);
      if (!user) return;
      closeConnect();
      if (pendingEditId != null) {
        const id = pendingEditId;
        pendingEditId = null;
        inspect(String(id), { autoEdit: true, skipDirtyCheck: true });
      }
    },
  });

  function openConnect() {
    if (connectModal) return;
    connectModal = ATK.Modal({
      title: 'Connect to are.na',
      children: auth.element,
      onClose: () => { connectModal = null; endWriteMode(); },
    });
    document.body.append(connectModal);
  }

  function closeConnect() {
    connectModal?.remove();
    connectModal = null;
    endWriteMode();
  }

  // Back to the read-only Connect wording once the write prompt is over.
  function endWriteMode() {
    if (pendingEditId == null && !writePrompt) return;
    writePrompt = false;
    if (!auth.getUser()) pendingEditId = null;
    auth.setRequireWrite(false);
  }
  let writePrompt = false;

  // Can this token edit? If not, open Connect asking for a write token.
  async function requestWrite(blockId) {
    let writable;
    try {
      writable = await auth.ensureWrite();
    } catch (err) {
      return { ok: false, message: `Couldn't check the token: ${describeConnectError(err)}` };
    }
    if (writable) return { ok: true };
    writePrompt = true;
    pendingEditId = blockId;
    auth.setRequireWrite(true, 'Editing needs a token with write access.');
    openConnect();
    return { ok: false };
  }

  let menuEl = null;
  function closeMenu() {
    menuEl?.remove();
    menuEl = null;
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeConnect(); closeMenu(); }
  });
  document.addEventListener('click', (e) => {
    if (menuEl && !authSlot.contains(e.target)) closeMenu();
  });

  function toggleMenu() {
    if (menuEl) { closeMenu(); return; }
    menuEl = h('div', { className: 'auth-menu' }, ATK.Menu({
      items: [{ label: 'Disconnect', onClick: () => { closeMenu(); auth.disconnect(); } }],
    }));
    authSlot.append(menuEl);
  }

  function renderAuthSlot(user) {
    closeMenu();
    if (!user) {
      const link = ATK.Link({ children: 'Connect →' });
      link.addEventListener('click', (e) => { e.preventDefault(); openConnect(); });
      authSlot.replaceChildren(link);
      return;
    }
    const chip = h('button', { className: 'chip-button', type: 'button', 'aria-haspopup': 'menu', onClick: toggleMenu },
      ATK.Badge({ variant: 'success', children: `Connected as @${user.slug} ⌄` }));
    authSlot.replaceChildren(chip);
  }

  function mountHeader() {
    const crumbs = h('nav', { className: 'crumbs', 'aria-label': 'Breadcrumb' },
      h('ol', null, [
        h('li', null, ATK.Link({ variant: 'muted', href: 'index.html', children: 'Are.na Tools' })),
        h('li', { 'aria-current': 'page' }, 'Are.na Palimpsest'),
      ]));
    const end = h('div', { className: 'palimpsest-header__end' }, [authSlot, ATK.ThemeChooser()]);
    els.header.append(crumbs, end);
    renderAuthSlot(null);
  }

  /* ── Input bar ───────────────────────────────────────────────── */
  let inputEl = null;
  let inspectBtn = null;
  let hintSlot = null;
  let historySlot = null;
  const HISTORY_KEY = 'arena_palimpsest_history';
  const LAST_INPUT_KEY = 'arena_palimpsest_last_input';

  function mountInputBar() {
    inputEl = ATK.Input({
      placeholder: 'Paste a block URL or ID (e.g. 13857023 or https://www.are.na/block/13857023)',
    });
    inputEl.id = 'block-input';
    inputEl.autocomplete = 'off';
    inputEl.spellcheck = false;

    inspectBtn = ATK.Button({ variant: 'primary', children: 'Inspect', onClick: () => inspect(inputEl.value) });
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') inspect(inputEl.value); });
    hintSlot = h('div', { className: 'input-bar__hint', role: 'alert' });
    historySlot = h('div', { className: 'history' });

    inputEl.value = readJson(localStorage, LAST_INPUT_KEY, '') || '';

    els.inputBar.append(
      h('label', { for: 'block-input' }, 'Block to inspect'),
      h('div', { className: 'input-bar__row' }, [inputEl, inspectBtn]),
      hintSlot,
      historySlot,
    );
    renderHistory();
  }

  /* ── History ─────────────────────────────────────────────────── */
  function renderHistory() {
    const list = cleanHistory(readJson(localStorage, HISTORY_KEY, []));
    if (!list.length) { historySlot.replaceChildren(); return; }
    historySlot.replaceChildren(
      h('span', { className: 'muted' }, 'Recent:'),
      ...list.map((entry) => h('button', {
        className: 'chip-button',
        type: 'button',
        title: entry.title || `Block ${entry.id}`,
        onClick: () => { inputEl.value = String(entry.id); inspect(inputEl.value); },
      }, ATK.Badge({ children: String(entry.id) }))),
    );
  }

  function remember(raw, block) {
    writeJson(localStorage, LAST_INPUT_KEY, raw);
    const entry = { id: block.id, title: block.title || '', at: new Date().toISOString() };
    writeJson(localStorage, HISTORY_KEY, updateHistory(cleanHistory(readJson(localStorage, HISTORY_KEY, [])), entry));
    renderHistory();
  }

  function setHint(text) {
    hintSlot.replaceChildren(...(text ? [ATK.Badge({ variant: 'alert', children: 'Not a block' }), text] : []));
  }

  /* ── Result pane ─────────────────────────────────────────────── */
  function renderPlaceholder() {
    els.resultPane.replaceChildren(
      h('p', { className: 'muted' }, 'Nothing inspected yet. Paste a block URL or ID above to see its fields, metadata and connections.'),
    );
  }

  /* Label/value rows. Values are nodes, so v2 can swap a value cell for an Input. */
  const EMPTY = () => h('span', { className: 'muted' }, '—');

  function valueNode(value) {
    if (value == null || value === '') return EMPTY();
    if (typeof value === 'string') {
      const href = webUrl(value);
      return href ? extLink(value, href) : document.createTextNode(value);
    }
    return typeof value === 'number' ? document.createTextNode(String(value)) : value;
  }

  function kvTable(rows) {
    return h('table', { className: 'kv' }, h('tbody', null, rows.map(([label, value]) =>
      h('tr', null, [h('th', { scope: 'row' }, label), h('td', null, valueNode(value))]),
    )));
  }

  function extLink(text, href) {
    const a = ATK.Link({ href, children: text });
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }

  function userLink(user) {
    const href = userUrl(user);
    return href ? extLink(userHandle(user), href) : userHandle(user);
  }

  function copyLink(text) {
    const a = ATK.Link({ variant: 'muted', children: 'copy' });
    a.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await navigator.clipboard.writeText(text);
        a.textContent = 'copied';
      } catch {
        a.textContent = "couldn't copy";
      }
      setTimeout(() => { a.textContent = 'copy'; }, 1500);
    });
    return a;
  }

  function metadataView(metadata) {
    const entries = metadataEntries(metadata);
    return entries.length
      ? kvTable(entries)
      : h('p', { className: 'muted' }, 'No metadata set');
  }

  // The block's own metadata, with the Edit toggle.
  let currentEditor = null;
  function blockMetadataSection(block) {
    currentEditor = createMetadataEditor({
      block,
      client,
      renderView: metadataView,
      requestWrite: () => requestWrite(block.id),
      onSaved: (saved) => remember(String(saved.id), saved),
    });
    return currentEditor.element;
  }

  function metadataSection(metadata) {
    const entries = metadataEntries(metadata);
    return h('div', { className: 'metadata' }, [
      h('h3', { className: 'metadata__title' }, [
        'Metadata ',
        ATK.Badge({ children: String(entries.length) }),
      ]),
      entries.length
        ? kvTable(entries)
        : h('p', { className: 'muted' }, 'No metadata set'),
    ]);
  }

  function blockThumb(block) {
    const src = block.image?.medium?.src || block.embed?.thumbnail_url;
    let thumb = null;
    if (src) {
      thumb = ATK.Block({ variant: 'image', src, alt: block.image?.alt_text || block.title || '' });
    } else if (block.type === 'Text') {
      thumb = ATK.Block({ variant: 'text', children: block.content?.plain || '' });
    } else if (block.type === 'Attachment') {
      thumb = ATK.Block({ variant: 'attachment', label: (block.attachment?.file_extension || '').toUpperCase() || null });
    }
    return thumb ? h('div', { className: 'block-frame__thumb' }, thumb) : null;
  }

  let connectedCell = null;

  function renderBlock(block) {
    connectedCell = h('span', { className: 'muted' }, 'loading…');
    const fields = [
      ['ID', h('span', { className: 'kv__inline' }, [
        String(block.id), copyLink(String(block.id)),
      ])],
      ['Class', block.type],
      ['Title', block.title],
      ['Alt text', block.image?.alt_text],
      ['Description', block.description?.markdown ? h('div', { className: 'prewrap' }, block.description.markdown.trim()) : null],
      ['Source URL', block.source?.url ? extLink(block.source.url, block.source.url) : null],
      ['Source title', block.source?.title],
      ['Owner', userLink(block.user)],
      ['Visibility', [block.visibility, block.state && block.state !== 'available' ? block.state : null].filter(Boolean).join(', ')],
      ['Created', formatDate(block.created_at)],
      ['Updated', formatDate(block.updated_at)],
      ['Connected to', connectedCell],
    ];
    const thumb = blockThumb(block);
    const frame = h('div', { className: 'block-frame', 'data-visibility': block.visibility || 'unknown' }, [
      thumb,
      h('h2', { className: 'block-frame__title' }, `Block ${block.id}`),
      h('div', { className: 'block-frame__link' }, extLink('open on are.na', blockUrl(block.id))),
    ]);
    return h('div', { className: 'block-layout' }, [
      frame,
      h('div', { className: 'block-data' }, [blockMetadataSection(block), kvTable(fields)]),
    ]);
  }

  function channelRow(ch) {
    const counts = ch.counts || {};
    const url = channelUrl(ch);
    const ownerHref = ownerUrl(ch.owner);
    const fields = [
      ['Channel', url ? extLink(ch.title, url) : ch.title],
      ['Slug', ch.slug],
      ['ID', String(ch.id)],
      ['Owner', ownerHref ? extLink(ownerLabel(ch.owner), ownerHref) : ownerLabel(ch.owner)],
      ['Visibility', ch.visibility],
      ['Description', ch.description?.markdown ? h('div', { className: 'prewrap' }, ch.description.markdown.trim()) : null],
      ['Blocks', counts.blocks],
      ['Contents', counts.contents],
      ['Collaborators', counts.collaborators],
      ['Created', formatDate(ch.created_at)],
      ['Updated', formatDate(ch.updated_at)],
    ];
    return ATK.ChannelRow({
      title: ch.title || ch.slug,
      visibility: ch.visibility || 'unknown',
      count: formatCount(counts.contents ?? counts.blocks),
      metadataCount: metadataEntries(ch.metadata).length,
      owner: ownerLabel(ch.owner),
      children: [metadataSection(ch.metadata), kvTable(fields)],
    });
  }

  async function loadConnections(id, run) {
    const channels = [];
    const rows = new Map();
    let mode = 'default';
    const list = ATK.ChannelList({
      sorts: CHANNEL_SORTS,
      onSort: (value) => { mode = value; list.setRows(sortChannels(channels, mode).map((ch) => rows.get(ch))); },
      rows: [h('p', { className: 'muted' }, 'Loading channels…')],
    });
    const note = h('p', { className: 'muted' },
      "are.na doesn't show connection details (position, who connected it, when, or connection metadata) from a block's side, so this lists the channels themselves.");
    const card = ATK.Card({ title: 'Connected channels', children: h('div', { className: 'stack' }, [note, list]) });
    const title = card.querySelector('.atk-card__title');
    els.resultPane.append(card);

    let seen = 0;
    try {
      await client.getBlockConnections(id, {
        onPage: (items, meta) => {
          if (run !== inspectRun) return;
          seen += items.length;
          items.forEach((ch) => { channels.push(ch); rows.set(ch, channelRow(ch)); });
          list.setRows(sortChannels(channels, mode).map((ch) => rows.get(ch)));
          title.textContent = `Connected channels (${meta?.total_count ?? seen})`;
        },
      });
      if (run !== inspectRun) return;
      if (!seen) {
        list.setRows([h('p', { className: 'muted' }, 'Not connected to any channel you can see.')]);
        title.textContent = 'Connected channels (0)';
      }
      connectedCell.textContent = `${seen} channel${seen === 1 ? '' : 's'}`;
    } catch (err) {
      if (run !== inspectRun) return;
      list.setRows([h('p', null, `Couldn't load the channels: ${describeConnectError(err)}`)]);
      connectedCell.textContent = 'unknown';
    }
  }

  function messageCard(title, ...kids) {
    return ATK.Card({ title, children: h('div', { className: 'stack' }, kids) });
  }

  function renderBlockError(id, err) {
    if (err.status === 401 || err.status === 403) {
      const link = ATK.Link({ children: 'Connect to are.na' });
      link.addEventListener('click', (e) => { e.preventDefault(); openConnect(); });
      return messageCard(
        'This block requires authentication',
        h('p', null, ['Block ', String(id), ' is private, or in a private channel. ', link, ' with a token that can read it.']),
      );
    }
    if (err.status === 404) {
      return messageCard(
        `Block ${id} not found or you don't have access`,
        h('p', { className: 'muted' }, "If it's in a private channel, connect your account with a token that can read it."),
      );
    }
    return messageCard("Couldn't load that block", h('p', null, describeConnectError(err)));
  }

  let inspectRun = 0;

  async function inspect(raw, { autoEdit = false, skipDirtyCheck = false } = {}) {
    const id = parseBlockInput(raw);
    if (id == null) {
      setHint("That doesn't look like a block URL or ID. Try 13857023 or https://www.are.na/block/13857023.");
      return;
    }
    if (!skipDirtyCheck && currentEditor?.isDirty() && !window.confirm('You have unsaved metadata changes. Discard them?')) return;
    currentEditor = null;
    setHint('');
    const run = ++inspectRun;
    inspectBtn.disabled = true;
    els.resultPane.replaceChildren(messageCard(`Block ${id}`, h('p', { className: 'muted' }, 'Loading…')));
    try {
      const block = await client.getBlock(id);
      if (run !== inspectRun) return;
      els.resultPane.replaceChildren(renderBlock(block));
      remember(raw, block);
      if (autoEdit && !(block.can && block.can.manage === false)) currentEditor?.startEditing();
      await loadConnections(id, run);
    } catch (err) {
      if (run !== inspectRun) return;
      els.resultPane.replaceChildren(renderBlockError(id, err));
    } finally {
      if (run === inspectRun) inspectBtn.disabled = false;
    }
  }

  /* ── Start ───────────────────────────────────────────────────── */
  mountHeader();
  mountInputBar();
  renderPlaceholder();
  auth.restore();
})();

</script>
</body>
</html>
